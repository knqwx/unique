<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            background-color: #1a1d24;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            flex-direction: column;
        }

        #fileInput {
            display: none;
        }

        .drop-zone {
            background-color: #14161b;
            border: 2px dashed rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 40px 60px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #94a3b8;
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: rgba(255, 255, 255, 0.3);
            background-color: #181b22;
            color: #ffffff;
        }

        .drop-zone-text {
            font-size: 0.95rem;
            font-weight: 500;
        }

        .drop-zone-hint {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 6px;
        }

        .canvas-container {
            display: none;
            background-color: #14161b;
            border-radius: 16px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .media-box {
            background-color: #000000;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: crosshair;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            flex-shrink: 0;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .toolbar {
            display: flex;
            gap: 15px;
            width: 100%;
            justify-content: space-between;
            align-items: center;
            color: #94a3b8;
            font-size: 0.85rem;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn {
            background-color: #21262d;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #c9d1d9;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #30363d;
            color: #ffffff;
        }

        .btn.active {
            background-color: #3e4854;
            border-color: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="drop-zone" id="dropZone">
        <div class="drop-zone-text">Drag and drop file here or click to select</div>
        <div class="drop-zone-hint">Supports any image files</div>
        <input type="file" id="fileInput" accept="image/*">
    </div>

    <div class="canvas-container" id="canvasContainer">
        <div class="media-box" id="mediaBox">
            <canvas id="previewCanvas"></canvas>
        </div>
        <div class="toolbar">
            <span>Пиксельное рисование (сплошная линия)</span>
            <div class="controls">
                <button class="btn active" id="pencilBtn">Карандаш</button>
                <button class="btn" id="eraserBtn">Ластик</button>
                <button class="btn" id="clearBtn">Очистить</button>
            </div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const canvasContainer = document.getElementById('canvasContainer');
        const mediaBox = document.getElementById('mediaBox');
        const canvas = document.getElementById('previewCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });

        const pencilBtn = document.getElementById('pencilBtn');
        const eraserBtn = document.getElementById('eraserBtn');
        const clearBtn = document.getElementById('clearBtn');

        let isDrawing = false;
        let originalImage = null;
        let currentTool = 'pencil';
        let lastX = 0;
        let lastY = 0;

        function setupContext() {
            ctx.imageSmoothingEnabled = false;
            ctx.mozImageSmoothingEnabled = false;
            ctx.webkitImageSmoothingEnabled = false;
            ctx.msImageSmoothingEnabled = false;
        }

        dropZone.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) handleImage(file);
        });

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.add('dragover');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.remove('dragover');
            }, false);
        });

        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const file = dt.files[0];
            if (file) handleImage(file);
        });

        function handleImage(file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    originalImage = img;
                    dropZone.style.display = 'none';
                    canvasContainer.style.display = 'flex';

                    const maxWidth = window.innerWidth * 0.85;
                    const maxHeight = window.innerHeight * 0.8;

                    let w = img.width;
                    let h = img.height;

                    if (w > maxWidth || h > maxHeight) {
                        const ratio = Math.min(maxWidth / w, maxHeight / h);
                        w = Math.round(w * ratio);
                        h = Math.round(h * ratio);
                    }

                    mediaBox.style.width = w + 'px';
                    mediaBox.style.height = h + 'px';

                    canvas.width = w;
                    canvas.height = h;

                    setupContext();
                    redrawCanvas();
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        }

        function redrawCanvas() {
            if (!originalImage) return;
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(originalImage, 0, 0, canvas.width, canvas.height);
            setupContext();
        }

        pencilBtn.addEventListener('click', () => {
            currentTool = 'pencil';
            pencilBtn.classList.add('active');
            eraserBtn.classList.remove('active');
        });

        eraserBtn.addEventListener('click', () => {
            currentTool = 'eraser';
            eraserBtn.classList.add('active');
            pencilBtn.classList.remove('active');
        });

        clearBtn.addEventListener('click', redrawCanvas);

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: Math.floor(e.clientX - rect.left),
                y: Math.floor(e.clientY - rect.top)
            };
        }

        // Функция отрисовки линии по точкам (без промежутков)
        function drawLine(x0, y0, x1, y1) {
            const dx = Math.abs(x1 - x0);
            const dy = Math.abs(y1 - y0);
            const sx = (x0 < x1) ? 1 : -1;
            const sy = (y0 < y1) ? 1 : -1;
            let err = dx - dy;

            let cx = x0;
            let cy = y0;

            while (true) {
                if (cx >= 0 && cx < canvas.width && cy >= 0 && cy < canvas.height) {
                    if (currentTool === 'pencil') {
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(cx, cy, 1, 1);
                    } else {
                        const pixelData = ctx.getImageData(cx, cy, 1, 1).data;
                        ctx.fillStyle = `rgb(${pixelData[0]}, ${pixelData[1]}, ${pixelData[2]})`;
                        ctx.fillRect(cx, cy, 1, 1);
                    }
                }

                if (cx === x1 && cy === y1) break;
                const e2 = 2 * err;
                if (e2 > -dy) {
                    err -= dy;
                    cx += sx;
                }
                if (e2 < dx) {
                    err += dx;
                    cy += sy;
                }
            }
        }

        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            const pos = getMousePos(e);
            lastX = pos.x;
            lastY = pos.y;
            drawLine(lastX, lastY, lastX, lastY); // Рисуем стартовую точку
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            const pos = getMousePos(e);
            drawLine(lastX, lastY, pos.x, pos.y);
            lastX = pos.x;
            lastY = pos.y;
        });

        window.addEventListener('mouseup', () => {
            isDrawing = false;
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            isDrawing = true;
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            lastX = Math.floor(touch.clientX - rect.left);
            lastY = Math.floor(touch.clientY - rect.top);
            drawLine(lastX, lastY, lastX, lastY);
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            if (!isDrawing) return;
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor(touch.clientX - rect.left);
            const y = Math.floor(touch.clientY - rect.top);
            drawLine(lastX, lastY, x, y);
            lastX = x;
            lastY = y;
        }, { passive: false });

        window.addEventListener('touchend', () => {
            isDrawing = false;
        });
    </script>
</body>
</html>
