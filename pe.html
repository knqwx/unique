<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            background-color: #1a1d24;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            flex-direction: column;
        }

        #fileInput {
            display: none;
        }

        .drop-zone {
            background-color: #14161b;
            border: 2px dashed rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 40px 60px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #94a3b8;
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: rgba(255, 255, 255, 0.3);
            background-color: #181b22;
            color: #ffffff;
        }

        .drop-zone-text {
            font-size: 0.95rem;
            font-weight: 500;
        }

        .drop-zone-hint {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 6px;
        }

        .canvas-container {
            display: none;
            background-color: #14161b;
            border-radius: 16px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .media-box {
            background-color: #000000;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: crosshair;
        }

        canvas {
            display: block;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: space-between;
            align-items: center;
            color: #94a3b8;
            font-size: 0.85rem;
        }

        .btn {
            background-color: #21262d;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #c9d1d9;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #30363d;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="drop-zone" id="dropZone">
        <div class="drop-zone-text">Drag and drop file here or click to select</div>
        <div class="drop-zone-hint">Supports any image files</div>
        <input type="file" id="fileInput" accept="image/*">
    </div>

    <div class="canvas-container" id="canvasContainer">
        <div class="media-box" id="mediaBox">
            <canvas id="previewCanvas"></canvas>
        </div>
        <div class="toolbar">
            <span>Зажмите мышь для рисования</span>
            <button class="btn" id="clearBtn">Очистить рисунок</button>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const canvasContainer = document.getElementById('canvasContainer');
        const mediaBox = document.getElementById('mediaBox');
        const canvas = document.getElementById('previewCanvas');
        const ctx = canvas.getContext('2d');
        const clearBtn = document.getElementById('clearBtn');

        let isDrawing = false;
        let originalImage = null;

        dropZone.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) handleImage(file);
        });

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.add('dragover');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.remove('dragover');
            }, false);
        });

        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const file = dt.files[0];
            if (file) handleImage(file);
        });

        function handleImage(file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    originalImage = img;
                    dropZone.style.display = 'none';
                    canvasContainer.style.display = 'flex';

                    const maxWidth = window.innerWidth * 0.88;
                    const maxHeight = window.innerHeight * 0.82;

                    let w = img.width;
                    let h = img.height;

                    if (w > maxWidth || h > maxHeight) {
                        const ratio = Math.min(maxWidth / w, maxHeight / h);
                        w = Math.round(w * ratio);
                        h = Math.round(h * ratio);
                    }

                    mediaBox.style.width = w + 'px';
                    mediaBox.style.height = h + 'px';

                    canvas.width = w;
                    canvas.height = h;

                    redrawCanvas();
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        }

        function redrawCanvas() {
            if (!originalImage) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(originalImage, 0, 0, canvas.width, canvas.height);
        }

        // Логика рисования (ручка)
        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }

        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            const pos = getMousePos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            ctx.strokeStyle = '#ef4444'; // Цвет ручки (красный для заметности, можно сменить на '#ffffff')
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            const pos = getMousePos(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
        });

        window.addEventListener('mouseup', () => {
            if (isDrawing) {
                isDrawing = false;
                ctx.closePath();
            }
        });

        // Поддержка сенсорных экранов
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            isDrawing = true;
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            ctx.beginPath();
            ctx.moveTo(touch.clientX - rect.left, touch.clientY - rect.top);
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
        });

        canvas.addEventListener('touchmove', (e) => {
            if (!isDrawing) return;
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            ctx.lineTo(touch.clientX - rect.left, touch.clientY - rect.top);
            ctx.stroke();
        });

        canvas.addEventListener('touchend', () => {
            if (isDrawing) {
                isDrawing = false;
                ctx.closePath();
            }
        });

        clearBtn.addEventListener('click', () => {
            redrawCanvas();
        });
    </script>

</body>
</html>
