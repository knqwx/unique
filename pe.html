<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            background-color: #1a1d24;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        #fileInput {
            display: none;
        }

        .drop-zone {
            background-color: #14161b;
            border: 2px dashed rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 40px 60px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #94a3b8;
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: rgba(255, 255, 255, 0.3);
            background-color: #181b22;
            color: #ffffff;
        }

        .drop-zone-text {
            font-size: 0.95rem;
            font-weight: 500;
        }

        .drop-zone-hint {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 6px;
        }

        .canvas-container {
            display: none;
            background-color: #14161b;
            border-radius: 16px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .media-box {
            background-color: #000000;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <div class="drop-zone" id="dropZone">
        <div class="drop-zone-text">Drag and drop file here or click to select</div>
        <div class="drop-zone-hint">Supports any image files</div>
        <input type="file" id="fileInput" accept="image/*">
    </div>

    <div class="canvas-container" id="canvasContainer">
        <div class="media-box" id="mediaBox">
            <canvas id="previewCanvas"></canvas>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const canvasContainer = document.getElementById('canvasContainer');
        const mediaBox = document.getElementById('mediaBox');
        const canvas = document.getElementById('previewCanvas');
        const ctx = canvas.getContext('2d');

        dropZone.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) handleImage(file);
        });

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.add('dragover');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.remove('dragover');
            }, false);
        });

        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const file = dt.files[0];
            if (file) handleImage(file);
        });

        function handleImage(file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    dropZone.style.display = 'none';
                    canvasContainer.style.display = 'flex';

                    const maxWidth = window.innerWidth * 0.88;
                    const maxHeight = window.innerHeight * 0.88;

                    let w = img.width;
                    let h = img.height;

                    if (w > maxWidth || h > maxHeight) {
                        const ratio = Math.min(maxWidth / w, maxHeight / h);
                        w = Math.round(w * ratio);
                        h = Math.round(h * ratio);
                    }

                    mediaBox.style.width = w + 'px';
                    mediaBox.style.height = h + 'px';

                    canvas.width = w;
                    canvas.height = h;

                    ctx.clearRect(0, 0, w, h);
                    ctx.drawImage(img, 0, 0, w, h);
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        }
    </script>

</body>
</html>
