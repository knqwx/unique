<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #252a33;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', sans-serif;
            color: #c9d1d9;
            overflow: hidden;
        }

        .top-bar {
            height: 50px;
            background: #21262d;
            border-bottom: 1px solid #303642;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 15px;
            z-index: 10;
        }

        .controls-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        label {
            font-size: 13px;
            color: #8b949e;
        }

        input[type="text"] {
            background: #303642;
            border: 1px solid #484f58;
            color: #c9d1d9;
            padding: 5px 8px;
            border-radius: 4px;
            width: 70px;
            outline: none;
            font-size: 13px;
            text-align: center;
        }

        input[type="text"]:focus {
            border-color: #58a6ff;
        }

        button {
            background: #303642;
            border: 1px solid #484f58;
            color: #c9d1d9;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
        }

        button:hover {
            background: #38404d;
            border-color: #58a6ff;
        }

        button.active-grid {
            background: #238636;
            border-color: #2ea043;
            color: #ffffff;
        }

        .app-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 50px);
            position: relative;
            overflow: hidden;
        }

        .workspace {
            flex: 1;
            background-color: #252a33;
            position: relative;
            overflow: hidden;
            cursor: default;
        }

        .canvas-wrapper {
            position: absolute;
            background: #ffffff;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            border-radius: 4px;
            overflow: hidden;
            line-height: 0;
            transform-origin: 0 0;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            cursor: crosshair;
        }

        .tools-panel {
            position: absolute;
            right: 20px;
            top: 20px;
            width: 220px;
            background: #21262d;
            border: 1px solid #303642;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
        }

        .panel-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #8b949e;
            margin-bottom: 4px;
        }

        .tool-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .tool-btn {
            width: 100%;
            height: 38px;
            background: #303642;
            border: 1px solid #484f58;
            border-radius: 6px;
            color: #c9d1d9;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 12px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .tool-btn:hover {
            background: #38404d;
            border-color: #58a6ff;
        }

        .tool-btn.active {
            background: #38404d;
            color: #58a6ff;
            border-color: #58a6ff;
        }

        .color-dropdown {
            display: none;
            background: #161b22;
            border: 1px solid #303642;
            border-radius: 6px;
            padding: 10px;
            gap: 8px;
            flex-direction: column;
        }

        .color-dropdown.open {
            display: flex;
        }

        .color-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: #8b949e;
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 32px;
            height: 24px;
            border-radius: 4px;
            cursor: pointer;
            background: none;
        }

        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        input[type="color"]::-webkit-color-swatch {
            border: 1px solid #484f58;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="controls-group">
            <label for="sizeInput">Size:</label>
            <input type="text" id="sizeInput" value="32x32">
        </div>
        <div class="controls-group">
            <button id="gridBtn" class="active-grid">Grid: On</button>
        </div>
    </div>

    <div class="app-container">
        <div class="workspace" id="workspace">
            <div class="canvas-wrapper" id="canvasWrapper">
                <canvas id="myCanvas"></canvas>
            </div>
        </div>

        <div class="tools-panel">
            <div class="panel-title">Tools</div>
            <div class="tool-container">
                <button class="tool-btn active" id="pencilBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path></svg>
                    Pencil
                </button>
                <div class="color-dropdown open" id="colorDropdown">
                    <div class="color-row">
                        <span>Color</span>
                        <input type="color" id="colorPicker" value="#000000">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('myCanvas');
        const ctx = canvas.getContext('2d');
        const sizeInput = document.getElementById('sizeInput');
        const gridBtn = document.getElementById('gridBtn');
        const colorPicker = document.getElementById('colorPicker');
        const workspace = document.getElementById('workspace');
        const canvasWrapper = document.getElementById('canvasWrapper');

        let gridWidth = 32;
        let gridHeight = 32;
        let isGridOn = true;
        let pixels = [];
        let isDrawing = false;
        let isPanning = false;
        let currentColor = '#000000';
        
        const DISPLAY_SIZE = 512;
        let panX = 0;
        let panY = 0;
        let scale = 1;
        let startX = 0;
        let startY = 0;

        window.addEventListener('contextmenu', (e) => e.preventDefault());

        function parseSize(str) {
            str = str.replace(/\s+/g, '').toLowerCase();
            let parts = str.split('x');
            if (parts.length === 2) {
                let w = parseInt(parts[0]);
                let h = parseInt(parts[1]);
                if (!isNaN(w) && !isNaN(h) && w > 0 && h > 0) {
                    if (w > 128) w = 128;
                    if (h > 128) h = 128;
                    return { width: w, height: h };
                }
            } else if (parts.length === 1) {
                let v = parseInt(parts[0]);
                if (!isNaN(v) && v > 0) {
                    if (v > 128) v = 128;
                    return { width: v, height: v };
                }
            }
            return null;
        }

        function initCanvas() {
            let parsed = parseSize(sizeInput.value);
            if (!parsed) return;

            gridWidth = parsed.width;
            gridHeight = parsed.height;

            canvas.width = DISPLAY_SIZE;
            canvas.height = DISPLAY_SIZE;
            canvas.style.width = `${DISPLAY_SIZE}px`;
            canvas.style.height = `${DISPLAY_SIZE}px`;

            pixels = Array(gridHeight).fill(null).map(() => Array(gridWidth).fill('#ffffff'));
            
            panX = (workspace.clientWidth - DISPLAY_SIZE) / 2;
            panY = (workspace.clientHeight - DISPLAY_SIZE) / 2;
            scale = 1;
            updateTransform();

            draw();
        }

        function updateTransform() {
            canvasWrapper.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const cellW = canvas.width / gridWidth;
            const cellH = canvas.height / gridHeight;

            for (let y = 0; y < gridHeight; y++) {
                for (let x = 0; x < gridWidth; x++) {
                    ctx.fillStyle = pixels[y][x];
                    ctx.fillRect(x * cellW, y * cellH, cellW, cellH);
                }
            }

            if (isGridOn && cellW >= 4 && cellH >= 4) {
                ctx.strokeStyle = 'rgba(0, 0, 0, 0.15)';
                ctx.lineWidth = 1;
                
                ctx.beginPath();
                for (let i = 0; i <= gridWidth; i++) {
                    let pos = i * cellW;
                    ctx.moveTo(pos, 0);
                    ctx.lineTo(pos, canvas.height);
                }
                for (let j = 0; j <= gridHeight; j++) {
                    let pos = j * cellH;
                    ctx.moveTo(0, pos);
                    ctx.lineTo(canvas.width, pos);
                }
                ctx.stroke();
            }
        }

        function getCursorPosition(e) {
            const rect = canvas.getBoundingClientRect();
            const cellW = rect.width / gridWidth;
            const cellH = rect.height / gridHeight;
            const x = Math.floor((e.clientX - rect.left) / cellW);
            const y = Math.floor((e.clientY - rect.top) / cellH);
            return { x, y };
        }

        canvas.addEventListener('mousedown', (e) => {
            if (e.button === 0) {
                isDrawing = true;
                paintPixel(e);
            } else if (e.button === 2) {
                isPanning = true;
                startX = e.clientX - panX;
                startY = e.clientY - panY;
            }
        });

        window.addEventListener('mouseup', (e) => {
            if (e.button === 0) isDrawing = false;
            if (e.button === 2) isPanning = false;
        });

        window.addEventListener('mousemove', (e) => {
            if (isDrawing) {
                paintPixel(e);
            } else if (isPanning) {
                panX = e.clientX - startX;
                panY = e.clientY - startY;
                updateTransform();
            }
        });

        function paintPixel(e) {
            const { x, y } = getCursorPosition(e);
            if (x >= 0 && x < gridWidth && y >= 0 && y < gridHeight) {
                pixels[y][x] = currentColor;
                draw();
            }
        }

        // Исправленный зум относительно позиции курсора мыши
        workspace.addEventListener('wheel', (e) => {
            e.preventDefault();

            const zoomFactor = e.deltaY < 0 ? 1.15 : 0.87;
            let newScale = scale * zoomFactor;

            if (newScale < 0.1 || newScale > 30) return;

            // Получаем координаты курсора относительно рабочего пространства
            const wsRect = workspace.getBoundingClientRect();
            const mouseX = e.clientX - wsRect.left;
            const mouseY = e.clientY - wsRect.top;

            // Пересчитываем смещение так, чтобы точка под курсором оставалась на месте
            panX = mouseX - (mouseX - panX) * (newScale / scale);
            panY = mouseY - (mouseY - panY) * (newScale / scale);
            scale = newScale;

            updateTransform();
        }, { passive: false });

        colorPicker.addEventListener('input', (e) => {
            currentColor = e.target.value;
        });

        sizeInput.addEventListener('input', initCanvas);

        gridBtn.addEventListener('click', () => {
            isGridOn = !isGridOn;
            gridBtn.textContent = isGridOn ? 'Grid: On' : 'Grid: Off';
            gridBtn.classList.toggle('active-grid', isGridOn);
            draw();
        });

        initCanvas();
    </script>
</body>
</html>
