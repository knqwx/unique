<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unique</title>
    <style>
        body {
            background-color: #1a1d24;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transform: translateY(-90px);
        }
        h1 {
            font-size: 5rem;
            letter-spacing: 3px;
            margin: 0 0 15px 0;
            color: #ffffff;
            font-weight: 700;
        }
        p {
            font-size: 1.25rem;
            color: #94a3b8;
            margin: 0 0 30px 0;
            max-width: 500px;
            line-height: 1.5;
        }
        .btn {
            background-color: #3b82f6;
            color: #ffffff;
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            text-decoration: none;
        }
        .btn:hover {
            background-color: #2563eb;
        }
        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
