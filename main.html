<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #252a33;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', sans-serif;
            color: #c9d1d9;
            overflow: hidden;
        }

        .top-bar {
            height: 50px;
            background: #21262d;
            border-bottom: 1px solid #303642;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 15px;
            z-index: 10;
        }

        .controls-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        label {
            font-size: 13px;
            color: #8b949e;
        }

        input[type="text"] {
            background: #303642;
            border: 1px solid #484f58;
            color: #c9d1d9;
            padding: 5px 8px;
            border-radius: 4px;
            width: 60px;
            outline: none;
            font-size: 13px;
            text-align: center;
        }

        input[type="text"]:focus {
            border-color: #58a6ff;
        }

        .size-separator {
            color: #8b949e;
            font-size: 13px;
            font-weight: 600;
        }

        button, select {
            background: #303642;
            border: 1px solid #484f58;
            color: #c9d1d9;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
            outline: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        button:hover, select:hover {
            background: #38404d;
            border-color: #58a6ff;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            border-color: #484f58 !important;
            background: #303642 !important;
        }

        select {
            padding: 5px 8px;
        }

        button.active-grid {
            background: #238636;
            border-color: #2ea043;
            color: #ffffff;
        }

        button.active-center {
            background: #1f6feb;
            border-color: #388bfd;
            color: #ffffff;
        }

        .app-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 50px);
            position: relative;
            overflow: hidden;
        }

        .workspace {
            flex: 1;
            background-color: #252a33;
            position: relative;
            overflow: hidden;
            cursor: default;
        }

        .canvas-wrapper {
            position: absolute;
            background: #ffffff;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            border-radius: 4px;
            overflow: hidden;
            line-height: 0;
            transform-origin: 0 0;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            cursor: crosshair;
        }

        .tools-panel {
            position: absolute;
            right: 20px;
            top: 20px;
            width: 260px;
            background: #21262d;
            border: 1px solid #303642;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
            max-height: calc(100vh - 60px);
            overflow-y: auto;
        }

        .tools-panel::-webkit-scrollbar {
            width: 6px;
        }
        .tools-panel::-webkit-scrollbar-thumb {
            background: #303642;
            border-radius: 3px;
        }

        .panel-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #8b949e;
            margin-bottom: 2px;
        }

        .tool-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .tool-row {
            display: flex;
            gap: 6px;
            width: 100%;
            align-items: center;
        }

        .tool-btn {
            width: 100%;
            height: 38px;
            background: #303642;
            border: 1px solid #484f58;
            border-radius: 6px;
            color: #c9d1d9;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 10px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .tool-row .tool-btn {
            flex: 1;
        }

        .tool-row .icon-only-btn {
            width: 38px;
            padding: 0;
            justify-content: center;
            flex: 0 0 38px;
        }

        .brush-size-input {
            width: 46px;
            height: 38px;
            background: #303642;
            border: 1px solid #484f58;
            color: #c9d1d9;
            border-radius: 6px;
            text-align: center;
            font-size: 13px;
            outline: none;
            flex: 0 0 46px;
        }

        .brush-size-input:focus {
            border-color: #58a6ff;
        }

        .tool-btn:hover {
            background: #38404d;
            border-color: #58a6ff;
        }

        .tool-btn.active {
            background: #38404d;
            color: #58a6ff;
            border-color: #58a6ff;
        }

        .shape-select {
            flex: 1;
            height: 38px;
            background: #303642;
            border: 1px solid #484f58;
            border-radius: 6px;
            color: #c9d1d9;
            font-size: 13px;
            padding: 0 8px;
        }

        .color-dropdown {
            background: #161b22;
            border: 1px solid #303642;
            border-radius: 6px;
            padding: 10px;
            gap: 10px;
            display: flex;
            flex-direction: column;
            margin-top: 4px;
        }

        .color-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: #8b949e;
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 32px;
            height: 24px;
            border-radius: 4px;
            cursor: pointer;
            background: none;
        }

        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        input[type="color"]::-webkit-color-swatch {
            border: 1px solid #484f58;
            border-radius: 4px;
        }

        .palette-section {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .palette-label {
            font-size: 11px;
            color: #8b949e;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .palette-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
        }

        .color-swatch {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 4px;
            border: 1px solid #484f58;
            cursor: pointer;
            transition: transform 0.1s, border-color 0.1s;
        }

        .color-swatch:hover {
            transform: scale(1.1);
            border-color: #58a6ff;
        }

        .add-saved-btn {
            background: none;
            border: none;
            color: #58a6ff;
            cursor: pointer;
            font-size: 11px;
            padding: 0;
        }
        .add-saved-btn:hover {
            text-decoration: underline;
            background: none;
            border: none;
        }

        /* Модальное окно для выбора цвета с картинки */
        .image-picker-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(13, 17, 23, 0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .image-picker-modal.open {
            display: flex;
        }

        .modal-content {
            position: relative;
            max-width: 90vw;
            max-height: 85vh;
            background: #161b22;
            border: 1px solid #303642;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 16px 48px rgba(0,0,0,0.6);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 14px;
            font-weight: 600;
            color: #c9d1d9;
        }

        .image-container {
            overflow: auto;
            max-height: calc(85vh - 80px);
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0d1117;
            border-radius: 4px;
            border: 1px solid #303642;
            position: relative;
        }

        #sourceImage {
            display: block;
            max-width: 100%;
            max-height: 70vh;
            cursor: crosshair;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="controls-group">
            <label>Size:</label>
            <input type="text" id="widthInput" value="32" maxlength="3">
            <span class="size-separator">×</span>
            <input type="text" id="heightInput" value="32" maxlength="3">
        </div>
        <div class="controls-group">
            <button id="gridBtn" class="active-grid">Grid: On</button>
            <button id="centerBtn">Center: Off</button>
        </div>
        <div class="controls-group">
            <button id="undoBtn" title="Отменить действие (Ctrl+Z)" disabled>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"></path><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path></svg>
                Undo
            </button>
            <button id="redoBtn" title="Повторить действие (Ctrl+Y)" disabled>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 7v6h-6"></path><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"></path></svg>
                Redo
            </button>
        </div>
        <div class="controls-group">
            <button id="resetPosBtn">Reset Position</button>
        </div>
    </div>

    <div class="app-container">
        <div class="workspace" id="workspace">
            <div class="canvas-wrapper" id="canvasWrapper">
                <canvas id="myCanvas"></canvas>
            </div>
        </div>

        <div class="tools-panel">
            <div class="panel-title">Tools</div>
            <div class="tool-container">
                <div class="tool-row">
                    <button class="tool-btn active" id="pencilBtn">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path></svg>
                        Pencil
                    </button>
                    <input type="text" class="brush-size-input" id="pencilSizeInput" value="1" maxlength="3" title="Размер кисти карандаша">
                </div>
                <div class="tool-row">
                    <button class="tool-btn" id="eraserBtn">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 20H7L3 16C2 15 2 13 3 12L13 2L22 11L20 20Z"></path><path d="M17 17L7 7"></path></svg>
                        Eraser
                    </button>
                    <input type="text" class="brush-size-input" id="eraserSizeInput" value="1" maxlength="3" title="Размер кисти ластика">
                </div>
                <button class="tool-btn" id="bucketBtn">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 11l-8-8-8.5 8.5a2.83 2.83 0 0 0 0 4l4 4a2.83 2.83 0 0 0 4 0L19 11z"></path><path d="M15 5l4 4"></path><path d="M2 22h20"></path></svg>
                    Paint Bucket
                </button>
                <div class="tool-row">
                    <button class="tool-btn" id="shapeBtn">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>
                        Shape
                    </button>
                    <select class="shape-select" id="shapeType">
                        <option value="rect">Rect</option>
                        <option value="circle">Circle</option>
                        <option value="line">Line</option>
                    </select>
                    <input type="text" class="brush-size-input" id="shapeSizeInput" value="1" maxlength="3" title="Толщина линии фигуры">
                </div>
                <div class="tool-row">
                    <button class="tool-btn" id="eyedropperBtn">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 22l5.5-1.5L21.5 6.5l-3-3L5 16.5L2 22z"></path><path d="M13.5 6.5l4 4"></path></svg>
                        Eyedropper
                    </button>
                    <button class="tool-btn icon-only-btn" id="uploadImageBtn" title="Загрузить картинку для пипетки">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                    </button>
                </div>
                
                <div class="color-dropdown" id="colorDropdown">
                    <div class="color-row">
                        <span>Color</span>
                        <input type="color" id="colorPicker" value="#000000">
                    </div>
                    
                    <div class="palette-section">
                        <div class="palette-label">Recent Colors</div>
                        <div class="palette-grid" id="recentColorsGrid"></div>
                    </div>

                    <div class="palette-section">
                        <div class="palette-label">
                            <span>Saved Colors</span>
                            <button class="add-saved-btn" id="saveCurrentColorBtn">+ Save current</button>
                        </div>
                        <div class="palette-grid" id="savedColorsGrid"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Скрытый инпут для выбора файла изображения -->
    <input type="file" id="imageInput" accept="image/*" style="display: none;">

    <!-- Модальное окно для выбора цвета с картинки -->
    <div class="image-picker-modal" id="imageModal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title">Кликните по картинке, чтобы выбрать цвет</span>
                <button id="closeModalBtn">Закрыть</button>
            </div>
            <div class="image-container">
                <img id="sourceImage" alt="Upload Image">
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('myCanvas');
        const ctx = canvas.getContext('2d');
        const widthInput = document.getElementById('widthInput');
        const heightInput = document.getElementById('heightInput');
        const gridBtn = document.getElementById('gridBtn');
        const centerBtn = document.getElementById('centerBtn');
        const resetPosBtn = document.getElementById('resetPosBtn');
        const undoBtn = document.getElementById('undoBtn');
        const redoBtn = document.getElementById('redoBtn');
        const colorPicker = document.getElementById('colorPicker');
        const workspace = document.getElementById('workspace');
        const canvasWrapper = document.getElementById('canvasWrapper');

        const pencilBtn = document.getElementById('pencilBtn');
        const eraserBtn = document.getElementById('eraserBtn');
        const bucketBtn = document.getElementById('bucketBtn');
        const shapeBtn = document.getElementById('shapeBtn');
        const shapeTypeSelect = document.getElementById('shapeType');
        const eyedropperBtn = document.getElementById('eyedropperBtn');
        const uploadImageBtn = document.getElementById('uploadImageBtn');
        const imageInput = document.getElementById('imageInput');

        const pencilSizeInput = document.getElementById('pencilSizeInput');
        const eraserSizeInput = document.getElementById('eraserSizeInput');
        const shapeSizeInput = document.getElementById('shapeSizeInput');

        const recentColorsGrid = document.getElementById('recentColorsGrid');
        const savedColorsGrid = document.getElementById('savedColorsGrid');
        const saveCurrentColorBtn = document.getElementById('saveCurrentColorBtn');

        const imageModal = document.getElementById('imageModal');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const sourceImage = document.getElementById('sourceImage');

        let gridWidth = 32;
        let gridHeight = 32;
        let isGridOn = true;
        let isCenterOn = false;
        let pixels = [];
        
        // История для Undo / Redo
        let history = [];
        let historyIndex = -1;
        const MAX_HISTORY = 30;

        let isDrawing = false;
        let isPanning = false;
        let currentColor = '#000000';
        let currentTool = 'pencil';
        
        const DISPLAY_SIZE = 768;
        let panX = 0;
        let panY = 0;
        let scale = 1;
        let startX = 0;
        let startY = 0;

        let shapeStartX = 0;
        let shapeStartY = 0;
        let pixelsBeforeShape = null;

        // Цветовые палитры
        let recentColors = ['#000000', '#ffffff', '#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff'];
        let savedColors = ['#000000', '#ffffff', '#21262d', '#58a6ff', '#238636', '#da3633', '#f0883e', '#8957e5'];

        window.addEventListener('contextmenu', (e) => e.preventDefault());

        function sanitizeInput(input, fallback, maxVal = 128) {
            let val = input.value.replace(/[^0-9]/g, '');
            if (val.startsWith('0')) {
                val = val.replace(/^0+/, '');
            }
            if (val !== '') {
                let num = parseInt(val, 10);
                if (num > maxVal) num = maxVal;
                val = num.toString();
            }
            input.value = val;
            return val === '' ? fallback : parseInt(val, 10);
        }

        function resetPosition() {
            panX = (workspace.clientWidth - DISPLAY_SIZE) / 2;
            panY = (workspace.clientHeight - DISPLAY_SIZE) / 2;
            scale = 1;
            updateTransform();
        }

        function initCanvas(saveToHistoryState = true) {
            gridWidth = sanitizeInput(widthInput, 32, 128);
            gridHeight = sanitizeInput(heightInput, 32, 128);

            canvas.width = DISPLAY_SIZE;
            canvas.height = DISPLAY_SIZE;
            canvas.style.width = `${DISPLAY_SIZE}px`;
            canvas.style.height = `${DISPLAY_SIZE}px`;

            pixels = Array(gridHeight).fill(null).map(() => Array(gridWidth).fill('#ffffff'));
            
            if (saveToHistoryState) {
                history = [];
                historyIndex = -1;
                pushHistory();
            }

            resetPosition();
            draw();
        }

        function pushHistory() {
            if (historyIndex < history.length - 1) {
                history = history.slice(0, historyIndex + 1);
            }
            // Клонируем матрицу пикселей
            const snapshot = pixels.map(row => [...row]);
            history.push(snapshot);
            if (history.length > MAX_HISTORY) {
                history.shift();
            } else {
                historyIndex++;
            }
            updateUndoRedoButtons();
        }

        function undo() {
            if (historyIndex > 0) {
                historyIndex--;
                pixels = history[historyIndex].map(row => [...row]);
                draw();
                updateUndoRedoButtons();
            }
        }

        function redo() {
            if (historyIndex < history.length - 1) {
                historyIndex++;
                pixels = history[historyIndex].map(row => [...row]);
                draw();
                updateUndoRedoButtons();
            }
        }

        function updateUndoRedoButtons() {
            undoBtn.disabled = historyIndex <= 0;
            redoBtn.disabled = historyIndex >= history.length - 1;
        }

        function updateTransform() {
            canvasWrapper.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const cellW = canvas.width / gridWidth;
            const cellH = canvas.height / gridHeight;

            for (let y = 0; y < gridHeight; y++) {
                for (let x = 0; x < gridWidth; x++) {
                    ctx.fillStyle = pixels[y][x];
                    ctx.fillRect(x * cellW, y * cellH, cellW, cellH);
                }
            }

            if (isGridOn && cellW >= 4 && cellH >= 4) {
                ctx.strokeStyle = 'rgba(0, 0, 0, 0.15)';
                ctx.lineWidth = 1;
                
                ctx.beginPath();
                for (let i = 0; i <= gridWidth; i++) {
                    let pos = i * cellW;
                    ctx.moveTo(pos, 0);
                    ctx.lineTo(pos, canvas.height);
                }
                for (let j = 0; j <= gridHeight; j++) {
                    let pos = j * cellH;
                    ctx.moveTo(0, pos);
                    ctx.lineTo(canvas.width, pos);
                }
                ctx.stroke();
            }

            if (isCenterOn) {
                ctx.strokeStyle = 'rgba(235, 87, 87, 0.75)';
                ctx.lineWidth = Math.max(1, cellW / 4);

                let centerX = (gridWidth / 2) * cellW;
                let centerY = (gridHeight / 2) * cellH;

                ctx.beginPath();
                ctx.moveTo(centerX, 0);
                ctx.lineTo(centerX, canvas.height);
                ctx.moveTo(0, centerY);
                ctx.lineTo(canvas.width, centerY);
                ctx.stroke();
            }
        }

        function getCursorPosition(e) {
            const rect = canvas.getBoundingClientRect();
            const cellW = rect.width / gridWidth;
            const cellH = rect.height / gridHeight;
            const x = Math.floor((e.clientX - rect.left) / cellW);
            const y = Math.floor((e.clientY - rect.top) / cellH);
            return { x, y };
        }

        canvas.addEventListener('mousedown', (e) => {
            if (e.button === 0) {
                isDrawing = true;
                const { x, y } = getCursorPosition(e);
                if (x >= 0 && x < gridWidth && y >= 0 && y < gridHeight) {
                    if (currentTool === 'bucket') {
                        floodFill(x, y, pixels[y][x], currentColor);
                        pushHistory();
                        draw();
                    } else if (currentTool === 'shape') {
                        shapeStartX = x;
                        shapeStartY = y;
                        pixelsBeforeShape = pixels.map(row => [...row]);
                    } else {
                        handleToolAction(e, true);
                    }
                }
            } else if (e.button === 2) {
                isPanning = true;
                startX = e.clientX - panX;
                startY = e.clientY - panY;
            }
        });

        window.addEventListener('mouseup', (e) => {
            if (e.button === 0 && isDrawing) {
                isDrawing = false;
                if (currentTool === 'shape') {
                    pushHistory();
                } else if (currentTool === 'pencil' || currentTool === 'eraser') {
                    pushHistory();
                }
                pixelsBeforeShape = null;
            }
            if (e.button === 2) isPanning = false;
        });

        window.addEventListener('mousemove', (e) => {
            if (isDrawing) {
                const { x, y } = getCursorPosition(e);
                if (currentTool === 'shape') {
                    if (pixelsBeforeShape) {
                        pixels = pixelsBeforeShape.map(row => [...row]);
                        const shapeThickness = sanitizeInput(shapeSizeInput, 1, Math.max(gridWidth, gridHeight));
                        drawShape(shapeStartX, shapeStartY, x, y, shapeTypeSelect.value, currentColor, shapeThickness);
                        draw();
                    }
                } else {
                    handleToolAction(e, false);
                }
            } else if (isPanning) {
                panX = e.clientX - startX;
                panY = e.clientY - startY;
                updateTransform();
            }
        });

        function handleToolAction(e, isFirstClick) {
            const { x, y } = getCursorPosition(e);
            if (x >= 0 && x < gridWidth && y >= 0 && y < gridHeight) {
                if (currentTool === 'pencil') {
                    const size = sanitizeInput(pencilSizeInput, 1, Math.max(gridWidth, gridHeight));
                    applyBrush(x, y, size, currentColor);
                } else if (currentTool === 'eraser') {
                    const size = sanitizeInput(eraserSizeInput, 1, Math.max(gridWidth, gridHeight));
                    applyBrush(x, y, size, '#ffffff');
                } else if (currentTool === 'eyedropper') {
                    setCurrentColor(pixels[y][x]);
                }
            }
        }

        function applyBrush(cx, cy, size, color) {
            let startX = cx - Math.floor((size - 1) / 2);
            let endX = cx + Math.floor(size / 2);
            let startY = cy - Math.floor((size - 1) / 2);
            let endY = cy + Math.floor(size / 2);

            let changed = false;
            for (let y = startY; y <= endY; y++) {
                for (let x = startX; x <= endX; x++) {
                    if (x >= 0 && x < gridWidth && y >= 0 && y < gridHeight) {
                        if (pixels[y][x] !== color) {
                            pixels[y][x] = color;
                            changed = true;
                        }
                    }
                }
            }
            if (changed) draw();
        }

        function floodFill(startX, startY, targetColor, fillColor) {
            if (targetColor === fillColor) return;
            const queue = [[startX, startY]];
            const visited = Array(gridHeight).fill(null).map(() => Array(gridWidth).fill(false));

            while (queue.length > 0) {
                let [x, y] = queue.pop();

                if (x < 0 || x >= gridWidth || y < 0 || y >= gridHeight) continue;
                if (visited[y][x]) continue;
                if (pixels[y][x] !== targetColor) continue;

                pixels[y][x] = fillColor;
                visited[y][x] = true;

                queue.push([x + 1, y]);
                queue.push([x - 1, y]);
                queue.push([x, y + 1]);
                queue.push([x, y - 1]);
            }
        }

        function drawShape(x1, y1, x2, y2, type, color, thickness) {
            if (type === 'rect') {
                let minX = Math.min(x1, x2);
                let maxX = Math.max(x1, x2);
                let minY = Math.min(y1, y2);
                let maxY = Math.max(y1, y2);

                for (let y = minY; y <= maxY; y++) {
                    for (let x = minX; x <= maxX; x++) {
                        if (x - minX < thickness || maxX - x < thickness || y - minY < thickness || maxY - y < thickness) {
                            if (x >= 0 && x < gridWidth && y >= 0 && y < gridHeight) {
                                pixels[y][x] = color;
                            }
                        }
                    }
                }
            } else if (type === 'circle') {
                let cx = (x1 + x2) / 2;
                let cy = (y1 + y2) / 2;
                let rx = Math.abs(x2 - x1) / 2;
                let ry = Math.abs(y2 - y1) / 2;

                let r = Math.max(rx, ry);
                let center_x = x1 < x2 ? x1 + rx : x2 + rx;
                let center_y = y1 < y2 ? y1 + ry : y2 + ry;

                for (let y = 0; y < gridHeight; y++) {
                    for (let x = 0; x < gridWidth; x++) {
                        let dx = x + 0.5 - center_x;
                        let dy = y + 0.5 - center_y;
                        let dist = Math.sqrt(dx * dx + dy * dy);

                        if (Math.abs(dist - r) <= (thickness / 2) || (r === 0 && dist <= thickness / 2)) {
                            if (x >= 0 && x < gridWidth && y >= 0 && y < gridHeight) {
                                pixels[y][x] = color;
                            }
                        }
                    }
                }
            } else if (type === 'line') {
                let dx = Math.abs(x2 - x1);
                let dy = Math.abs(y2 - y1);
                let sx = (x1 < x2) ? 1 : -1;
                let sy = (y1 < y2) ? 1 : -1;
                let err = dx - dy;

                let currX = x1;
                let currY = y1;

                while (true) {
                    applyBrush(currX, currY, thickness, color);
                    if (currX === x2 && currY === y2) break;
                    let e2 = 2 * err;
                    if (e2 > -dy) {
                        err -= dy;
                        currX += sx;
                    }
                    if (e2 < dx) {
                        err += dx;
                        currY += sy;
                    }
                }
            }
        }

        // Управление цветами и палитрой
        function setCurrentColor(hex) {
            currentColor = hex;
            colorPicker.value = hex;
            addRecentColor(hex);
        }

        function addRecentColor(hex) {
            recentColors = recentColors.filter(c => c.toLowerCase() !== hex.toLowerCase());
            recentColors.unshift(hex);
            if (recentColors.length > 8) recentColors.pop();
            renderPalettes();
        }

        function renderPalettes() {
            recentColorsGrid.innerHTML = '';
            recentColors.forEach(hex => {
                const swatch = document.createElement('div');
                swatch.className = 'color-swatch';
                swatch.style.backgroundColor = hex;
                swatch.title = hex;
                swatch.addEventListener('click', () => {
                    currentColor = hex;
                    colorPicker.value = hex;
                });
                recentColorsGrid.appendChild(swatch);
            });

            savedColorsGrid.innerHTML = '';
            savedColors.forEach(hex => {
                const swatch = document.createElement('div');
                swatch.className = 'color-swatch';
                swatch.style.backgroundColor = hex;
                swatch.title = hex;
                swatch.addEventListener('click', () => {
                    currentColor = hex;
                    colorPicker.value = hex;
                });
                savedColorsGrid.appendChild(swatch);
            });
        }

        saveCurrentColorBtn.addEventListener('click', () => {
            if (!savedColors.includes(currentColor)) {
                savedColors.push(currentColor);
                if (savedColors.length > 16) savedColors.shift();
                renderPalettes();
            }
        });

        function setTool(toolName) {
            currentTool = toolName;

            pencilBtn.classList.remove('active');
            eraserBtn.classList.remove('active');
            bucketBtn.classList.remove('active');
            shapeBtn.classList.remove('active');
            eyedropperBtn.classList.remove('active');

            if (toolName === 'pencil') pencilBtn.classList.add('active');
            if (toolName === 'eraser') eraserBtn.classList.add('active');
            if (toolName === 'bucket') bucketBtn.classList.add('active');
            if (toolName === 'shape') shapeBtn.classList.add('active');
            if (toolName === 'eyedropper') eyedropperBtn.classList.add('active');
        }

        pencilBtn.addEventListener('click', () => setTool('pencil'));
        eraserBtn.addEventListener('click', () => setTool('eraser'));
        bucketBtn.addEventListener('click', () => setTool('bucket'));
        shapeBtn.addEventListener('click', () => setTool('shape'));
        eyedropperBtn.addEventListener('click', () => setTool('eyedropper'));

        pencilSizeInput.addEventListener('input', () => sanitizeInput(pencilSizeInput, 1, 128));
        eraserSizeInput.addEventListener('input', () => sanitizeInput(eraserSizeInput, 1, 128));
        shapeSizeInput.addEventListener('input', () => sanitizeInput(shapeSizeInput, 1, 128));

        uploadImageBtn.addEventListener('click', () => {
            imageInput.click();
        });

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                sourceImage.src = event.target.result;
                imageModal.classList.add('open');
            };
            reader.readAsDataURL(file);
            imageInput.value = '';
        });

        closeModalBtn.addEventListener('click', () => {
            imageModal.classList.remove('open');
        });

        sourceImage.addEventListener('click', (e) => {
            const canvasImg = document.createElement('canvas');
            const ctxImg = canvasImg.getContext('2d');
            canvasImg.width = sourceImage.naturalWidth;
            canvasImg.height = sourceImage.naturalHeight;
            ctxImg.drawImage(sourceImage, 0, 0);

            const rect = sourceImage.getBoundingClientRect();
            const scaleX = sourceImage.naturalWidth / rect.width;
            const scaleY = sourceImage.naturalHeight / rect.height;

            const clickX = (e.clientX - rect.left) * scaleX;
            const clickY = (e.clientY - rect.top) * scaleY;

            const pixelData = ctxImg.getImageData(clickX, clickY, 1, 1).data;
            const hex = '#' + [pixelData[0], pixelData[1], pixelData[2]]
                .map(x => x.toString(16).padStart(2, '0'))
                .join('');

            setCurrentColor(hex);
            imageModal.classList.remove('open');
            setTool('pencil');
        });

        workspace.addEventListener('wheel', (e) => {
            e.preventDefault();

            const zoomFactor = e.deltaY < 0 ? 1.15 : 0.87;
            let newScale = scale * zoomFactor;

            if (newScale < 0.1 || newScale > 30) return;

            const wsRect = workspace.getBoundingClientRect();
            const mouseX = e.clientX - wsRect.left;
            const mouseY = e.clientY - wsRect.top;

            panX = mouseX - (mouseX - panX) * (newScale / scale);
            panY = mouseY - (mouseY - panY) * (newScale / scale);
            scale = newScale;

            updateTransform();
        }, { passive: false });

        colorPicker.addEventListener('input', (e) => {
            setCurrentColor(e.target.value);
        });

        widthInput.addEventListener('input', () => sanitizeInput(widthInput, 32, 128));
        widthInput.addEventListener('change', () => initCanvas(true));
        widthInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                heightInput.focus();
                heightInput.select();
            }
        });

        heightInput.addEventListener('input', () => sanitizeInput(heightInput, 32, 128));
        heightInput.addEventListener('change', () => initCanvas(true));
        heightInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                heightInput.blur();
                initCanvas(true);
            }
        });

        gridBtn.addEventListener('click', () => {
            isGridOn = !isGridOn;
            gridBtn.textContent = isGridOn ? 'Grid: On' : 'Grid: Off';
            gridBtn.classList.toggle('active-grid', isGridOn);
            draw();
        });

        centerBtn.addEventListener('click', () => {
            isCenterOn = !isCenterOn;
            centerBtn.textContent = isCenterOn ? 'Center: On' : 'Center: Off';
            centerBtn.classList.toggle('active-center', isCenterOn);
            draw();
        });

        undoBtn.addEventListener('click', undo);
        redoBtn.addEventListener('click', redo);

        // Горячие клавиши Ctrl+Z и Ctrl+Y
        window.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
                e.preventDefault();
                if (e.shiftKey) {
                    redo();
                } else {
                    undo();
                }
            } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
                e.preventDefault();
                redo();
            }
        });

        resetPosBtn.addEventListener('click', resetPosition);

        renderPalettes();
        initCanvas(true);
    </script>
</body>
</html>
