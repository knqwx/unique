<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #252a33;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', sans-serif;
            color: #c9d1d9;
            overflow: hidden;
        }

        .top-bar {
            height: 50px;
            background: #21262d;
            border-bottom: 1px solid #303642;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 15px;
            z-index: 10;
        }

        .controls-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        label {
            font-size: 13px;
            color: #8b949e;
        }

        input[type="text"] {
            background: #303642;
            border: 1px solid #484f58;
            color: #c9d1d9;
            padding: 5px 8px;
            border-radius: 4px;
            width: 60px;
            outline: none;
            font-size: 13px;
            text-align: center;
        }

        input[type="text"]:focus {
            border-color: #58a6ff;
        }

        .size-separator {
            color: #8b949e;
            font-size: 13px;
            font-weight: 600;
        }

        button {
            background: #303642;
            border: 1px solid #484f58;
            color: #c9d1d9;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
        }

        button:hover {
            background: #38404d;
            border-color: #58a6ff;
        }

        button.active-grid {
            background: #238636;
            border-color: #2ea043;
            color: #ffffff;
        }

        .app-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 50px);
            position: relative;
            overflow: hidden;
        }

        .workspace {
            flex: 1;
            background-color: #252a33;
            position: relative;
            overflow: hidden;
            cursor: default;
        }

        .canvas-wrapper {
            position: absolute;
            background: #ffffff;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            border-radius: 4px;
            overflow: hidden;
            line-height: 0;
            transform-origin: 0 0;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            cursor: crosshair;
        }

        .tools-panel {
            position: absolute;
            right: 20px;
            top: 20px;
            width: 220px;
            background: #21262d;
            border: 1px solid #303642;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
        }

        .panel-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #8b949e;
            margin-bottom: 4px;
        }

        .tool-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .tool-row {
            display: flex;
            gap: 6px;
            width: 100%;
        }

        .tool-btn {
            width: 100%;
            height: 38px;
            background: #303642;
            border: 1px solid #484f58;
            border-radius: 6px;
            color: #c9d1d9;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 12px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .tool-row .tool-btn {
            flex: 1;
        }

        .tool-row .icon-only-btn {
            width: 38px;
            padding: 0;
            justify-content: center;
            flex: 0 0 38px;
        }

        .tool-btn:hover {
            background: #38404d;
            border-color: #58a6ff;
        }

        .tool-btn.active {
            background: #38404d;
            color: #58a6ff;
            border-color: #58a6ff;
        }

        .color-dropdown {
            background: #161b22;
            border: 1px solid #303642;
            border-radius: 6px;
            padding: 10px;
            gap: 8px;
            display: flex;
            flex-direction: column;
            margin-top: 6px;
        }

        .color-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: #8b949e;
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 32px;
            height: 24px;
            border-radius: 4px;
            cursor: pointer;
            background: none;
        }

        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        input[type="color"]::-webkit-color-swatch {
            border: 1px solid #484f58;
            border-radius: 4px;
        }

        /* Модальное окно для выбора цвета с картинки */
        .image-picker-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(13, 17, 23, 0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .image-picker-modal.open {
            display: flex;
        }

        .modal-content {
            position: relative;
            max-width: 90vw;
            max-height: 85vh;
            background: #161b22;
            border: 1px solid #303642;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 16px 48px rgba(0,0,0,0.6);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 14px;
            font-weight: 600;
            color: #c9d1d9;
        }

        .image-container {
            overflow: auto;
            max-height: calc(85vh - 80px);
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0d1117;
            border-radius: 4px;
            border: 1px solid #303642;
            position: relative;
        }

        #sourceImage {
            display: block;
            max-width: 100%;
            max-height: 70vh;
            cursor: crosshair;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="controls-group">
            <label>Size:</label>
            <input type="text" id="widthInput" value="32" maxlength="3">
            <span class="size-separator">×</span>
            <input type="text" id="heightInput" value="32" maxlength="3">
        </div>
        <div class="controls-group">
            <button id="gridBtn" class="active-grid">Grid: On</button>
        </div>
        <div class="controls-group">
            <button id="resetPosBtn">Reset Position</button>
        </div>
    </div>

    <div class="app-container">
        <div class="workspace" id="workspace">
            <div class="canvas-wrapper" id="canvasWrapper">
                <canvas id="myCanvas"></canvas>
            </div>
        </div>

        <div class="tools-panel">
            <div class="panel-title">Tools</div>
            <div class="tool-container">
                <button class="tool-btn active" id="pencilBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path></svg>
                    Pencil
                </button>
                <button class="tool-btn" id="eraserBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 20H7L3 16C2 15 2 13 3 12L13 2L22 11L20 20Z"></path><path d="M17 17L7 7"></path></svg>
                    Eraser
                </button>
                <div class="tool-row">
                    <button class="tool-btn" id="eyedropperBtn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 22l5.5-1.5L21.5 6.5l-3-3L5 16.5L2 22z"></path><path d="M13.5 6.5l4 4"></path></svg>
                        Eyedropper
                    </button>
                    <button class="tool-btn icon-only-btn" id="uploadImageBtn" title="Загрузить картинку для пипетки">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                    </button>
                </div>
                <div class="color-dropdown" id="colorDropdown">
                    <div class="color-row">
                        <span>Color</span>
                        <input type="color" id="colorPicker" value="#000000">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Скрытый инпут для выбора файла изображения -->
    <input type="file" id="imageInput" accept="image/*" style="display: none;">

    <!-- Модальное окно для выбора цвета с картинки -->
    <div class="image-picker-modal" id="imageModal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title">Кликните по картинке, чтобы выбрать цвет</span>
                <button id="closeModalBtn">Закрыть</button>
            </div>
            <div class="image-container">
                <img id="sourceImage" alt="Upload Image">
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('myCanvas');
        const ctx = canvas.getContext('2d');
        const widthInput = document.getElementById('widthInput');
        const heightInput = document.getElementById('heightInput');
        const gridBtn = document.getElementById('gridBtn');
        const resetPosBtn = document.getElementById('resetPosBtn');
        const colorPicker = document.getElementById('colorPicker');
        const workspace = document.getElementById('workspace');
        const canvasWrapper = document.getElementById('canvasWrapper');

        const pencilBtn = document.getElementById('pencilBtn');
        const eraserBtn = document.getElementById('eraserBtn');
        const eyedropperBtn = document.getElementById('eyedropperBtn');
        const uploadImageBtn = document.getElementById('uploadImageBtn');
        const imageInput = document.getElementById('imageInput');

        const imageModal = document.getElementById('imageModal');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const sourceImage = document.getElementById('sourceImage');

        let gridWidth = 32;
        let gridHeight = 32;
        let isGridOn = true;
        let pixels = [];
        let isDrawing = false;
        let isPanning = false;
        let currentColor = '#000000';
        let currentTool = 'pencil'; // 'pencil', 'eraser', 'eyedropper'
        
        const DISPLAY_SIZE = 512;
        let panX = 0;
        let panY = 0;
        let scale = 1;
        let startX = 0;
        let startY = 0;

        window.addEventListener('contextmenu', (e) => e.preventDefault());

        function sanitizeInput(input, fallback) {
            let val = input.value.replace(/[^0-9]/g, '');
            
            if (val.startsWith('0')) {
                val = val.replace(/^0+/, '');
            }

            if (val !== '') {
                let num = parseInt(val, 10);
                if (num > 128) {
                    num = 128;
                }
                val = num.toString();
            }

            input.value = val;
            return val === '' ? fallback : parseInt(val, 10);
        }

        function resetPosition() {
            panX = (workspace.clientWidth - DISPLAY_SIZE) / 2;
            panY = (workspace.clientHeight - DISPLAY_SIZE) / 2;
            scale = 1;
            updateTransform();
        }

        function initCanvas() {
            gridWidth = sanitizeInput(widthInput, 32);
            gridHeight = sanitizeInput(heightInput, 32);

            canvas.width = DISPLAY_SIZE;
            canvas.height = DISPLAY_SIZE;
            canvas.style.width = `${DISPLAY_SIZE}px`;
            canvas.style.height = `${DISPLAY_SIZE}px`;

            pixels = Array(gridHeight).fill(null).map(() => Array(gridWidth).fill('#ffffff'));
            
            resetPosition();
            draw();
        }

        function updateTransform() {
            canvasWrapper.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const cellW = canvas.width / gridWidth;
            const cellH = canvas.height / gridHeight;

            for (let y = 0; y < gridHeight; y++) {
                for (let x = 0; x < gridWidth; x++) {
                    ctx.fillStyle = pixels[y][x];
                    ctx.fillRect(x * cellW, y * cellH, cellW, cellH);
                }
            }

            if (isGridOn && cellW >= 4 && cellH >= 4) {
                ctx.strokeStyle = 'rgba(0, 0, 0, 0.15)';
                ctx.lineWidth = 1;
                
                ctx.beginPath();
                for (let i = 0; i <= gridWidth; i++) {
                    let pos = i * cellW;
                    ctx.moveTo(pos, 0);
                    ctx.lineTo(pos, canvas.height);
                }
                for (let j = 0; j <= gridHeight; j++) {
                    let pos = j * cellH;
                    ctx.moveTo(0, pos);
                    ctx.lineTo(canvas.width, pos);
                }
                ctx.stroke();
            }
        }

        function getCursorPosition(e) {
            const rect = canvas.getBoundingClientRect();
            const cellW = rect.width / gridWidth;
            const cellH = rect.height / gridHeight;
            const x = Math.floor((e.clientX - rect.left) / cellW);
            const y = Math.floor((e.clientY - rect.top) / cellH);
            return { x, y };
        }

        canvas.addEventListener('mousedown', (e) => {
            if (e.button === 0) {
                isDrawing = true;
                handleToolAction(e);
            } else if (e.button === 2) {
                isPanning = true;
                startX = e.clientX - panX;
                startY = e.clientY - panY;
            }
        });

        window.addEventListener('mouseup', (e) => {
            if (e.button === 0) isDrawing = false;
            if (e.button === 2) isPanning = false;
        });

        window.addEventListener('mousemove', (e) => {
            if (isDrawing) {
                handleToolAction(e);
            } else if (isPanning) {
                panX = e.clientX - startX;
                panY = e.clientY - startY;
                updateTransform();
            }
        });

        function handleToolAction(e) {
            const { x, y } = getCursorPosition(e);
            if (x >= 0 && x < gridWidth && y >= 0 && y < gridHeight) {
                if (currentTool === 'pencil') {
                    pixels[y][x] = currentColor;
                    draw();
                } else if (currentTool === 'eraser') {
                    pixels[y][x] = '#ffffff';
                    draw();
                } else if (currentTool === 'eyedropper') {
                    currentColor = pixels[y][x];
                    colorPicker.value = currentColor;
                }
            }
        }

        function setTool(toolName) {
            currentTool = toolName;

            pencilBtn.classList.remove('active');
            eraserBtn.classList.remove('active');
            eyedropperBtn.classList.remove('active');

            if (toolName === 'pencil') pencilBtn.classList.add('active');
            if (toolName === 'eraser') eraserBtn.classList.add('active');
            if (toolName === 'eyedropper') eyedropperBtn.classList.add('active');
        }

        pencilBtn.addEventListener('click', () => setTool('pencil'));
        eraserBtn.addEventListener('click', () => setTool('eraser'));
        eyedropperBtn.addEventListener('click', () => setTool('eyedropper'));

        // Загрузка картинки для пипетки
        uploadImageBtn.addEventListener('click', () => {
            imageInput.click();
        });

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                sourceImage.src = event.target.result;
                imageModal.classList.add('open');
            };
            reader.readAsDataURL(file);
            imageInput.value = ''; // Сброс для возможности повторного выбора того же файла
        });

        closeModalBtn.addEventListener('click', () => {
            imageModal.classList.remove('open');
        });

        // Выбор цвета по клику на загруженное изображение через скрытый холст
        sourceImage.addEventListener('click', (e) => {
            const canvasImg = document.createElement('canvas');
            const ctxImg = canvasImg.getContext('2d');
            canvasImg.width = sourceImage.naturalWidth;
            canvasImg.height = sourceImage.naturalHeight;
            ctxImg.drawImage(sourceImage, 0, 0);

            const rect = sourceImage.getBoundingClientRect();
            const scaleX = sourceImage.naturalWidth / rect.width;
            const scaleY = sourceImage.naturalHeight / rect.height;

            const clickX = (e.clientX - rect.left) * scaleX;
            const clickY = (e.clientY - rect.top) * scaleY;

            const pixelData = ctxImg.getImageData(clickX, clickY, 1, 1).data;
            const hex = '#' + [pixelData[0], pixelData[1], pixelData[2]]
                .map(x => x.toString(16).padStart(2, '0'))
                .join('');

            currentColor = hex;
            colorPicker.value = hex;

            imageModal.classList.remove('open');
            setTool('eyedropper');
        });

        workspace.addEventListener('wheel', (e) => {
            e.preventDefault();

            const zoomFactor = e.deltaY < 0 ? 1.15 : 0.87;
            let newScale = scale * zoomFactor;

            if (newScale < 0.1 || newScale > 30) return;

            const wsRect = workspace.getBoundingClientRect();
            const mouseX = e.clientX - wsRect.left;
            const mouseY = e.clientY - wsRect.top;

            panX = mouseX - (mouseX - panX) * (newScale / scale);
            panY = mouseY - (mouseY - panY) * (newScale / scale);
            scale = newScale;

            updateTransform();
        }, { passive: false });

        colorPicker.addEventListener('input', (e) => {
            currentColor = e.target.value;
        });

        widthInput.addEventListener('input', () => sanitizeInput(widthInput, 32));
        widthInput.addEventListener('change', initCanvas);
        widthInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                heightInput.focus();
                heightInput.select();
            }
        });

        heightInput.addEventListener('input', () => sanitizeInput(heightInput, 32));
        heightInput.addEventListener('change', initCanvas);
        heightInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                heightInput.blur();
                initCanvas();
            }
        });

        gridBtn.addEventListener('click', () => {
            isGridOn = !isGridOn;
            gridBtn.textContent = isGridOn ? 'Grid: On' : 'Grid: Off';
            gridBtn.classList.toggle('active-grid', isGridOn);
            draw();
        });

        resetPosBtn.addEventListener('click', resetPosition);

        initCanvas();
    </script>
</body>
</html>
