<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Темный фон</title>
    <style>
        body {
            /* Приятный темно-сине-серый цвет фона */
            background-color: #1a1d24; 
            /* Мягкий светлый цвет текста для хорошей читаемости */
            color: #e2e8f0; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            
            /* Центрируем содержимое */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.03); /* Легкое полупрозрачное выделение */
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            margin-bottom: 10px;
            color: #ffffff;
        }

        p {
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Привет!</h1>
        <p>Это страница с приятным темным фоном.</p>
    </div>

</body>
</html>
