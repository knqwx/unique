<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #252a33;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', sans-serif;
            color: #c9d1d9;
            overflow: hidden;
        }

        /* Верхняя панель */
        .top-bar {
            height: 50px;
            background: #21262d;
            border-bottom: 1px solid #303642;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 15px;
            z-index: 10;
        }

        .controls-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        label {
            font-size: 13px;
            color: #8b949e;
        }

        input[type="text"] {
            background: #303642;
            border: 1px solid #484f58;
            color: #c9d1d9;
            padding: 5px 8px;
            border-radius: 4px;
            width: 60px;
            outline: none;
            font-size: 13px;
        }

        input[type="text"]:focus {
            border-color: #58a6ff;
        }

        button {
            background: #303642;
            border: 1px solid #484f58;
            color: #c9d1d9;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
        }

        button:hover {
            background: #38404d;
            border-color: #58a6ff;
        }

        button.active-grid {
            background: #238636;
            border-color: #2ea043;
            color: #ffffff;
        }

        /* Основной контейнер */
        .app-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 50px);
            position: relative;
        }

        /* Рабочая область */
        .workspace {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #252a33;
            overflow: auto;
            padding: 20px;
        }

        .canvas-wrapper {
            background: #ffffff;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            border-radius: 4px;
            overflow: hidden;
            line-height: 0;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            cursor: crosshair;
        }

        /* Правая панель */
        .tools-panel {
            position: absolute;
            right: 20px;
            top: 20px;
            width: 220px;
            background: #21262d;
            border: 1px solid #303642;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
        }

        .panel-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #8b949e;
            margin-bottom: 4px;
        }

        .tool-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .tool-btn {
            width: 100%;
            height: 38px;
            background: #303642;
            border: 1px solid #484f58;
            border-radius: 6px;
            color: #c9d1d9;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 12px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .tool-btn:hover {
            background: #38404d;
            border-color: #58a6ff;
        }

        .tool-btn.active {
            background: #38404d;
            color: #58a6ff;
            border-color: #58a6ff;
        }

        .color-dropdown {
            display: none;
            background: #161b22;
            border: 1px solid #303642;
            border-radius: 6px;
            padding: 10px;
            gap: 8px;
            flex-direction: column;
        }

        .color-dropdown.open {
            display: flex;
        }

        .color-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: #8b949e;
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 32px;
            height: 24px;
            border-radius: 4px;
            cursor: pointer;
            background: none;
        }

        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        input[type="color"]::-webkit-color-swatch {
            border: 1px solid #484f58;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <!-- Верхняя панель -->
    <div class="top-bar">
        <div class="controls-group">
            <label for="sizeInput">Size:</label>
            <input type="text" id="sizeInput" value="32">
        </div>
        <div class="controls-group">
            <button id="gridBtn" class="active-grid">Grid: On</button>
        </div>
    </div>

    <!-- Основной макет -->
    <div class="app-container">
        <div class="workspace">
            <div class="canvas-wrapper">
                <canvas id="myCanvas"></canvas>
            </div>
        </div>

        <!-- Правая панель -->
        <div class="tools-panel">
            <div class="panel-title">Tools</div>
            <div class="tool-container">
                <button class="tool-btn active" id="pencilBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path></svg>
                    Pencil
                </button>
                <div class="color-dropdown open" id="colorDropdown">
                    <div class="color-row">
                        <span>Color</span>
                        <input type="color" id="colorPicker" value="#000000">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('myCanvas');
        const ctx = canvas.getContext('2d');
        const sizeInput = document.getElementById('sizeInput');
        const gridBtn = document.getElementById('gridBtn');
        const colorPicker = document.getElementById('colorPicker');

        let gridSize = 32;
        let isGridOn = true;
        let pixels = [];
        let isDrawing = false;
        let currentColor = '#000000';
        let pixelSize = 16; // Текущий размер одного пикселя на экране (масштаб)

        function initCanvas() {
            let size = parseInt(sizeInput.value);
            if (isNaN(size) || size < 1) size = 1;
            gridSize = size;

            // Сбрасываем дефолтный масштаб в зависимости от размера сетки
            pixelSize = Math.max(4, Math.floor(512 / gridSize));

            updateCanvasDimensions();
            pixels = Array(gridSize).fill(null).map(() => Array(gridSize).fill('#ffffff'));
            draw();
        }

        function updateCanvasDimensions() {
            canvas.width = gridSize * pixelSize;
            canvas.height = gridSize * pixelSize;
            canvas.style.width = `${canvas.width}px`;
            canvas.style.height = `${canvas.height}px`;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let y = 0; y < gridSize; y++) {
                for (let x = 0; x < gridSize; x++) {
                    ctx.fillStyle = pixels[y][x];
                    ctx.fillRect(x * pixelSize, y * pixelSize, pixelSize, pixelSize);
                }
            }

            if (isGridOn && pixelSize >= 4) {
                ctx.strokeStyle = 'rgba(0, 0, 0, 0.15)';
                ctx.lineWidth = 1;
                
                ctx.beginPath();
                for (let i = 0; i <= gridSize; i++) {
                    let pos = i * pixelSize;
                    ctx.moveTo(pos, 0);
                    ctx.lineTo(pos, canvas.height);
                    ctx.moveTo(0, pos);
                    ctx.lineTo(canvas.width, pos);
                }
                ctx.stroke();
            }
        }

        function getCursorPosition(e) {
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) / pixelSize);
            const y = Math.floor((e.clientY - rect.top) / pixelSize);
            return { x, y };
        }

        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            paintPixel(e);
        });

        window.addEventListener('mouseup', () => {
            isDrawing = false;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isDrawing) paintPixel(e);
        });

        function paintPixel(e) {
            const { x, y } = getCursorPosition(e);
            if (x >= 0 && x < gridSize && y >= 0 && y < gridSize) {
                pixels[y][x] = currentColor;
                draw();
            }
        }

        // Приближение и отдаление колесиком мыши строго над холстом
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault(); // Отключаем стандартную прокрутку страницы

            if (e.deltaY < 0) {
                // Приближение
                if (pixelSize < 64) pixelSize += 2;
            } else {
                // Отдаление
                if (pixelSize > 2) pixelSize -= 2;
            }

            updateCanvasDimensions();
            draw();
        }, { passive: false });

        colorPicker.addEventListener('input', (e) => {
            currentColor = e.target.value;
        });

        sizeInput.addEventListener('input', initCanvas);

        gridBtn.addEventListener('click', () => {
            isGridOn = !isGridOn;
            if (isGridOn) {
                gridBtn.textContent = 'Grid: On';
                gridBtn.classList.add('active-grid');
            } else {
                gridBtn.textContent = 'Grid: Off';
                gridBtn.classList.remove('active-grid');
            }
            draw();
        });

        initCanvas();
    </script>
</body>
</html>
