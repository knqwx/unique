<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #252a33;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', sans-serif;
            color: #c9d1d9;
            overflow: hidden;
        }

        /* Верхняя панель */
        .top-bar {
            height: 50px;
            background: #21262d;
            border-bottom: 1px solid #303642;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 15px;
        }

        .controls-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        label {
            font-size: 13px;
            color: #8b949e;
        }

        input[type="number"] {
            background: #303642;
            border: 1px solid #484f58;
            color: #c9d1d9;
            padding: 5px 8px;
            border-radius: 4px;
            width: 60px;
            outline: none;
            font-size: 13px;
        }

        input:focus {
            border-color: #58a6ff;
        }

        button {
            background: #303642;
            border: 1px solid #484f58;
            color: #c9d1d9;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
        }

        button:hover {
            background: #38404d;
            border-color: #58a6ff;
        }

        button.active-grid {
            background: #238636;
            border-color: #2ea043;
            color: #ffffff;
        }

        /* Основной контейнер под шапкой */
        .app-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 50px);
        }

        /* Левая панель инструментов */
        .sidebar {
            width: 60px;
            background: #21262d;
            border-right: 1px solid #303642;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 15px;
            gap: 10px;
        }

        .tool-btn {
            width: 40px;
            height: 40px;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 6px;
            color: #8b949e;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tool-btn:hover {
            background: #303642;
            color: #c9d1d9;
        }

        .tool-btn.active {
            background: #38404d;
            color: #58a6ff;
            border-color: #484f58;
        }

        /* Рабочая область */
        .workspace {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #252a33;
            overflow: auto;
            padding: 20px;
        }

        .canvas-wrapper {
            background: #ffffff;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            border-radius: 4px;
            overflow: hidden;
            line-height: 0;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            cursor: crosshair;
        }
    </style>
</head>
<body>

    <!-- Верхняя панель с настройками холста и сетки -->
    <div class="top-bar">
        <div class="controls-group">
            <label for="sizeInput">Size:</label>
            <input type="number" id="sizeInput" value="32" min="1" max="128">
        </div>
        <div class="controls-group">
            <button id="gridBtn" class="active-grid">Grid: On</button>
        </div>
    </div>

    <!-- Основной макет: панель инструментов слева, холст по центру -->
    <div class="app-container">
        <div class="sidebar">
            <button class="tool-btn active" title="Pencil">
                <!-- Иконка карандаша -->
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path></svg>
            </button>
        </div>

        <div class="workspace">
            <div class="canvas-wrapper">
                <canvas id="myCanvas"></canvas>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('myCanvas');
        const ctx = canvas.getContext('2d');
        const sizeInput = document.getElementById('sizeInput');
        const gridBtn = document.getElementById('gridBtn');

        let gridSize = 32;
        let isGridOn = true;
        let pixels = [];

        function initCanvas() {
            let size = parseInt(sizeInput.value);
            
            if (isNaN(size) || size < 1) size = 1;
            if (size > 128) size = 128;
            sizeInput.value = size;
            gridSize = size;

            const displaySize = 512;
            const pixelSize = Math.floor(displaySize / gridSize);
            
            canvas.width = gridSize * pixelSize;
            canvas.height = gridSize * pixelSize;
            canvas.style.width = `${canvas.width}px`;
            canvas.style.height = `${canvas.height}px`;

            pixels = Array(gridSize).fill(null).map(() => Array(gridSize).fill('#ffffff'));
            
            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const pixelSize = canvas.width / gridSize;

            for (let y = 0; y < gridSize; y++) {
                for (let x = 0; x < gridSize; x++) {
                    ctx.fillStyle = pixels[y][x];
                    ctx.fillRect(x * pixelSize, y * pixelSize, pixelSize, pixelSize);
                }
            }

            if (isGridOn && pixelSize >= 4) {
                ctx.strokeStyle = 'rgba(0, 0, 0, 0.15)';
                ctx.lineWidth = 1;
                
                ctx.beginPath();
                for (let i = 0; i <= gridSize; i++) {
                    let pos = i * pixelSize;
                    ctx.moveTo(pos, 0);
                    ctx.lineTo(pos, canvas.height);
                    ctx.moveTo(0, pos);
                    ctx.lineTo(canvas.width, pos);
                }
                ctx.stroke();
            }
        }

        // Автоматическое обновление размера холста при изменении цифры в инпуте
        sizeInput.addEventListener('input', initCanvas);

        gridBtn.addEventListener('click', () => {
            isGridOn = !isGridOn;
            if (isGridOn) {
                gridBtn.textContent = 'Grid: On';
                gridBtn.classList.add('active-grid');
            } else {
                gridBtn.textContent = 'Grid: Off';
                gridBtn.classList.remove('active-grid');
            }
            draw();
        });

        initCanvas();
    </script>
</body>
</html>
