<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #252a33;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
            color: #c9d1d9;
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            background: #21262d;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #303642;
        }

        input {
            background: #303642;
            border: 1px solid #484f58;
            color: #c9d1d9;
            padding: 6px 10px;
            border-radius: 4px;
            width: 80px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #58a6ff;
        }

        button {
            background: #58a6ff;
            color: #ffffff;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .canvas-wrapper {
            background: #ffffff;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            border-radius: 4px;
            overflow: hidden;
            line-height: 0;
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <div class="controls">
        <label for="sizeInput">Размер:</label>
        <input type="number" id="sizeInput" value="32" min="1" max="512">
        <button id="applyBtn">Создать холст</button>
    </div>

    <div class="canvas-wrapper">
        <canvas id="myCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('myCanvas');
        const ctx = canvas.getContext('2d');
        const sizeInput = document.getElementById('sizeInput');
        const applyBtn = document.getElementById('applyBtn');

        function updateCanvasSize() {
            let size = parseInt(sizeInput.value);
            
            // Ограничения, чтобы браузер не завис от случайных огромных чисел
            if (isNaN(size) || size < 1) size = 1;
            if (size > 1024) size = 1024;
            sizeInput.value = size;

            // Устанавливаем реальный размер холста
            canvas.width = size;
            canvas.height = size;

            // Заливаем холст белым цветом по умолчанию
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, size, size);
        }

        applyBtn.addEventListener('click', updateCanvasSize);
        sizeInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                updateCanvasSize();
            }
        });

        // Инициализация при старте
        updateCanvasSize();
    </script>
</body>
</html>
