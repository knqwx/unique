<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #252a33;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
            color: #c9d1d9;
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
            align-items: center;
            background: #21262d;
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid #303642;
        }

        label {
            font-size: 14px;
        }

        input[type="number"] {
            background: #303642;
            border: 1px solid #484f58;
            color: #c9d1d9;
            padding: 6px 10px;
            border-radius: 4px;
            width: 70px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #58a6ff;
        }

        button {
            background: #58a6ff;
            color: #ffffff;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s, opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button.active-grid {
            background: #3fb950;
        }

        .canvas-wrapper {
            background: #ffffff;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            border-radius: 4px;
            overflow: hidden;
            line-height: 0;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
        }
    </style>
</head>
<body>

    <div class="controls">
        <label for="sizeInput">Size:</label>
        <input type="number" id="sizeInput" value="32" min="1" max="512">
        <button id="applyBtn">Create Canvas</button>
        <button id="gridBtn" class="active-grid">Grid: On</button>
    </div>

    <div class="canvas-wrapper">
        <canvas id="myCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('myCanvas');
        const ctx = canvas.getContext('2d');
        const sizeInput = document.getElementById('sizeInput');
        const applyBtn = document.getElementById('applyBtn');
        const gridBtn = document.getElementById('gridBtn');

        let gridSize = 32;
        let isGridOn = true;
        // Массив для хранения цветов пикселей [y][x]
        let pixels = [];

        function initCanvas() {
            let size = parseInt(sizeInput.value);
            
            if (isNaN(size) || size < 1) size = 1;
            if (size > 512) size = 512;
            sizeInput.value = size;
            gridSize = size;

            // Физический размер холста в пикселях на экране (например, фиксируем под удобный просмотр или масштабируем)
            const displaySize = 512; 
            canvas.width = gridSize;
            canvas.height = gridSize;
            canvas.style.width = `${displaySize}px`;
            canvas.style.height = `${displaySize}px`;

            // Инициализируем белый холст
            pixels = Array(gridSize).fill(null).map(() => Array(gridSize).fill('#ffffff'));
            
            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, gridSize, gridSize);

            // Отрисовка пикселей
            for (let y = 0; y < gridSize; y++) {
                for (let x = 0; x < gridSize; x++) {
                    ctx.fillStyle = pixels[y][x];
                    ctx.fillRect(x, y, 1, 1);
                }
            }

            // Отрисовка сетки, если включена
            if (isGridOn && gridSize <= 64) {
                ctx.strokeStyle = 'rgba(0, 0, 0, 0.15)';
                ctx.lineWidth = 0.05; // Тонкая линия для масштабируемого холста
                
                ctx.beginPath();
                for (let i = 0; i <= gridSize; i++) {
                    ctx.moveTo(i, 0);
                    ctx.lineTo(i, gridSize);
                    ctx.moveTo(0, i);
                    ctx.lineTo(gridSize, i);
                }
                ctx.stroke();
            }
        }

        applyBtn.addEventListener('click', initCanvas);
        sizeInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                initCanvas();
            }
        });

        // Переключение сетки
        gridBtn.addEventListener('click', () => {
            isGridOn = !isGridOn;
            if (isGridOn) {
                gridBtn.textContent = 'Grid: On';
                gridBtn.classList.add('active-grid');
            } else {
                gridBtn.textContent = 'Grid: Off';
                gridBtn.classList.remove('active-grid');
            }
            draw();
        });

        // Стартовая инициализация
        initCanvas();
    </script>
</body>
</html>
