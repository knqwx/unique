<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace</title>
    <style>
        body {
            background-color: #1a1d24;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            user-select: none;
            gap: 16px;
        }

        .upload-wrapper {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }

        .controls-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .resolution-selector, .custom-input {
            background-color: #14161b;
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 0.85rem;
            font-weight: 600;
            outline: none;
            transition: border-color 0.2s, color 0.2s;
        }

        .resolution-selector {
            cursor: pointer;
        }

        .resolution-selector:hover, .custom-input:focus {
            border-color: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        .custom-inputs-container {
            display: none;
            gap: 6px;
        }

        .custom-input {
            width: 70px;
            text-align: center;
        }

        .upload-container {
            border: 2px dashed rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            width: 550px;
            height: 320px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background-color: #14161b;
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
            box-sizing: border-box;
            padding: 20px;
        }

        .upload-container:hover {
            border-color: rgba(255, 255, 255, 0.25);
            background-color: #181b21;
        }

        .upload-text {
            font-size: 1.25rem;
            color: #94a3b8;
            margin: 0;
            font-weight: 500;
        }

        .workspace {
            display: none;
            background-color: #14161b;
            border-radius: 16px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .media-box {
            background-color: #000000;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        video, img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: none;
            outline: none;
            cursor: grab;
        }

        video:active, img:active {
            cursor: grabbing;
        }

        .reset-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #14161b;
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
            z-index: 100;
            display: none;
            outline: none;
        }

        .reset-btn:hover {
            background-color: #1c2029;
            color: #ffffff;
        }

        #fileInput {
            display: none;
        }
    </style>
</head>
<body>

    <button class="reset-btn" id="resetBtn">Reset Position</button>

    <div class="upload-wrapper" id="uploadWrapper">
        <div class="controls-row">
            <select class="resolution-selector" id="resolutionMode">
                <option value="auto">Auto (Match Video Size)</option>
                <option value="custom">Custom Size</option>
            </select>

            <div class="custom-inputs-container" id="customInputsContainer">
                <input type="number" class="custom-input" id="customWidth" placeholder="Width">
                <input type="number" class="custom-input" id="customHeight" placeholder="Height">
            </div>
        </div>

        <div class="upload-container" id="dropZone">
            <p class="upload-text">Drag or choose files</p>
        </div>
    </div>

    <div class="workspace" id="workspace">
        <div class="media-box" id="mediaBox">
            <video id="videoPlayer"></video>
            <img id="imagePlayer" alt="Uploaded Image">
        </div>
    </div>

    <input type="file" id="fileInput" accept="video/*,image/*">

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const uploadWrapper = document.getElementById('uploadWrapper');
        const resolutionMode = document.getElementById('resolutionMode');
        const customInputsContainer = document.getElementById('customInputsContainer');
        const customWidth = document.getElementById('customWidth');
        const customHeight = document.getElementById('customHeight');
        const workspace = document.getElementById('workspace');
        const mediaBox = document.getElementById('mediaBox');
        const videoPlayer = document.getElementById('videoPlayer');
        const imagePlayer = document.getElementById('imagePlayer');
        const resetBtn = document.getElementById('resetBtn');

        resolutionMode.addEventListener('change', (e) => {
            if (e.target.value === 'custom') {
                customInputsContainer.style.display = 'flex';
            } else {
                customInputsContainer.style.display = 'none';
            }
        });

        dropZone.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            uploadWrapper.style.display = 'none';
            workspace.style.display = 'block';
            resetBtn.style.display = 'block';

            resetPosition();

            const fileUrl = URL.createObjectURL(file);
            const isImage = file.type.startsWith('image/');
            const mode = resolutionMode.value;

            if (isImage) {
                imagePlayer.src = fileUrl;
                imagePlayer.style.display = 'block';
                videoPlayer.style.display = 'none';

                imagePlayer.onload = () => {
                    if (mode === 'auto') {
                        // Ограничим максимальный размер бокса, чтобы он не разрывал экран, если исходник огромный
                        let w = imagePlayer.naturalWidth;
                        let h = imagePlayer.naturalHeight;
                        
                        // Если картинка больше 900x550, уменьшаем пропорционально для удобства
                        const maxW = 900;
                        const maxH = 550;
                        if (w > maxW || h > maxH) {
                            const ratio = Math.min(maxW / w, maxH / h);
                            w = Math.round(w * ratio);
                            h = Math.round(h * ratio);
                        }

                        mediaBox.style.width = w + 'px';
                        mediaBox.style.height = h + 'px';
                    } else {
                        applyCustomSize();
                    }
                };
            } else {
                videoPlayer.src = fileUrl;
                videoPlayer.style.display = 'block';
                imagePlayer.style.display = 'none';

                videoPlayer.onloadedmetadata = () => {
                    if (mode === 'auto') {
                        let w = videoPlayer.videoWidth;
                        let h = videoPlayer.videoHeight;

                        // Если видео больше экрана, пропорционально вписываем в разумные рамки
                        const maxW = 900;
                        const maxH = 550;
                        if (w > maxW || h > maxH) {
                            const ratio = Math.min(maxW / w, maxH / h);
                            w = Math.round(w * ratio);
                            h = Math.round(h * ratio);
                        }

                        mediaBox.style.width = w + 'px';
                        mediaBox.style.height = h + 'px';
                    } else {
                        applyCustomSize();
                    }
                };
            }
        });

        function applyCustomSize() {
            const w = customWidth.value;
            const h = customHeight.value;
            if (w) mediaBox.style.width = w + 'px';
            if (h) mediaBox.style.height = h + 'px';
        }

        // Управление пробелом для видео
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && workspace.style.display === 'block' && videoPlayer.style.display === 'block') {
                e.preventDefault();
                if (videoPlayer.paused) {
                    videoPlayer.play();
                } else {
                    videoPlayer.pause();
                }
            }
        });

        // Логика перетаскивания (Drag & Drop мышкой)
        let activeElement = null;
        let startX = 0;
        let startY = 0;
        let posX = 0;
        let posY = 0;

        function startDrag(e) {
            activeElement = e.target;
            startX = e.clientX - posX;
            startY = e.clientY - posY;
            e.preventDefault();
        }

        function onDrag(e) {
            if (!activeElement) return;
            posX = e.clientX - startX;
            posY = e.clientY - startY;
            activeElement.style.transform = `translate(${posX}px, ${posY}px)`;
        }

        function stopDrag() {
            activeElement = null;
        }

        videoPlayer.addEventListener('mousedown', startDrag);
        imagePlayer.addEventListener('mousedown', startDrag);
        document.addEventListener('mousemove', onDrag);
        document.addEventListener('mouseup', stopDrag);

        // Функция сброса позиции
        function resetPosition() {
            posX = 0;
            posY = 0;
            videoPlayer.style.transform = 'translate(0px, 0px)';
            imagePlayer.style.transform = 'translate(0px, 0px)';
        }

        resetBtn.addEventListener('click', () => {
            resetPosition();
            resetBtn.blur();
        });
    </script>

</body>
</html>
