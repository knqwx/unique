<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ve</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #1a1d20;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: row;
            justify-content: flex-start;
            align-items: flex-start;
            gap: 20px;
            padding: 20px;
            box-sizing: border-box;
            overflow: hidden;
            position: relative;
        }

        /* Контейнер для трех толстых темно-красных линий в самом низу */
        .bottom-lines {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 4px; /* Расстояние между линиями */
            padding: 4px 0;
            background-color: #1a1d20;
            z-index: 1000;
        }

        .bottom-line {
            width: 100%;
            height: 16px; /* Толщина линий */
            background-color: #8b0000; /* Темно-красный цвет */
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 240px;
            flex-shrink: 0;
            height: calc(100vh - 40px);
        }

        .box {
            width: 100%;
            background-color: #2c3136;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            border: none;
            color: #ffffff;
            font-family: inherit;
            box-sizing: border-box;
        }

        .upload-box {
            height: 100px;
            flex-shrink: 0;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .upload-box:hover {
            background-color: #343a40;
        }

        .preview-box {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 10px;
            overflow-y: auto;
            box-sizing: border-box;
            scrollbar-width: thin;
            scrollbar-color: #485059 #2c3136;
        }

        .preview-box::-webkit-scrollbar {
            width: 6px;
        }

        .preview-box::-webkit-scrollbar-track {
            background: #2c3136;
            border-radius: 3px;
        }

        .preview-box::-webkit-scrollbar-thumb {
            background: #485059;
            border-radius: 3px;
        }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            width: 100%;
        }

        .placeholder-text {
            color: #8b949e;
            font-size: 14px;
            margin: auto;
        }

        .preview-item {
            width: 100%;
            height: 65px;
            background-color: #1a1d20;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: 2px solid transparent;
            transition: border-color 0.2s;
        }

        .preview-item:hover {
            border-color: #485059;
        }

        .preview-media {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .main-display {
            width: 900px;
            height: 580px;
            background-color: #2c3136;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .main-placeholder {
            color: #8b949e;
            font-size: 16px;
        }

        .media-container {
            flex-grow: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .main-media {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .video-controls {
            width: 100%;
            background-color: #212529;
            padding: 15px 20px;
            box-sizing: border-box;
            display: none;
            flex-direction: column;
            gap: 10px;
        }

        .timeline-wrapper {
            position: relative;
            width: 100%;
            height: 48px;
            background-color: #1a1d20;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        .timeline-frames {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            z-index: 1;
            pointer-events: none;
        }

        .timeline-frame {
            height: 100%;
            flex: 1 1 0px;
            min-width: 0;
            object-fit: cover;
            display: block;
        }

        .timeline-slider {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 3;
            margin: 0;
        }

        .control-buttons {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #ffffff;
            font-size: 14px;
        }

        .play-btn {
            background-color: #3b4249;
            color: #ffffff;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 500;
        }

        .play-btn:hover {
            background-color: #485059;
        }

        #fileInput {
            display: none;
        }
    </style>
</head>
<body>
    <input type="file" id="fileInput" accept="image/*,video/*" multiple>

    <div class="sidebar">
        <button class="box upload-box" onclick="document.getElementById('fileInput').click()">Choose File</button>
        <div class="box preview-box" id="previewContainer">
            <span class="placeholder-text">Preview</span>
        </div>
    </div>

    <div class="main-display" id="mainDisplay">
        <span class="main-placeholder">Select an item from the list</span>
    </div>

    <!-- Три толстые темно-красные линии в самом низу -->
    <div class="bottom-lines">
        <div class="bottom-line"></div>
        <div class="bottom-line"></div>
        <div class="bottom-line"></div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const mainDisplay = document.getElementById('mainDisplay');
        let hasItems = false;
        let gridWrapper = null;

        fileInput.addEventListener('change', function(event) {
            const files = event.target.files;
            if (!files.length) return;

            if (!hasItems) {
                previewContainer.innerHTML = '';
                gridWrapper = document.createElement('div');
                gridWrapper.className = 'preview-grid';
                previewContainer.appendChild(gridWrapper);
                hasItems = true;
            }

            Array.from(files).forEach(file => {
                const fileURL = URL.createObjectURL(file);
                const itemDiv = document.createElement('div');
                itemDiv.className = 'preview-item';

                let mediaElement;
                if (file.type.startsWith('image/')) {
                    mediaElement = document.createElement('img');
                    mediaElement.src = fileURL;
                    mediaElement.className = 'preview-media';
                    itemDiv.appendChild(mediaElement);
                } else if (file.type.startsWith('video/')) {
                    mediaElement = document.createElement('video');
                    mediaElement.src = fileURL;
                    mediaElement.className = 'preview-media';
                    itemDiv.appendChild(mediaElement);
                }

                itemDiv.addEventListener('click', function() {
                    mainDisplay.innerHTML = '';

                    const mediaContainer = document.createElement('div');
                    mediaContainer.className = 'media-container';
                    mainDisplay.appendChild(mediaContainer);

                    if (file.type.startsWith('image/')) {
                        const img = document.createElement('img');
                        img.src = fileURL;
                        img.className = 'main-media';
                        mediaContainer.appendChild(img);
                    } else if (file.type.startsWith('video/')) {
                        const video = document.createElement('video');
                        video.src = fileURL;
                        video.className = 'main-media';
                        mediaContainer.appendChild(video);

                        const controls = document.createElement('div');
                        controls.className = 'video-controls';
                        controls.style.display = 'flex';

                        const timelineWrapper = document.createElement('div');
                        timelineWrapper.className = 'timeline-wrapper';

                        const framesContainer = document.createElement('div');
                        framesContainer.className = 'timeline-frames';
                        timelineWrapper.appendChild(framesContainer);

                        const slider = document.createElement('input');
                        slider.type = 'range';
                        slider.min = 0;
                        slider.max = 100;
                        slider.value = 0;
                        slider.step = 0.01;
                        slider.className = 'timeline-slider';
                        timelineWrapper.appendChild(slider);

                        const bottomRow = document.createElement('div');
                        bottomRow.className = 'control-buttons';

                        const playBtn = document.createElement('button');
                        playBtn.className = 'play-btn';
                        playBtn.textContent = 'Play';
                        bottomRow.appendChild(playBtn);

                        const timeDisplay = document.createElement('span');
                        timeDisplay.textContent = '0:00 / 0:00';
                        bottomRow.appendChild(timeDisplay);

                        controls.appendChild(timelineWrapper);
                        controls.appendChild(bottomRow);
                        mainDisplay.appendChild(controls);

                        const formatTime = (seconds) => {
                            const mins = Math.floor(seconds / 60);
                            const secs = Math.floor(seconds % 60);
                            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                        };

                        video.addEventListener('loadedmetadata', () => {
                            slider.max = video.duration;
                            timeDisplay.textContent = `0:00 / ${formatTime(video.duration)}`;

                            const duration = video.duration;
                            const frameCount = 50; 
                            const interval = duration / frameCount;
                            
                            const canvas = document.createElement('canvas');
                            canvas.width = 100;
                            canvas.height = 60;
                            const ctx = canvas.getContext('2d');

                            const tempVideo = document.createElement('video');
                            tempVideo.src = fileURL;
                            tempVideo.muted = true;
                            tempVideo.playsInline = true;

                            let currentIndex = 0;
                            const frameData = new Array(frameCount);

                            function processNext() {
                                if (currentIndex < frameCount) {
                                    tempVideo.currentTime = Math.min(currentIndex * interval, duration - 0.01);
                                } else {
                                    framesContainer.innerHTML = '';
                                    for (let j = 0; j < frameCount; j++) {
                                        const frameImg = document.createElement('img');
                                        frameImg.src = frameData[j];
                                        frameImg.className = 'timeline-frame';
                                        framesContainer.appendChild(frameImg);
                                    }
                                }
                            }

                            tempVideo.addEventListener('seeked', () => {
                                ctx.drawImage(tempVideo, 0, 0, canvas.width, canvas.height);
                                frameData[currentIndex] = canvas.toDataURL();
                                currentIndex++;
                                processNext();
                            });

                            tempVideo.addEventListener('loadeddata', () => {
                                processNext();
                            });
                        });

                        video.addEventListener('timeupdate', () => {
                            if (!isDragging) {
                                slider.value = video.currentTime;
                            }
                            timeDisplay.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
                        });

                        let isDragging = false;
                        slider.addEventListener('input', () => {
                            isDragging = true;
                            video.currentTime = slider.value;
                        });
                        slider.addEventListener('change', () => {
                            isDragging = false;
                        });

                        playBtn.addEventListener('click', () => {
                            if (video.paused) {
                                video.play();
                                playBtn.textContent = 'Pause';
                            } else {
                                video.pause();
                                playBtn.textContent = 'Play';
                            }
                        });

                        video.addEventListener('ended', () => {
                            playBtn.textContent = 'Play';
                        });
                    }
                });

                gridWrapper.appendChild(itemDiv);
            });
            
            fileInput.value = '';
        });
    </script>
</body>
</html>
