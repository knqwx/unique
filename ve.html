<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Workspace</title>
    <style>
        body { background: #1a1d24; color: #e2e8f0; font-family: sans-serif; margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .box { border: 2px dashed rgba(255,255,255,.12); border-radius: 16px; width: 550px; height: 320px; display: flex; justify-content: center; align-items: center; background: #14161b; cursor: pointer; }
        .workspace { display: none; width: 800px; background: #14161b; border-radius: 16px; padding: 16px; flex-direction: column; }
        .media { width: 100%; height: 450px; background: #000; border-radius: 12px; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        video, img { max-width: 100%; max-height: 100%; object-fit: contain; display: none; }
        input { display: none; }
    </style>
</head>
<body>

    <div class="box" id="drop" onclick="inp.click()"><span>Drag or choose files</span></div>
    
    <div class="workspace" id="ws">
        <div class="media">
            <video id="vid" controls></video>
            <img id="img">
        </div>
    </div>

    <input type="file" id="inp" accept="video/*,image/*">

    <script>
        inp.onchange = e => {
            const file = e.target.files[0];
            if (!file) return;
            drop.style.display = 'none';
            ws.style.display = 'flex';
            const url = URL.createObjectURL(file);
            const isImg = file.type.startsWith('image/');
            
            (isImg ? img : vid).src = url;
            (isImg ? img : vid).style.display = 'block';
        };
    </script>

</body>
</html>
