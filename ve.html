<!DOCTYPE html>
<html lang="en">
<body style="background:#1a1d24;margin:0;height:100vh;display:flex;justify-content:center;align-items:center;font-family:sans-serif">

    <div id="drop" onclick="inp.click()" style="border:2px dashed #ffffff20;border-radius:16px;width:550px;height:320px;display:flex;justify-content:center;align-items:center;background:#14161b;color:#94a3b8;cursor:pointer">Drag or choose files</div>
    
    <div id="ws" style="display:none;background:#14161b;border-radius:16px;padding:16px">
        <video id="media" onclick="this.paused?this.play():this.pause()" style="max-width:800px;max-height:450px;display:none;background:#000;border-radius:12px"></video>
        <img id="img" style="max-width:800px;max-height:450px;display:none;background:#000;border-radius:12px">
    </div>

    <input type="file" id="inp" accept="video/*,image/*" style="display:none" onchange="
        f=this.files[0]; if(!f)return;
        drop.style.display='none'; ws.style.display='block';
        url=URL.createObjectURL(f);
        m = f.type[0]=='i'?img:media;
        m.src=url; m.style.display='block';
    ">

</body>
</html>
