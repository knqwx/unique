<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ve</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #1a1d20;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: row;
            justify-content: flex-start;
            align-items: flex-start;
            gap: 15px;
            padding: 20px;
            box-sizing: border-box;
            overflow: hidden;
            position: relative;
            font-family: 'Rubik', sans-serif;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 240px;
            flex-shrink: 0;
            height: calc(100vh - 40px);
        }

        .right-sidebar {
            width: 240px;
            flex-shrink: 0;
            height: calc(100vh - 40px);
            background-color: #2c3136;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .box {
            width: 100%;
            background-color: #2c3136;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            border: none;
            color: #ffffff;
            font-family: 'Rubik', sans-serif;
            box-sizing: border-box;
        }

        .upload-box {
            height: 100px;
            flex-shrink: 0;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .upload-box:hover {
            background-color: #343a40;
        }

        .preview-box {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 10px;
            overflow-y: auto;
            box-sizing: border-box;
            scrollbar-width: thin;
            scrollbar-color: #485059 #2c3136;
        }

        .preview-box::-webkit-scrollbar {
            width: 6px;
        }

        .preview-box::-webkit-scrollbar-track {
            background: #2c3136;
            border-radius: 3px;
        }

        .preview-box::-webkit-scrollbar-thumb {
            background: #485059;
            border-radius: 3px;
        }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            width: 100%;
        }

        .placeholder-text {
            color: #8b949e;
            font-size: 14px;
            margin: auto;
        }

        .preview-item {
            width: 100%;
            height: 65px;
            background-color: #1a1d20;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: 2px solid transparent;
            transition: border-color 0.2s;
            position: relative;
        }

        .preview-item:hover {
            border-color: #485059;
        }

        .preview-media {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .trim-btn {
            background-color: #3b4249;
            color: #ffffff;
            border: none;
            width: 100%;
            height: 40px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            font-family: 'Rubik', sans-serif;
            transition: background-color 0.2s;
        }

        .trim-btn:hover {
            background-color: #485059;
        }

        .trim-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .main-display {
            width: calc(100% - 510px);
            flex-grow: 1;
            height: calc(100vh - 215px);
            background-color: #2c3136;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .main-placeholder {
            color: #8b949e;
            font-size: 16px;
        }

        .media-container {
            flex-grow: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            padding: 10px;
            box-sizing: border-box;
        }

        .main-media {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            cursor: pointer;
            border: 2px solid transparent;
            border-radius: 4px;
            transition: border-color 0.15s ease;
        }

        .main-media.active-outline {
            border-color: #ffffff !important;
        }

        .video-controls {
            width: 100%;
            background-color: #212529;
            padding: 10px 20px;
            box-sizing: border-box;
            display: none;
            align-items: center;
            gap: 15px;
            color: #ffffff;
            font-size: 14px;
        }

        .play-btn {
            background-color: #3b4249;
            color: #ffffff;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            font-family: 'Rubik', sans-serif;
            transition: background-color 0.2s;
        }

        .play-btn:hover {
            background-color: #485059;
        }

        #fileInput {
            display: none;
        }

        .bottom-lines-box {
            position: fixed;
            bottom: 20px;
            left: 275px;
            right: 275px;
            background-color: #2c3136;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            padding: 12px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 1000;
        }

        .bottom-line-timeline {
            position: relative;
            width: 100%;
            height: 40px;
            background-color: #33383d;
            border-radius: 4px;
            overflow: visible; /* Разрешаем линии выходить за пределы таймлайна по вертикали */
            display: flex;
            align-items: center;
            user-select: none;
            border: 2px solid transparent;
            box-sizing: border-box;
            transition: border-color 0.15s ease;
        }

        .bottom-line-timeline.active-outline {
            border-color: #ffffff !important;
        }

        .timeline-frames {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
            border-radius: 2px;
        }

        .timeline-frame {
            height: 100%;
            flex: 1 1 0px;
            min-width: 0;
            object-fit: cover;
            display: block;
        }

        /* Увеличенный бегунок (плейхед), который выступает выше и ниже таймлайна */
        .timeline-playhead {
            position: absolute;
            top: -6px;
            bottom: -6px;
            width: 3px;
            background-color: #ffffff;
            left: 0%;
            z-index: 5;
            pointer-events: none;
            box-shadow: 0 0 6px rgba(0, 0, 0, 0.9);
            border-radius: 1px;
        }

        .timeline-slider {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 3;
            margin: 0;
        }

        .bottom-line {
            width: 100%;
            height: 40px;
            background-color: #33383d;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <input type="file" id="fileInput" accept="image/*,video/*" multiple>

    <div class="sidebar">
        <button class="box upload-box" onclick="document.getElementById('fileInput').click()">Choose File</button>
        <div class="box preview-box" id="previewContainer">
            <span class="placeholder-text">Preview</span>
        </div>
    </div>

    <div class="main-display" id="mainDisplay">
        <span class="main-placeholder">Select an item from the list</span>
    </div>

    <div class="right-sidebar">
        <button class="trim-btn" id="trimBtn" disabled>Trim Clip</button>
    </div>

    <div class="bottom-lines-box">
        <div class="bottom-line-timeline" id="timelineWrapper" oncontextmenu="return false;">
            <div class="timeline-frames" id="framesContainer"></div>
            <div class="timeline-playhead" id="timelinePlayhead"></div>
            <input type="range" min="0" max="100" value="0" step="0.01" class="timeline-slider" id="timelineSlider" disabled>
        </div>
        <div class="bottom-line"></div>
        <div class="bottom-line"></div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const mainDisplay = document.getElementById('mainDisplay');
        const timelineWrapper = document.getElementById('timelineWrapper');
        const framesContainer = document.getElementById('framesContainer');
        const timelinePlayhead = document.getElementById('timelinePlayhead');
        const timelineSlider = document.getElementById('timelineSlider');
        const trimBtn = document.getElementById('trimBtn');

        let hasItems = false;
        let gridWrapper = null;
        let currentVideo = null;
        let currentItemData = null;
        let isDragging = false;

        fileInput.addEventListener('change', function(event) {
            const files = event.target.files;
            if (!files.length) return;

            if (!hasItems) {
                previewContainer.innerHTML = '';
                gridWrapper = document.createElement('div');
                gridWrapper.className = 'preview-grid';
                previewContainer.appendChild(gridWrapper);
                hasItems = true;
            }

            Array.from(files).forEach(file => {
                const fileURL = URL.createObjectURL(file);
                addMediaItem(file, fileURL);
            });
            
            fileInput.value = '';
        });

        function addMediaItem(file, fileURL, startTime = 0, endTime = null) {
            const itemData = {
                file: file,
                url: fileURL,
                type: file.type,
                startTime: startTime,
                endTime: endTime
            };

            const itemDiv = document.createElement('div');
            itemDiv.className = 'preview-item';

            let mediaElement;
            if (file.type.startsWith('image/')) {
                mediaElement = document.createElement('img');
                mediaElement.src = fileURL;
                mediaElement.className = 'preview-media';
                itemDiv.appendChild(mediaElement);
            } else if (file.type.startsWith('video/')) {
                mediaElement = document.createElement('video');
                mediaElement.src = fileURL;
                mediaElement.className = 'preview-media';
                mediaElement.currentTime = startTime;
                itemDiv.appendChild(mediaElement);
            }

            itemDiv.addEventListener('click', function() {
                loadMediaToMain(itemData);
            });

            gridWrapper.appendChild(itemDiv);
        }

        function loadMediaToMain(itemData) {
            mainDisplay.innerHTML = '';
            currentVideo = null;
            currentItemData = itemData;
            framesContainer.innerHTML = '';
            timelinePlayhead.style.left = '0%';
            timelineSlider.disabled = true;
            timelineWrapper.classList.remove('active-outline');
            trimBtn.disabled = true;

            const mediaContainer = document.createElement('div');
            mediaContainer.className = 'media-container';
            mainDisplay.appendChild(mediaContainer);

            let mainMedia;

            if (itemData.type.startsWith('image/')) {
                mainMedia = document.createElement('img');
                mainMedia.src = itemData.url;
                mainMedia.className = 'main-media';
                mediaContainer.appendChild(mainMedia);
            } else if (itemData.type.startsWith('video/')) {
                mainMedia = document.createElement('video');
                mainMedia.src = itemData.url;
                mainMedia.className = 'main-media';
                mediaContainer.appendChild(mainMedia);
                currentVideo = mainMedia;

                const controls = document.createElement('div');
                controls.className = 'video-controls';
                controls.style.display = 'flex';

                const playBtn = document.createElement('button');
                playBtn.className = 'play-btn';
                playBtn.innerHTML = '▶';
                controls.appendChild(playBtn);

                const timeDisplay = document.createElement('span');
                timeDisplay.textContent = '0:00 / 0:00';
                controls.appendChild(timeDisplay);

                mainDisplay.appendChild(controls);
                timelineSlider.disabled = false;
                trimBtn.disabled = false;

                const formatTime = (seconds) => {
                    const mins = Math.floor(seconds / 60);
                    const secs = Math.floor(seconds % 60);
                    return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                };

                mainMedia.addEventListener('loadedmetadata', () => {
                    const fullDuration = mainMedia.duration;
                    const start = itemData.startTime || 0;
                    const end = itemData.endTime !== null ? itemData.endTime : fullDuration;

                    mainMedia.currentTime = start;
                    timelineSlider.min = start;
                    timelineSlider.max = end;
                    timelineSlider.value = start;

                    timeDisplay.textContent = `${formatTime(start)} / ${formatTime(end)}`;

                    const frameCount = 50; 
                    const interval = (end - start) / frameCount;
                    
                    const canvas = document.createElement('canvas');
                    canvas.width = 100;
                    canvas.height = 40;
                    const ctx = canvas.getContext('2d');

                    const tempVideo = document.createElement('video');
                    tempVideo.src = itemData.url;
                    tempVideo.muted = true;
                    tempVideo.playsInline = true;

                    let currentIndex = 0;
                    const frameData = new Array(frameCount);

                    function processNext() {
                        if (currentIndex < frameCount) {
                            tempVideo.currentTime = Math.min(start + (currentIndex * interval), end - 0.01);
                        } else {
                            framesContainer.innerHTML = '';
                            for (let j = 0; j < frameCount; j++) {
                                const frameImg = document.createElement('img');
                                frameImg.src = frameData[j];
                                frameImg.className = 'timeline-frame';
                                framesContainer.appendChild(frameImg);
                            }
                        }
                    }

                    tempVideo.addEventListener('seeked', () => {
                        ctx.drawImage(tempVideo, 0, 0, canvas.width, canvas.height);
                        frameData[currentIndex] = canvas.toDataURL();
                        currentIndex++;
                        processNext();
                    });

                    tempVideo.addEventListener('loadeddata', () => {
                        processNext();
                    });
                });

                mainMedia.addEventListener('timeupdate', () => {
                    const start = itemData.startTime || 0;
                    const end = itemData.endTime !== null ? itemData.endTime : mainMedia.duration;

                    if (mainMedia.currentTime >= end) {
                        mainMedia.pause();
                        mainMedia.currentTime = start;
                        playBtn.innerHTML = '▶';
                    }

                    if (!isDragging && end > start) {
                        timelineSlider.value = mainMedia.currentTime;
                        const percent = ((mainMedia.currentTime - start) / (end - start)) * 100;
                        timelinePlayhead.style.left = `${Math.max(0, Math.min(100, percent))}%`;
                    }
                    timeDisplay.textContent = `${formatTime(mainMedia.currentTime)} / ${formatTime(end)}`;
                });

                playBtn.addEventListener('click', () => {
                    if (mainMedia.paused) {
                        mainMedia.play();
                        playBtn.innerHTML = '❚❚';
                    } else {
                        mainMedia.pause();
                        playBtn.innerHTML = '▶';
                    }
                });

                mainMedia.addEventListener('ended', () => {
                    playBtn.innerHTML = '▶';
                });
            }

            if (mainMedia) {
                mainMedia.addEventListener('click', (e) => {
                    e.stopPropagation();
                    mainMedia.classList.toggle('active-outline');
                });
            }
        }

        // Функция обрезки (деления клипа на 2 части по текущей позиции плейхеда)
        trimBtn.addEventListener('click', () => {
            if (!currentVideo || !currentItemData) return;
            const splitTime = currentVideo.currentTime;
            const start = currentItemData.startTime || 0;
            const end = currentItemData.endTime !== null ? currentItemData.endTime : currentVideo.duration;

            // Разделение имеет смысл, если точка разреза внутри клипа с запасом
            if (splitTime <= start + 0.1 || splitTime >= end - 0.1) return;

            // Создаем два новых диапазона
            const part1Start = start;
            const part1End = splitTime;
            const part2Start = splitTime;
            const part2End = end;

            // Добавляем две новые части в список превью
            addMediaItem(currentItemData.file, currentItemData.url, part1Start, part1End);
            addMediaItem(currentItemData.file, currentItemData.url, part2Start, part2End);

            // Переключаемся на первую получившуюся часть
            loadMediaToMain({
                file: currentItemData.file,
                url: currentItemData.url,
                type: currentItemData.type,
                startTime: part1Start,
                endTime: part1End
            });
        });

        function handleTimelineInteraction(e) {
            if (!currentVideo || timelineSlider.disabled) return;
            const rect = timelineWrapper.getBoundingClientRect();
            const clickPosition = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
            
            const start = currentItemData.startTime || 0;
            const end = currentItemData.endTime !== null ? currentItemData.endTime : currentVideo.duration;
            const durationSpan = end - start;

            const newTime = start + (clickPosition * durationSpan);
            currentVideo.currentTime = newTime;
            timelineSlider.value = newTime;
            timelinePlayhead.style.left = `${clickPosition * 100}%`;
        }

        let isMouseDownOnTimeline = false;

        timelineWrapper.addEventListener('mousedown', (e) => {
            if (!currentVideo || timelineSlider.disabled) return;
            isMouseDownOnTimeline = true;
            isDragging = true;
            
            timelineWrapper.classList.toggle('active-outline');
            handleTimelineInteraction(e);
        });

        window.addEventListener('mousemove', (e) => {
            if (isMouseDownOnTimeline && currentVideo) {
                handleTimelineInteraction(e);
            }
        });

        window.addEventListener('mouseup', () => {
            if (isMouseDownOnTimeline) {
                isMouseDownOnTimeline = false;
                isDragging = false;
            }
        });

        timelineSlider.addEventListener('input', () => {
            if (currentVideo) {
                isDragging = true;
                currentVideo.currentTime = timelineSlider.value;
                const start = currentItemData.startTime || 0;
                const end = currentItemData.endTime !== null ? currentItemData.endTime : currentVideo.duration;
                const percent = ((timelineSlider.value - start) / (end - start)) * 100;
                timelinePlayhead.style.left = `${Math.max(0, Math.min(100, percent))}%`;
            }
        });
        timelineSlider.addEventListener('change', () => {
            isDragging = false;
        });
    </script>
</body>
</html>
