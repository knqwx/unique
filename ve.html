<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace</title>
    <style>
        body {
            background-color: #1a1d24;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            user-select: none;
            gap: 16px;
        }

        .upload-wrapper {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }

        .controls-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .resolution-selector, .custom-input {
            background-color: #14161b;
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 0.85rem;
            font-weight: 600;
            outline: none;
            transition: border-color 0.2s, color 0.2s;
        }

        .resolution-selector {
            cursor: pointer;
        }

        .resolution-selector:hover, .custom-input:focus {
            border-color: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        .custom-inputs-container {
            display: none;
            gap: 6px;
        }

        .custom-input {
            width: 70px;
            text-align: center;
        }

        .upload-container {
            border: 2px dashed rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            width: 550px;
            height: 320px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background-color: #14161b;
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
            box-sizing: border-box;
            padding: 20px;
        }

        .upload-container:hover {
            border-color: rgba(255, 255, 255, 0.25);
            background-color: #181b21;
        }

        .upload-text {
            font-size: 1.25rem;
            color: #94a3b8;
            margin: 0;
            font-weight: 500;
        }

        .workspace {
            display: none;
            background-color: #14161b;
            border-radius: 16px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .media-box {
            background-color: #000000;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        canvas, img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: none;
            outline: none;
            cursor: grab;
        }

        canvas:active, img:active {
            cursor: grabbing;
        }

        .reset-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #14161b;
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
            z-index: 100;
            display: none;
            outline: none;
        }

        .reset-btn:hover {
            background-color: #1c2029;
            color: #ffffff;
        }

        #fileInput {
            display: none;
        }
    </style>
</head>
<body>

    <button class="reset-btn" id="resetBtn">Reset Position</button>

    <div class="upload-wrapper" id="uploadWrapper">
        <div class="controls-row">
            <select class="resolution-selector" id="resolutionMode">
                <option value="auto">Auto (Fit Screen)</option>
                <option value="custom">Custom Size</option>
            </select>

            <div class="custom-inputs-container" id="customInputsContainer">
                <input type="number" class="custom-input" id="customWidth" placeholder="Width">
                <input type="number" class="custom-input" id="customHeight" placeholder="Height">
            </div>
        </div>

        <div class="upload-container" id="dropZone">
            <p class="upload-text">Drag or choose files</p>
        </div>
    </div>

    <div class="workspace" id="workspace">
        <div class="media-box" id="mediaBox">
            <canvas id="videoCanvas"></canvas>
            <img id="imagePlayer" alt="Uploaded Image">
        </div>
    </div>

    <input type="file" id="fileInput" accept="video/*,image/*">

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const uploadWrapper = document.getElementById('uploadWrapper');
        const resolutionMode = document.getElementById('resolutionMode');
        const customInputsContainer = document.getElementById('customInputsContainer');
        const customWidth = document.getElementById('customWidth');
        const customHeight = document.getElementById('customHeight');
        const workspace = document.getElementById('workspace');
        const mediaBox = document.getElementById('mediaBox');
        const videoCanvas = document.getElementById('videoCanvas');
        const ctx = videoCanvas.getContext('2d');
        const imagePlayer = document.getElementById('imagePlayer');
        const resetBtn = document.getElementById('resetBtn');

        let hiddenVideo = document.createElement('video');
        hiddenVideo.muted = true;
        hiddenVideo.playsInline = true;

        let currentNaturalWidth = 0;
        let currentNaturalHeight = 0;
        let animFrameId = null;

        resolutionMode.addEventListener('change', (e) => {
            if (e.target.value === 'custom') {
                customInputsContainer.style.display = 'flex';
                applyBoxSize(false);
            } else {
                customInputsContainer.style.display = 'none';
                if (currentNaturalWidth && currentNaturalHeight) {
                    applyBoxSize(true, currentNaturalWidth, currentNaturalHeight);
                }
            }
        });

        function handleCustomInput() {
            if (resolutionMode.value === 'custom') {
                applyBoxSize(false);
            }
        }

        customWidth.addEventListener('input', handleCustomInput);
        customHeight.addEventListener('input', handleCustomInput);

        dropZone.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            uploadWrapper.style.display = 'none';
            workspace.style.display = 'block';
            resetBtn.style.display = 'block';

            resetPosition();

            const fileUrl = URL.createObjectURL(file);
            const isImage = file.type.startsWith('image/');

            if (animFrameId) cancelAnimationFrame(animFrameId);

            if (isImage) {
                imagePlayer.src = fileUrl;
                imagePlayer.style.display = 'block';
                videoCanvas.style.display = 'none';

                imagePlayer.onload = () => {
                    currentNaturalWidth = imagePlayer.naturalWidth;
                    currentNaturalHeight = imagePlayer.naturalHeight;
                    applyBoxSize(resolutionMode.value === 'auto', currentNaturalWidth, currentNaturalHeight);
                };
            } else {
                hiddenVideo.src = fileUrl;
                hiddenVideo.load();
                hiddenVideo.onloadedmetadata = () => {
                    currentNaturalWidth = hiddenVideo.videoWidth;
                    currentNaturalHeight = hiddenVideo.videoHeight;

                    // Задаем внутреннее разрешение холста равным исходному видео (без потерь качества)
                    videoCanvas.width = currentNaturalWidth;
                    videoCanvas.height = currentNaturalHeight;

                    videoCanvas.style.display = 'block';
                    imagePlayer.style.display = 'none';

                    applyBoxSize(resolutionMode.value === 'auto', currentNaturalWidth, currentNaturalHeight);
                    
                    hiddenVideo.play();
                    renderVideoToCanvas();
                };
            }
        });

        function renderVideoToCanvas() {
            if (hiddenVideo.paused || hiddenVideo.ended) return;
            ctx.drawImage(hiddenVideo, 0, 0, videoCanvas.width, videoCanvas.height);
            animFrameId = requestAnimationFrame(renderVideoToCanvas);
        }

        function applyBoxSize(isAuto, natW, natH) {
            if (isAuto) {
                const maxWidth = window.innerWidth * 0.75;
                const maxHeight = window.innerHeight * 0.75;
                
                let w = natW;
                let h = natH;
                
                if (w > maxWidth || h > maxHeight) {
                    const ratio = Math.min(maxWidth / w, maxHeight / h);
                    w = Math.round(w * ratio);
                    h = Math.round(h * ratio);
                }

                mediaBox.style.width = w + 'px';
                mediaBox.style.height = h + 'px';
            } else {
                const w = customWidth.value;
                const h = customHeight.value;
                if (w) mediaBox.style.width = w + 'px';
                if (h) mediaBox.style.height = h + 'px';
            }
        }

        // Управление пробелом для видео (пауза/плей)
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && workspace.style.display === 'block' && videoCanvas.style.display === 'block') {
                e.preventDefault();
                if (hiddenVideo.paused) {
                    hiddenVideo.play();
                    renderVideoToCanvas();
                } else {
                    hiddenVideo.pause();
                }
            }
        });

        let activeElement = null;
        let startX = 0;
        let startY = 0;
        let posX = 0;
        let posY = 0;

        function startDrag(e) {
            activeElement = e.target;
            startX = e.clientX - posX;
            startY = e.clientY - posY;
            e.preventDefault();
        }

        function onDrag(e) {
            if (!activeElement) return;
            posX = e.clientX - startX;
            posY = e.clientY - startY;
            activeElement.style.transform = `translate(${posX}px, ${posY}px)`;
        }

        function stopDrag() {
            activeElement = null;
        }

        videoCanvas.addEventListener('mousedown', startDrag);
        imagePlayer.addEventListener('mousedown', startDrag);
        document.addEventListener('mousemove', onDrag);
        document.addEventListener('mouseup', stopDrag);

        function resetPosition() {
            posX = 0;
            posY = 0;
            videoCanvas.style.transform = 'translate(0px, 0px)';
            imagePlayer.style.transform = 'translate(0px, 0px)';
        }

        resetBtn.addEventListener('click', () => {
            resetPosition();
            resetBtn.blur();
        });
    </script>
</body>
</html>
