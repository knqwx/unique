<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unique - Video Editor</title>
    <style>
        body {
            background-color: #1a1d24;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Область перетаскивания */
        .upload-container {
            border: 2px dashed rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            width: 550px;
            height: 320px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background-color: #14161b;
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
            box-sizing: border-box;
            padding: 20px;
        }

        .upload-container:hover {
            border-color: rgba(255, 255, 255, 0.25);
            background-color: #181b21;
        }

        .upload-text {
            font-size: 1.25rem;
            color: #94a3b8;
            margin: 0;
            font-weight: 500;
        }

        /* Секция загрузки */
        .progress-container {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px;
        }

        .file-size-text {
            font-size: 1rem;
            color: #94a3b8;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background-color: #262a33;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: #3b82f6;
            width: 0%;
            transition: width 0.1s linear;
        }

        .progress-percent {
            font-size: 0.9rem;
            color: #64748b;
            font-weight: 600;
        }

        /* Рабочая область плеера */
        .editor-workspace {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: 80%;
            max-width: 960px;
        }

        .video-container {
            position: relative;
            width: 100%;
            max-height: 500px;
            background-color: #000000;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            max-height: 500px;
            outline: none;
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 0.1s ease;
            object-fit: contain;
        }

        #videoPlayerA {
            z-index: 2;
        }

        #videoPlayerB {
            z-index: 1;
            opacity: 0;
        }

        /* Панель управления */
        .player-controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            background-color: #14161b;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-sizing: border-box;
        }

        .controls-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .controls-left, .controls-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-control {
            background-color: #262a33;
            color: #e2e8f0;
            width: 38px;
            height: 38px;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .btn-control:hover {
            background-color: #313642;
            border-color: rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }

        .time-display {
            font-size: 0.9rem;
            color: #94a3b8;
            font-variant-numeric: tabular-nums;
            font-weight: 500;
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 90px;
            height: 6px;
            background: #262a33;
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
        }

        /* Таймлайн */
        .timeline-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .timeline-container {
            position: relative;
            flex-grow: 1;
            height: 50px;
            background-color: #0f1115;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.06);
            user-select: none;
        }

        .timeline-strip {
            display: flex;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        /* Блок видео на таймлайне */
        .timeline-video-group {
            display: flex;
            height: 100%;
            flex: 1;
            border-right: 2px solid rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
            transition: box-shadow 0.2s, border-color 0.2s;
        }

        .timeline-video-group.active {
            box-shadow: inset 0 0 0 2px #3b82f6;
            background-color: rgba(59, 130, 246, 0.1);
        }

        .timeline-video-group canvas {
            height: 100%;
            flex: 1;
            object-fit: cover;
            pointer-events: none;
        }

        .timeline-progress-overlay {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background-color: rgba(59, 130, 246, 0.15);
            border-right: 2px solid #3b82f6;
            pointer-events: none;
        }

        .btn-add-media {
            width: 45px;
            height: 50px;
            background-color: #262a33;
            color: #e2e8f0;
            font-size: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.2s, border-color 0.2s;
            flex-shrink: 0;
        }

        .btn-add-media:hover {
            background-color: #313642;
            border-color: rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }

        #fileInput, #addMediaInput {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Контейнер загрузки -->
    <div class="upload-container" id="dropZone">
        <div id="initialContent">
            <p class="upload-text">Drag or choose files</p>
        </div>

        <div class="progress-container" id="progressContainer">
            <div class="file-size-text" id="fileSizeText">0 MB / 0 MB</div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBarFill"></div>
            </div>
            <div class="progress-percent" id="progressPercent">0%</div>
        </div>
    </div>

    <!-- Рабочая область плеера -->
    <div class="editor-workspace" id="editorWorkspace">
        <div class="video-container">
            <video id="videoPlayerA" controlslist="nodownload noplaybackrate" disablepictureinpicture></video>
            <video id="videoPlayerB" controlslist="nodownload noplaybackrate" disablepictureinpicture></video>
        </div>
        <div class="player-controls">
            <div class="controls-top">
                <div class="controls-left">
                    <button class="btn-control" id="playPauseBtn">▶</button>
                    <div class="time-display" id="timeDisplay">00:00 / 00:00</div>
                </div>
                <div class="controls-right">
                    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="1">
                </div>
            </div>
            
            <!-- Таймлайн и кнопка добавления -->
            <div class="timeline-wrapper">
                <div class="timeline-container" id="timelineContainer">
                    <div class="timeline-strip" id="timelineStrip"></div>
                    <div class="timeline-progress-overlay" id="timelineProgressOverlay"></div>
                </div>
                <button class="btn-add-media" id="addMediaBtn" title="Add video">+</button>
            </div>
        </div>
    </div>

    <input type="file" id="fileInput" accept="video/*">
    <input type="file" id="addMediaInput" accept="video/*" multiple>
    <video id="metaVideo" style="display:none;"></video>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const addMediaInput = document.getElementById('addMediaInput');
        const addMediaBtn = document.getElementById('addMediaBtn');
        const initialContent = document.getElementById('initialContent');
        const progressContainer = document.getElementById('progressContainer');
        const fileSizeText = document.getElementById('fileSizeText');
        const progressBarFill = document.getElementById('progressBarFill');
        const progressPercent = document.getElementById('progressPercent');
        
        const editorWorkspace = document.getElementById('editorWorkspace');
        const videoA = document.getElementById('videoPlayerA');
        const videoB = document.getElementById('videoPlayerB');
        const metaVideo = document.getElementById('metaVideo');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const timeDisplay = document.getElementById('timeDisplay');
        const timelineContainer = document.getElementById('timelineContainer');
        const timelineStrip = document.getElementById('timelineStrip');
        const timelineProgressOverlay = document.getElementById('timelineProgressOverlay');
        const volumeSlider = document.getElementById('volumeSlider');

        let playlist = [];
        let videoDurations = [];
        let totalDuration = 0;
        let currentPlayingIndex = 0;
        let activeVideo = videoA;
        let inactiveVideo = videoB;

        videoA.addEventListener('contextmenu', (e) => e.preventDefault());
        videoB.addEventListener('contextmenu', (e) => e.preventDefault());
        timelineContainer.addEventListener('contextmenu', (e) => e.preventDefault());

        dropZone.addEventListener('click', () => {
            if (progressContainer.style.display !== 'flex' && dropZone.style.display !== 'none') {
                fileInput.click();
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleInitialFile(e.target.files[0]);
            }
        });

        addMediaBtn.addEventListener('click', () => {
            addMediaInput.click();
        });

        addMediaInput.addEventListener('change', async (e) => {
            if (e.target.files.length > 0) {
                for (let file of e.target.files) {
                    playlist.push(file);
                }
                await initProjectMetadata();
            }
        });

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#3b82f6';
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.style.borderColor = 'rgba(255, 255, 255, 0.12)';
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = 'rgba(255, 255, 255, 0.12)';
            if (e.dataTransfer.files.length > 0) {
                handleInitialFile(e.dataTransfer.files[0]);
            }
        });

        function handleInitialFile(file) {
            initialContent.style.display = 'none';
            progressContainer.style.display = 'flex';

            const totalBytes = file.size;
            const totalMb = (totalBytes / (1024 * 1024)).toFixed(1);
            let loadedBytes = 0;
            const increment = totalBytes / 40; 

            const interval = setInterval(async () => {
                loadedBytes += increment;
                if (loadedBytes >= totalBytes) {
                    loadedBytes = totalBytes;
                    clearInterval(interval);
                    
                    setTimeout(async () => {
                        dropZone.style.display = 'none';
                        playlist = [file];
                        await initProjectMetadata();
                        editorWorkspace.style.display = 'flex';
                    }, 300);
                }

                const loadedMb = (loadedBytes / (1024 * 1024)).toFixed(1);
                const percent = Math.round((loadedBytes / totalBytes) * 100);

                fileSizeText.textContent = `${loadedMb} MB / ${totalMb} MB`;
                progressBarFill.style.width = `${percent}%`;
                progressPercent.textContent = `${percent}%`;
            }, 30);
        }

        async function initProjectMetadata() {
            videoDurations = [];
            totalDuration = 0;

            for (let file of playlist) {
                const url = URL.createObjectURL(file);
                metaVideo.src = url;
                await new Promise(resolve => {
                    metaVideo.onloadedmetadata = () => resolve();
                });
                videoDurations.push(metaVideo.duration);
                totalDuration += metaVideo.duration;
            }

            currentPlayingIndex = 0;
            activeVideo.src = URL.createObjectURL(playlist[0]);
            activeVideo.currentTime = 0;
            activeVideo.style.opacity = '1';
            inactiveVideo.style.opacity = '0';

            if (playlist.length > 1) {
                inactiveVideo.src = URL.createObjectURL(playlist[1]);
                inactiveVideo.currentTime = 0;
            }

            await generateFullFilmstrip();
            updateActiveVideoHighlight();
        }

        function getActiveVideoInfo(globalTime) {
            let accumulatedTime = 0;
            for (let i = 0; i < playlist.length; i++) {
                if (globalTime <= accumulatedTime + videoDurations[i] || i === playlist.length - 1) {
                    let localTime = globalTime - accumulatedTime;
                    if (localTime < 0) localTime = 0;
                    if (localTime > videoDurations[i]) localTime = videoDurations[i];
                    return { index: i, localTime: localTime };
                }
                accumulatedTime += videoDurations[i];
            }
            return { index: 0, localTime: 0 };
        }

        // Подсветка выбранного видео на таймлайне рамкой
        function updateActiveVideoHighlight() {
            const groups = timelineStrip.querySelectorAll('.timeline-video-group');
            groups.forEach((group, idx) => {
                if (idx === currentPlayingIndex) {
                    group.classList.add('active');
                } else {
                    group.classList.remove('active');
                }
            });
        }

        // ЛКМ — выбор видео (с обводкой), ПКМ — перемотка времени
        timelineContainer.addEventListener('mousedown', (e) => {
            if (totalDuration === 0) return;

            const rect = timelineContainer.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const percent = Math.max(0, Math.min(1, clickX / rect.width));
            const globalTargetTime = percent * totalDuration;
            const info = getActiveVideoInfo(globalTargetTime);

            if (e.button === 0) {
                // ЛЕВАЯ КНОПКА МЫШИ: выбор видео и включение с обводкой
                currentPlayingIndex = info.index;
                activeVideo.src = URL.createObjectURL(playlist[currentPlayingIndex]);
                activeVideo.currentTime = 0;
                activeVideo.play();
                playPauseBtn.textContent = '❚❚';

                if (currentPlayingIndex + 1 < playlist.length) {
                    inactiveVideo.src = URL.createObjectURL(playlist[currentPlayingIndex + 1]);
                    inactiveVideo.currentTime = 0;
                }
                updateActiveVideoHighlight();
            } else if (e.button === 2) {
                // ПРАВАЯ КНОПКА МЫШИ: перемотка времени
                if (info.index !== currentPlayingIndex) {
                    currentPlayingIndex = info.index;
                    activeVideo.src = URL.createObjectURL(playlist[currentPlayingIndex]);
                    activeVideo.currentTime = info.localTime;

                    if (currentPlayingIndex + 1 < playlist.length) {
                        inactiveVideo.src = URL.createObjectURL(playlist[currentPlayingIndex + 1]);
                        inactiveVideo.currentTime = 0;
                    }
                    updateActiveVideoHighlight();
                } else {
                    activeVideo.currentTime = info.localTime;
                }
                
                timelineProgressOverlay.style.width = `${percent * 100}%`;
                timeDisplay.textContent = `${formatTime(globalTargetTime)} / ${formatTime(totalDuration)}`;
            }
        });

        // Автоматическое переключение при окончании текущего ролика
        activeVideo.addEventListener('timeupdate', () => {
            if (totalDuration === 0 || activeVideo.paused) return;

            let accumulatedTime = 0;
            for (let i = 0; i < currentPlayingIndex; i++) {
                accumulatedTime += videoDurations[i];
            }
            const globalCurrent = accumulatedTime + activeVideo.currentTime;
            
            if (activeVideo.currentTime >= videoDurations[currentPlayingIndex] - 0.05) {
                if (currentPlayingIndex + 1 < playlist.length) {
                    currentPlayingIndex++;
                    updateActiveVideoHighlight();
                    
                    let temp = activeVideo;
                    activeVideo = inactiveVideo;
                    inactiveVideo = temp;

                    activeVideo.style.zIndex = '2';
                    activeVideo.style.opacity = '1';
                    inactiveVideo.style.zIndex = '1';
                    inactiveVideo.style.opacity = '0';

                    activeVideo.volume = volumeSlider.value;
                    activeVideo.play();

                    if (currentPlayingIndex + 1 < playlist.length) {
                        inactiveVideo.src = URL.createObjectURL(playlist[currentPlayingIndex + 1]);
                        inactiveVideo.currentTime = 0;
                    }
                    return;
                }
            }

            const percent = (globalCurrent / totalDuration) * 100;
            timelineProgressOverlay.style.width = `${percent}%`;
            timeDisplay.textContent = `${formatTime(globalCurrent)} / ${formatTime(totalDuration)}`;
        });

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        async function generateFullFilmstrip() {
            timelineStrip.innerHTML = '';
            const framesPerVideo = 10;

            for (let i = 0; i < playlist.length; i++) {
                const url = URL.createObjectURL(playlist[i]);
                metaVideo.src = url;
                
                await new Promise(resolve => {
                    metaVideo.onloadedmetadata = () => resolve();
                });

                const duration = videoDurations[i] || 1;
                
                // Создаем обертку для каждого видео на таймлайне
                const videoGroup = document.createElement('div');
                videoGroup.className = 'timeline-video-group';

                for (let j = 0; j < framesPerVideo; j++) {
                    const canvas = document.createElement('canvas');
                    canvas.width = 80;
                    canvas.height = 60;
                    const ctx = canvas.getContext('2d');
                    
                    metaVideo.currentTime = (duration / framesPerVideo) * j;
                    
                    await new Promise(resolve => {
                        const seekHandler = () => {
                            metaVideo.removeEventListener('seeked', seekHandler);
                            ctx.drawImage(metaVideo, 0, 0, canvas.width, canvas.height);
                            resolve();
                        };
                        metaVideo.addEventListener('seeked', seekHandler);
                    });
                    
                    videoGroup.appendChild(canvas);
                }
                timelineStrip.appendChild(videoGroup);
            }
            metaVideo.src = '';
        }

        playPauseBtn.addEventListener('click', () => {
            if (activeVideo.paused) {
                activeVideo.play();
                playPauseBtn.textContent = '❚❚';
            } else {
                activeVideo.pause();
                playPauseBtn.textContent = '▶';
            }
        });

        activeVideo.addEventListener('pause', () => { playPauseBtn.textContent = '▶'; });
        activeVideo.addEventListener('play', () => { playPauseBtn.textContent = '❚❚'; });

        volumeSlider.addEventListener('input', () => {
            activeVideo.volume = volumeSlider.value;
            inactiveVideo.volume = volumeSlider.value;
        });
    </script>
</body>
</html>
