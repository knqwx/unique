<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ve</title>
    <style>
        body {
            background-color: #1a1d20;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            gap: 15px;
            padding: 20px;
        }

        .box {
            width: 480px;
            height: 240px;
            background-color: #2c3136;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            border: none;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 16px;
            font-family: inherit;
            transition: background-color 0.2s;
        }

        .box:hover {
            background-color: #343a40;
        }
    </style>
</head>
<body>
    <button class="box">Choose File</button>
    <div class="box"></div>
</body>
</html>
