<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ve</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #1a1d20;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: row;
            justify-content: flex-start;
            align-items: flex-start;
            gap: 15px;
            padding: 20px;
            box-sizing: border-box;
            overflow: hidden;
            position: relative;
            font-family: 'Rubik', sans-serif;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 240px;
            flex-shrink: 0;
            height: calc(100vh - 40px);
        }

        .right-sidebar {
            width: 240px;
            flex-shrink: 0;
            height: calc(100vh - 40px);
            background-color: #2c3136;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .box {
            width: 100%;
            background-color: #2c3136;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            border: none;
            color: #ffffff;
            font-family: 'Rubik', sans-serif;
            box-sizing: border-box;
        }

        .upload-box {
            height: 100px;
            flex-shrink: 0;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .upload-box:hover {
            background-color: #343a40;
        }

        .preview-box {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 10px;
            overflow-y: auto;
            box-sizing: border-box;
            scrollbar-width: thin;
            scrollbar-color: #485059 #2c3136;
        }

        .preview-box::-webkit-scrollbar {
            width: 6px;
        }

        .preview-box::-webkit-scrollbar-track {
            background: #2c3136;
            border-radius: 3px;
        }

        .preview-box::-webkit-scrollbar-thumb {
            background: #485059;
            border-radius: 3px;
        }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            width: 100%;
        }

        .placeholder-text {
            color: #8b949e;
            font-size: 14px;
            margin: auto;
        }

        .preview-item {
            width: 100%;
            height: 65px;
            background-color: #1a1d20;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: 2px solid transparent;
            transition: border-color 0.2s;
            position: relative;
        }

        .preview-item:hover {
            border-color: #485059;
        }

        .preview-item.active-outline {
            border-color: #ffffff !important;
        }

        .preview-media {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        .trim-btn {
            background-color: #3b4249;
            color: #ffffff;
            border: none;
            width: 100%;
            height: 40px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            font-family: 'Rubik', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background-color 0.2s;
        }

        .trim-btn:hover:not(:disabled) {
            background-color: #485059;
        }

        .trim-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .main-display {
            width: calc(100% - 510px);
            flex-grow: 1;
            height: calc(100vh - 215px);
            background-color: #2c3136;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .main-placeholder {
            color: #8b949e;
            font-size: 16px;
        }

        .media-container {
            flex-grow: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            padding: 10px;
            box-sizing: border-box;
        }

        .main-media {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 4px;
        }

        .video-controls {
            width: 100%;
            background-color: #212529;
            padding: 10px 20px;
            box-sizing: border-box;
            display: none;
            align-items: center;
            gap: 15px;
            color: #ffffff;
            font-size: 14px;
        }

        .play-btn {
            background-color: #3b4249;
            color: #ffffff;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            font-family: 'Rubik', sans-serif;
            transition: background-color 0.2s;
        }

        .play-btn:hover {
            background-color: #485059;
        }

        #fileInput {
            display: none;
        }

        .bottom-lines-box {
            position: fixed;
            bottom: 20px;
            left: 275px;
            right: 275px;
            background-color: #2c3136;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            padding: 12px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 1000;
        }

        .bottom-line-timeline {
            position: relative;
            width: 100%;
            height: 40px;
            background-color: #33383d;
            border-radius: 4px;
            overflow: visible;
            display: flex;
            align-items: center;
            user-select: none;
            box-sizing: border-box;
        }

        .timeline-frames {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
            border-radius: 2px;
        }

        .timeline-frame {
            height: 100%;
            flex: 1 1 0px;
            min-width: 0;
            object-fit: cover;
            display: block;
        }

        .timeline-playhead {
            position: absolute;
            top: -6px;
            bottom: -6px;
            width: 3px;
            background-color: #ffffff;
            left: 0%;
            z-index: 5;
            pointer-events: none;
            box-shadow: 0 0 6px rgba(0, 0, 0, 0.9);
            border-radius: 1px;
        }

        .bottom-line {
            width: 100%;
            height: 40px;
            background-color: #33383d;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <input type="file" id="fileInput" accept="image/*,video/*" multiple>

    <div class="sidebar">
        <button class="box upload-box" onclick="document.getElementById('fileInput').click()">Choose File</button>
        <div class="box preview-box" id="previewContainer">
            <span class="placeholder-text">Preview</span>
        </div>
    </div>

    <div class="main-display" id="mainDisplay">
        <span class="main-placeholder">Select an item from the list</span>
    </div>

    <div class="right-sidebar">
        <button class="trim-btn" id="trimBtn" disabled>✂ Trim</button>
    </div>

    <div class="bottom-lines-box">
        <div class="bottom-line-timeline" id="timelineWrapper" oncontextmenu="return false;">
            <div class="timeline-frames" id="framesContainer"></div>
            <div class="timeline-playhead" id="timelinePlayhead"></div>
        </div>
        <div class="bottom-line"></div>
        <div class="bottom-line"></div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const mainDisplay = document.getElementById('mainDisplay');
        const timelineWrapper = document.getElementById('timelineWrapper');
        const framesContainer = document.getElementById('framesContainer');
        const timelinePlayhead = document.getElementById('timelinePlayhead');
        const trimBtn = document.getElementById('trimBtn');

        let hasItems = false;
        let gridWrapper = null;
        let currentVideo = null;
        let currentClip = null;
        let isMediaSelected = false;
        let isMouseDownOnTimeline = false;

        function updateTrimButtonState() {
            if (currentClip && currentClip.type.startsWith('video/') && isMediaSelected) {
                trimBtn.disabled = false;
            } else {
                trimBtn.disabled = true;
            }
        }

        fileInput.addEventListener('change', function(event) {
            const files = event.target.files;
            if (!files.length) return;

            if (!hasItems) {
                previewContainer.innerHTML = '';
                gridWrapper = document.createElement('div');
                gridWrapper.className = 'preview-grid';
                previewContainer.appendChild(gridWrapper);
                hasItems = true;
            }

            Array.from(files).forEach(file => {
                const fileURL = URL.createObjectURL(file);
                const clipData = {
                    file: file,
                    url: fileURL,
                    type: file.type,
                    startTime: 0,
                    endTime: null
                };
                createPreviewItem(clipData);
            });
            
            fileInput.value = '';
        });

        function createPreviewItem(clipData) {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'preview-item';

            let mediaElement;
            if (clipData.type.startsWith('image/')) {
                mediaElement = document.createElement('img');
                mediaElement.src = clipData.url;
                mediaElement.className = 'preview-media';
                itemDiv.appendChild(mediaElement);
            } else if (clipData.type.startsWith('video/')) {
                mediaElement = document.createElement('video');
                mediaElement.src = clipData.url;
                mediaElement.className = 'preview-media';
                mediaElement.currentTime = clipData.startTime;
                itemDiv.appendChild(mediaElement);
            }

            // ЛКМ по элементу превью
            itemDiv.addEventListener('click', function(e) {
                e.stopPropagation();
                
                // Убираем обводку со всех остальных превью
                document.querySelectorAll('.preview-item').forEach(el => el.classList.remove('active-outline'));
                
                // Включаем обводку для текущего
                itemDiv.classList.add('active-outline');
                isMediaSelected = true;

                loadClipToMain(clipData);
                updateTrimButtonState();
            });

            if (gridWrapper) {
                gridWrapper.appendChild(itemDiv);
            }
        }

        function loadClipToMain(clipData) {
            mainDisplay.innerHTML = '';
            currentVideo = null;
            currentClip = clipData;
            framesContainer.innerHTML = '';
            timelinePlayhead.style.left = '0%';

            const mediaContainer = document.createElement('div');
            mediaContainer.className = 'media-container';
            mainDisplay.appendChild(mediaContainer);

            let mainMedia;

            if (clipData.type.startsWith('image/')) {
                mainMedia = document.createElement('img');
                mainMedia.src = clipData.url;
                mainMedia.className = 'main-media';
                mediaContainer.appendChild(mainMedia);
            } else if (clipData.type.startsWith('video/')) {
                mainMedia = document.createElement('video');
                mainMedia.src = clipData.url;
                mainMedia.className = 'main-media';
                mediaContainer.appendChild(mainMedia);
                currentVideo = mainMedia;

                const controls = document.createElement('div');
                controls.className = 'video-controls';
                controls.style.display = 'flex';

                const playBtn = document.createElement('button');
                playBtn.className = 'play-btn';
                playBtn.innerHTML = '▶';
                controls.appendChild(playBtn);

                const timeDisplay = document.createElement('span');
                timeDisplay.textContent = '0:00 / 0:00';
                controls.appendChild(timeDisplay);

                mainDisplay.appendChild(controls);

                const formatTime = (seconds) => {
                    const mins = Math.floor(seconds / 60);
                    const secs = Math.floor(seconds % 60);
                    return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                };

                mainMedia.addEventListener('loadedmetadata', () => {
                    const fullDuration = mainMedia.duration;
                    const start = clipData.startTime || 0;
                    const end = clipData.endTime !== null ? clipData.endTime : fullDuration;

                    mainMedia.currentTime = start;
                    timeDisplay.textContent = `${formatTime(start)} / ${formatTime(end)}`;

                    const frameCount = 50; 
                    const interval = (end - start) / frameCount;
                    
                    const canvas = document.createElement('canvas');
                    canvas.width = 100;
                    canvas.height = 40;
                    const ctx = canvas.getContext('2d');

                    const tempVideo = document.createElement('video');
                    tempVideo.src = clipData.url;
                    tempVideo.muted = true;
                    tempVideo.playsInline = true;

                    let currentIndex = 0;
                    const frameData = new Array(frameCount);

                    function processNext() {
                        if (currentIndex < frameCount) {
                            tempVideo.currentTime = Math.min(start + (currentIndex * interval), end - 0.01);
                        } else {
                            framesContainer.innerHTML = '';
                            for (let j = 0; j < frameCount; j++) {
                                const frameImg = document.createElement('img');
                                frameImg.src = frameData[j];
                                frameImg.className = 'timeline-frame';
                                framesContainer.appendChild(frameImg);
                            }
                        }
                    }

                    tempVideo.addEventListener('seeked', () => {
                        ctx.drawImage(tempVideo, 0, 0, canvas.width, canvas.height);
                        frameData[currentIndex] = canvas.toDataURL();
                        currentIndex++;
                        processNext();
                    });

                    tempVideo.addEventListener('loadeddata', () => {
                        processNext();
                    });
                });

                mainMedia.addEventListener('timeupdate', () => {
                    const start = clipData.startTime || 0;
                    const end = clipData.endTime !== null ? clipData.endTime : mainMedia.duration;

                    if (mainMedia.currentTime >= end) {
                        mainMedia.pause();
                        mainMedia.currentTime = start;
                        playBtn.innerHTML = '▶';
                    }

                    if (end > start) {
                        const percent = ((mainMedia.currentTime - start) / (end - start)) * 100;
                        timelinePlayhead.style.left = `${Math.max(0, Math.min(100, percent))}%`;
                    }
                    timeDisplay.textContent = `${formatTime(mainMedia.currentTime)} / ${formatTime(end)}`;
                });

                playBtn.addEventListener('click', () => {
                    if (mainMedia.paused) {
                        mainMedia.play();
                        playBtn.innerHTML = '❚❚';
                    } else {
                        mainMedia.pause();
                        playBtn.innerHTML = '▶';
                    }
                });

                mainMedia.addEventListener('ended', () => {
                    playBtn.innerHTML = '▶';
                });
            }
        }

        // Кнопка Trim делит видео на 2 независимых блока в превью
        trimBtn.addEventListener('click', () => {
            if (!currentVideo || !currentClip || !isMediaSelected) return;

            const splitTime = currentVideo.currentTime;
            const start = currentClip.startTime || 0;
            const end = currentClip.endTime !== null ? currentClip.endTime : currentVideo.duration;

            if (splitTime <= start + 0.1 || splitTime >= end - 0.1) return;

            const clipPart1 = {
                file: currentClip.file,
                url: currentClip.url,
                type: currentClip.type,
                startTime: start,
                endTime: splitTime
            };

            const clipPart2 = {
                file: currentClip.file,
                url: currentClip.url,
                type: currentClip.type,
                startTime: splitTime,
                endTime: end
            };

            createPreviewItem(clipPart1);
            createPreviewItem(clipPart2);

            mainDisplay.innerHTML = '<span class="main-placeholder">Select an item from the list</span>';
            currentVideo = null;
            currentClip = null;
            isMediaSelected = false;
            framesContainer.innerHTML = '';
            timelinePlayhead.style.left = '0%';
            updateTrimButtonState();
        });

        // Управление таймлайном только через ПКМ
        function handleTimelineInteraction(e) {
            if (!currentVideo) return;
            const rect = timelineWrapper.getBoundingClientRect();
            const clickPosition = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
            
            const start = currentClip.startTime || 0;
            const end = currentClip.endTime !== null ? currentClip.endTime : currentVideo.duration;
            const durationSpan = end - start;

            const newTime = start + (clickPosition * durationSpan);
            currentVideo.currentTime = newTime;
            timelinePlayhead.style.left = `${clickPosition * 100}%`;
        }

        timelineWrapper.addEventListener('mousedown', (e) => {
            if (e.button === 2) { // Только ПКМ
                if (!currentVideo) return;
                isMouseDownOnTimeline = true;
                handleTimelineInteraction(e);
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (isMouseDownOnTimeline && currentVideo) {
                handleTimelineInteraction(e);
            }
        });

        window.addEventListener('mouseup', (e) => {
            if (e.button === 2 || isMouseDownOnTimeline) {
                isMouseDownOnTimeline = false;
            }
        });
    </script>
</body>
</html>
