<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ve</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #1a1d20;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: row;
            justify-content: flex-start;
            align-items: stretch;
            gap: 20px;
            padding: 20px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            box-sizing: border-box;
            overflow: hidden;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 380px;
            flex-shrink: 0;
            height: 100%;
        }

        .box {
            width: 100%;
            background-color: #2c3136;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            border: none;
            color: #ffffff;
            font-family: inherit;
            box-sizing: border-box;
        }

        .upload-box {
            height: 180px;
            flex-shrink: 0;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .upload-box:hover {
            background-color: #343a40;
        }

        .preview-box {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 12px;
            overflow-y: auto;
            box-sizing: border-box;
            scrollbar-width: thin;
            scrollbar-color: #485059 #2c3136;
        }

        .preview-box::-webkit-scrollbar {
            width: 6px;
        }

        .preview-box::-webkit-scrollbar-track {
            background: #2c3136;
            border-radius: 3px;
        }

        .preview-box::-webkit-scrollbar-thumb {
            background: #485059;
            border-radius: 3px;
        }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 100%;
        }

        .placeholder-text {
            color: #8b949e;
            font-size: 14px;
            margin: auto;
        }

        .preview-item {
            width: 100%;
            height: 100px;
            background-color: #1a1d20;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: 2px solid transparent;
            transition: border-color 0.2s;
        }

        .preview-item:hover {
            border-color: #485059;
        }

        .preview-media {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .main-display {
            flex-grow: 1;
            background-color: #2c3136;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .main-placeholder {
            color: #8b949e;
            font-size: 16px;
        }

        .main-media {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        #fileInput {
            display: none;
        }
    </style>
</head>
<body>
    <input type="file" id="fileInput" accept="image/*,video/*" multiple>

    <div class="sidebar">
        <button class="box upload-box" onclick="document.getElementById('fileInput').click()">Choose File</button>
        <div class="box preview-box" id="previewContainer">
            <span class="placeholder-text">Preview</span>
        </div>
    </div>

    <div class="main-display" id="mainDisplay">
        <span class="main-placeholder">Select an item from the list</span>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const mainDisplay = document.getElementById('mainDisplay');
        let hasItems = false;
        let gridWrapper = null;

        fileInput.addEventListener('change', function(event) {
            const files = event.target.files;
            if (!files.length) return;

            if (!hasItems) {
                previewContainer.innerHTML = '';
                gridWrapper = document.createElement('div');
                gridWrapper.className = 'preview-grid';
                previewContainer.appendChild(gridWrapper);
                hasItems = true;
            }

            Array.from(files).forEach(file => {
                const fileURL = URL.createObjectURL(file);
                const itemDiv = document.createElement('div');
                itemDiv.className = 'preview-item';

                let mediaElement;
                if (file.type.startsWith('image/')) {
                    mediaElement = document.createElement('img');
                    mediaElement.src = fileURL;
                    mediaElement.className = 'preview-media';
                    itemDiv.appendChild(mediaElement);
                } else if (file.type.startsWith('video/')) {
                    mediaElement = document.createElement('video');
                    mediaElement.src = fileURL;
                    mediaElement.className = 'preview-media';
                    itemDiv.appendChild(mediaElement);
                }

                itemDiv.addEventListener('click', function() {
                    mainDisplay.innerHTML = '';
                    let displayMedia;
                    if (file.type.startsWith('image/')) {
                        displayMedia = document.createElement('img');
                        displayMedia.src = fileURL;
                        displayMedia.className = 'main-media';
                    } else if (file.type.startsWith('video/')) {
                        displayMedia = document.createElement('video');
                        displayMedia.src = fileURL;
                        displayMedia.className = 'main-media';
                        displayMedia.controls = true;
                        displayMedia.autoplay = true;
                    }
                    mainDisplay.appendChild(displayMedia);
                });

                gridWrapper.appendChild(itemDiv);
            });
            
            fileInput.value = '';
        });
    </script>
</body>
</html>
