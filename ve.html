<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unique - Video Editor</title>
    <style>
        body {
            background-color: #1a1d24;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Область перетаскивания */
        .upload-container {
            border: 2px dashed rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            width: 550px;
            height: 320px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background-color: #14161b;
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
            box-sizing: border-box;
            padding: 20px;
        }

        .upload-container:hover {
            border-color: rgba(255, 255, 255, 0.25);
            background-color: #181b21;
        }

        .upload-text {
            font-size: 1.25rem;
            color: #94a3b8;
            margin: 0;
            font-weight: 500;
        }

        /* Секция загрузки */
        .progress-container {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px;
        }

        .file-size-text {
            font-size: 1rem;
            color: #94a3b8;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background-color: #262a33;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: #3b82f6;
            width: 0%;
            transition: width 0.1s linear;
        }

        .progress-percent {
            font-size: 0.9rem;
            color: #64748b;
            font-weight: 600;
        }

        /* Рабочая область плеера */
        .editor-workspace {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: 80%;
            max-width: 960px;
        }

        video {
            width: 100%;
            max-height: 500px;
            background-color: #000000;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            outline: none;
        }

        /* Панель управления */
        .player-controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            background-color: #14161b;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-sizing: border-box;
        }

        .controls-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .controls-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Кнопка с символами */
        .btn-control {
            background-color: #262a33;
            color: #e2e8f0;
            width: 38px;
            height: 38px;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .btn-control:hover {
            background-color: #313642;
            border-color: rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }

        /* Счетчик времени (просмотрено / всего) */
        .time-display {
            font-size: 0.9rem;
            color: #94a3b8;
            font-variant-numeric: tabular-nums;
            font-weight: 500;
        }

        /* Кадровая полоса перемотки (Timeline / Filmstrip) */
        .timeline-container {
            position: relative;
            width: 100%;
            height: 50px;
            background-color: #0f1115;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .timeline-strip {
            display: flex;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .timeline-strip canvas {
            height: 100%;
            flex: 1;
            object-fit: cover;
            border-right: 1px solid rgba(0, 0, 0, 0.3);
        }

        /* Ползунок поверх кадров */
        .timeline-progress-overlay {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background-color: rgba(59, 130, 246, 0.25);
            border-right: 2px solid #3b82f6;
            pointer-events: none;
        }

        .timeline-range-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        #fileInput {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Контейнер загрузки -->
    <div class="upload-container" id="dropZone">
        <div id="initialContent">
            <p class="upload-text">Drag or choose files</p>
        </div>

        <div class="progress-container" id="progressContainer">
            <div class="file-size-text" id="fileSizeText">0 MB / 0 MB</div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBarFill"></div>
            </div>
            <div class="progress-percent" id="progressPercent">0%</div>
        </div>
    </div>

    <!-- Рабочая область плеера -->
    <div class="editor-workspace" id="editorWorkspace">
        <video id="videoPlayer"></video>
        <div class="player-controls">
            <div class="controls-top">
                <div class="controls-left">
                    <button class="btn-control" id="playPauseBtn">▶</button>
                    <div class="time-display" id="timeDisplay">00:00 / 00:00</div>
                </div>
            </div>
            
            <!-- Полоса с кадрами -->
            <div class="timeline-container" id="timelineContainer">
                <div class="timeline-strip" id="timelineStrip"></div>
                <div class="timeline-progress-overlay" id="timelineProgressOverlay"></div>
                <input type="range" class="timeline-range-input" id="seekBar" value="0" min="0" max="100" step="0.1">
            </div>
        </div>
    </div>

    <input type="file" id="fileInput" accept="video/*">

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const initialContent = document.getElementById('initialContent');
        const progressContainer = document.getElementById('progressContainer');
        const fileSizeText = document.getElementById('fileSizeText');
        const progressBarFill = document.getElementById('progressBarFill');
        const progressPercent = document.getElementById('progressPercent');
        
        const editorWorkspace = document.getElementById('editorWorkspace');
        const videoPlayer = document.getElementById('videoPlayer');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const seekBar = document.getElementById('seekBar');
        const timeDisplay = document.getElementById('timeDisplay');
        const timelineStrip = document.getElementById('timelineStrip');
        const timelineProgressOverlay = document.getElementById('timelineProgressOverlay');

        dropZone.addEventListener('click', () => {
            if (progressContainer.style.display !== 'flex' && dropZone.style.display !== 'none') {
                fileInput.click();
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#3b82f6';
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.style.borderColor = 'rgba(255, 255, 255, 0.12)';
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = 'rgba(255, 255, 255, 0.12)';
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        function handleFile(file) {
            initialContent.style.display = 'none';
            progressContainer.style.display = 'flex';

            const totalBytes = file.size;
            const totalMb = (totalBytes / (1024 * 1024)).toFixed(1);
            let loadedBytes = 0;
            const increment = totalBytes / 40; 

            const interval = setInterval(() => {
                loadedBytes += increment;
                if (loadedBytes >= totalBytes) {
                    loadedBytes = totalBytes;
                    clearInterval(interval);
                    
                    setTimeout(() => {
                        dropZone.style.display = 'none';
                        const videoUrl = URL.createObjectURL(file);
                        videoPlayer.src = videoUrl;
                        editorWorkspace.style.display = 'flex';
                        
                        // Генерируем кадры для таймлайна после загрузки метаданных
                        videoPlayer.onloadedmetadata = () => {
                            generateFilmstrip(videoPlayer);
                        };
                    }, 300);
                }

                const loadedMb = (loadedBytes / (1024 * 1024)).toFixed(1);
                const percent = Math.round((loadedBytes / totalBytes) * 100);

                fileSizeText.textContent = `${loadedMb} MB / ${totalMb} MB`;
                progressBarFill.style.width = `${percent}%`;
                progressPercent.textContent = `${percent}%`;
            }, 30);
        }

        // Форматирование секунд в вид MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        // Генерация кадров (филмстрипа) для таймлайна
        async function generateFilmstrip(video) {
            timelineStrip.innerHTML = '';
            const frameCount = 10; // Количество превью-кадров на полосе
            const duration = video.duration;
            
            for (let i = 0; i < frameCount; i++) {
                const canvas = document.createElement('canvas');
                canvas.width = 100;
                canvas.height = 60;
                const ctx = canvas.getContext('2d');
                
                // Переходим к нужному моменту времени для захвата кадра
                video.currentTime = (duration / frameCount) * i;
                
                // Ждем пока кадр отрисуется
                await new Promise(resolve => {
                    const seekHandler = () => {
                        video.removeEventListener('seeked', seekHandler);
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        resolve();
                    };
                    video.addEventListener('seeked', seekHandler);
                });
                
                timelineStrip.appendChild(canvas);
            }
            // Возвращаем видео в начало
            video.currentTime = 0;
        }

        // Кнопка Воспроизведение / Пауза
        playPauseBtn.addEventListener('click', () => {
            if (videoPlayer.paused) {
                videoPlayer.play();
                playPauseBtn.textContent = '❚❚';
            } else {
                videoPlayer.pause();
                playPauseBtn.textContent = '▶';
            }
        });

        videoPlayer.addEventListener('pause', () => { playPauseBtn.textContent = '▶'; });
        videoPlayer.addEventListener('play', () => { playPauseBtn.textContent = '❚❚'; });

        // Обновление времени и прогресса таймлайна
        videoPlayer.addEventListener('timeupdate', () => {
            if (!isNaN(videoPlayer.duration)) {
                const current = videoPlayer.currentTime;
                const duration = videoPlayer.duration;
                const percent = (current / duration) * 100;
                
                seekBar.value = percent;
                timelineProgressOverlay.style.width = `${percent}%`;
                timeDisplay.textContent = `${formatTime(current)} / ${formatTime(duration)}`;
            }
        });

        // Перемотка при движении ползунка
        seekBar.addEventListener('input', () => {
            if (!isNaN(videoPlayer.duration)) {
                const time = (seekBar.value / 100) * videoPlayer.duration;
                videoPlayer.currentTime = time;
                timelineProgressOverlay.style.width = `${seekBar.value}%`;
            }
        });
    </script>
</body>
</html>
