<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ve</title>
    <style>
        body {
            background-color: #1a1d20;
            margin: 0;
            height: 100vh;
            /* Используем flexbox, чтобы легко управлять расположением */
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            gap: 15px; /* Расстояние между квадратами */
            padding: 20px; /* Отступ от верхнего и левого края экрана */
        }

        .square {
            width: 80px;  /* Ширина квадрата */
            height: 80px; /* Высота квадрата */
            background-color: #2c3136; /* Чуть более светлый приятный серый оттенок для квадратов */
            border-radius: 8px; /* Скругленные углы (можно удалить, если нужны острые) */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3); /* Легкая тень для объема */
        }
    </style>
</head>
<body>
    <div class="square"></div>
    <div class="square"></div>
</body>
</html>
