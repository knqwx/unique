<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unique - Video Editor</title>
    <style>
        body {
            background-color: #1a1d24;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Область перетаскивания */
        .upload-container {
            border: 2px dashed rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            width: 550px;
            height: 320px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background-color: #14161b;
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
            box-sizing: border-box;
            padding: 20px;
        }

        .upload-container:hover {
            border-color: rgba(255, 255, 255, 0.25);
            background-color: #181b21;
        }

        .upload-text {
            font-size: 1.25rem;
            color: #94a3b8;
            margin: 0;
            font-weight: 500;
        }

        /* Секция загрузки */
        .progress-container {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px;
        }

        .file-size-text {
            font-size: 1rem;
            color: #94a3b8;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background-color: #262a33;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: #3b82f6;
            width: 0%;
            transition: width 0.1s linear;
        }

        .progress-percent {
            font-size: 0.9rem;
            color: #64748b;
            font-weight: 600;
        }

        /* Рабочая область плеера */
        .editor-workspace {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: 80%;
            max-width: 960px;
        }

        /* Увеличенный видеоплеер */
        video {
            width: 100%;
            max-height: 540px;
            background-color: #000000;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            outline: none;
        }

        /* Панель управления */
        .player-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            background-color: #14161b;
            padding: 14px 18px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-sizing: border-box;
        }

        .controls-row {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Кнопка с символами */
        .btn-control {
            background-color: #262a33;
            color: #e2e8f0;
            width: 40px;
            height: 40px;
            font-size: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .btn-control:hover {
            background-color: #313642;
            border-color: rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }

        /* Полоса перемотки (таймлайн видео) */
        .seek-bar {
            flex-grow: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            background: #262a33;
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        .seek-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .seek-bar::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        #fileInput {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Контейнер загрузки -->
    <div class="upload-container" id="dropZone">
        <div id="initialContent">
            <p class="upload-text">Drag or choose files</p>
        </div>

        <div class="progress-container" id="progressContainer">
            <div class="file-size-text" id="fileSizeText">0 MB / 0 MB</div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBarFill"></div>
            </div>
            <div class="progress-percent" id="progressPercent">0%</div>
        </div>
    </div>

    <!-- Рабочая область плеера -->
    <div class="editor-workspace" id="editorWorkspace">
        <video id="videoPlayer"></video>
        <div class="player-controls">
            <div class="controls-row">
                <button class="btn-control" id="playPauseBtn">▶</button>
                <input type="range" class="seek-bar" id="seekBar" value="0" min="0" max="100" step="0.1">
            </div>
        </div>
    </div>

    <input type="file" id="fileInput" accept="video/*">

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const initialContent = document.getElementById('initialContent');
        const progressContainer = document.getElementById('progressContainer');
        const fileSizeText = document.getElementById('fileSizeText');
        const progressBarFill = document.getElementById('progressBarFill');
        const progressPercent = document.getElementById('progressPercent');
        
        const editorWorkspace = document.getElementById('editorWorkspace');
        const videoPlayer = document.getElementById('videoPlayer');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const seekBar = document.getElementById('seekBar');

        dropZone.addEventListener('click', () => {
            if (progressContainer.style.display !== 'flex' && dropZone.style.display !== 'none') {
                fileInput.click();
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#3b82f6';
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.style.borderColor = 'rgba(255, 255, 255, 0.12)';
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = 'rgba(255, 255, 255, 0.12)';
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        function handleFile(file) {
            initialContent.style.display = 'none';
            progressContainer.style.display = 'flex';

            const totalBytes = file.size;
            const totalMb = (totalBytes / (1024 * 1024)).toFixed(1);
            let loadedBytes = 0;
            const increment = totalBytes / 40; 

            const interval = setInterval(() => {
                loadedBytes += increment;
                if (loadedBytes >= totalBytes) {
                    loadedBytes = totalBytes;
                    clearInterval(interval);
                    
                    setTimeout(() => {
                        dropZone.style.display = 'none';
                        videoPlayer.src = URL.createObjectURL(file);
                        editorWorkspace.style.display = 'flex';
                    }, 300);
                }

                const loadedMb = (loadedBytes / (1024 * 1024)).toFixed(1);
                const percent = Math.round((loadedBytes / totalBytes) * 100);

                fileSizeText.textContent = `${loadedMb} MB / ${totalMb} MB`;
                progressBarFill.style.width = `${percent}%`;
                progressPercent.textContent = `${percent}%`;
            }, 30);
        }

        // Логика кнопки Воспроизведение / Пауза (символы)
        playPauseBtn.addEventListener('click', () => {
            if (videoPlayer.paused) {
                videoPlayer.play();
                playPauseBtn.textContent = '❚❚';
            } else {
                videoPlayer.pause();
                playPauseBtn.textContent = '▶';
            }
        });

        videoPlayer.addEventListener('pause', () => {
            playPauseBtn.textContent = '▶';
        });
        videoPlayer.addEventListener('play', () => {
            playPauseBtn.textContent = '❚❚';
        });

        // Обновление шкалы перемотки по мере воспроизведения видео
        videoPlayer.addEventListener('timeupdate', () => {
            if (!isNaN(videoPlayer.duration)) {
                const percent = (videoPlayer.currentTime / videoPlayer.duration) * 100;
                seekBar.value = percent;
            }
        });

        // Перемотка видео при перемещении ползунка
        seekBar.addEventListener('input', () => {
            if (!isNaN(videoPlayer.duration)) {
                const time = (seekBar.value / 100) * videoPlayer.duration;
                videoPlayer.currentTime = time;
            }
        });
    </script>
</body>
</html>
