<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unique - Video Editor</title>
    <style>
        body {
            background-color: #1a1d24;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Область перетаскивания */
        .upload-container {
            border: 2px dashed rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            width: 550px;
            height: 320px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background-color: #14161b;
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
            box-sizing: border-box;
            padding: 20px;
        }

        .upload-container:hover {
            border-color: rgba(255, 255, 255, 0.25);
            background-color: #181b21;
        }

        .upload-text {
            font-size: 1.25rem;
            color: #94a3b8;
            margin: 0;
            font-weight: 500;
        }

        /* Секция загрузки */
        .progress-container {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px;
        }

        .file-size-text {
            font-size: 1rem;
            color: #94a3b8;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background-color: #262a33;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: #3b82f6;
            width: 0%;
            transition: width 0.1s linear;
        }

        .progress-percent {
            font-size: 0.9rem;
            color: #64748b;
            font-weight: 600;
        }

        /* Главный макет рабочей области */
        .editor-workspace {
            display: none;
            flex-direction: row;
            gap: 16px;
            width: 92%;
            max-width: 1100px;
            height: 600px;
        }

        /* Правая боковая панель */
        .sidebar {
            width: 220px;
            background-color: #14161b;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
        }

        .sidebar-top {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .sidebar-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        .speed-control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .speed-input-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #1a1d24;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .speed-input-label {
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .speed-input {
            background: transparent;
            border: none;
            color: #3b82f6;
            font-size: 0.9rem;
            font-weight: 600;
            width: 90px;
            outline: none;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        /* Кнопки в панели */
        .sidebar-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-action {
            background-color: #262a33;
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
        }

        .btn-action:hover {
            background-color: #313642;
        }

        .btn-export {
            background-color: #3b82f6;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
        }

        .btn-export:hover {
            background-color: #2563eb;
        }

        /* Главный контент */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .media-container {
            width: 100%;
            max-height: 440px;
            height: 440px;
            background-color: #000000;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            user-select: none;
        }

        video, img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            outline: none;
        }

        img {
            display: none;
        }

        /* Текстовый слой на видео */
        .draggable-text {
            position: absolute;
            color: #ffffff;
            font-size: 24px;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            cursor: grab;
            padding: 4px 8px;
            border: 1px dashed transparent;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            white-space: nowrap;
        }

        .draggable-text:hover {
            border-color: rgba(255,255,255,0.4);
        }

        .draggable-text:active {
            cursor: grabbing;
        }

        /* Панель управления */
        .player-controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            background-color: #14161b;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-sizing: border-box;
        }

        .controls-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .controls-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-control {
            background-color: #262a33;
            color: #e2e8f0;
            width: 38px;
            height: 38px;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .btn-control:hover {
            background-color: #313642;
            border-color: rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }

        .time-display {
            font-size: 0.9rem;
            color: #94a3b8;
            font-variant-numeric: tabular-nums;
            font-weight: 500;
        }

        /* Таймлайн */
        .timeline-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .timeline-container {
            position: relative;
            flex-grow: 1;
            height: 50px;
            background-color: #0f1115;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .timeline-strip {
            display: flex;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .timeline-strip canvas {
            height: 100%;
            flex: 1;
            object-fit: cover;
            border-right: 1px solid rgba(0, 0, 0, 0.3);
        }

        .timeline-progress-overlay {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background-color: rgba(59, 130, 246, 0.25);
            border-right: 2px solid #3b82f6;
            pointer-events: none;
        }

        .timeline-range-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            pointer-events: none;
        }

        #fileInput {
            display: none;
        }
    </style>
</head>
<body>

    <div class="upload-container" id="dropZone">
        <div id="initialContent">
            <p class="upload-text">Drag or choose files</p>
        </div>

        <div class="progress-container" id="progressContainer">
            <div class="file-size-text" id="fileSizeText">0 MB / 0 MB</div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBarFill"></div>
            </div>
            <div class="progress-percent" id="progressPercent">0%</div>
        </div>
    </div>

    <div class="editor-workspace" id="editorWorkspace">
        <div class="main-content">
            <div class="media-container" id="mediaContainer">
                <video id="videoPlayer" controlslist="nodownload noplaybackrate" disablepictureinpicture></video>
                <img id="imagePlayer" alt="Uploaded Image">
            </div>
            <div class="player-controls">
                <div class="controls-top">
                    <div class="controls-left">
                        <button class="btn-control" id="playPauseBtn">▶</button>
                        <div class="time-display" id="timeDisplay">00:00 / 00:00</div>
                    </div>
                </div>
                
                <div class="timeline-wrapper">
                    <div class="timeline-container" id="timelineContainer">
                        <div class="timeline-strip" id="timelineStrip"></div>
                        <div class="timeline-progress-overlay" id="timelineProgressOverlay"></div>
                        <input type="range" class="timeline-range-input" id="seekBar" value="0" min="0" max="100" step="0.1">
                    </div>
                </div>
            </div>
        </div>

        <div class="sidebar">
            <div class="sidebar-top">
                <div class="speed-control-group">
                    <div class="sidebar-title">Playback Speed</div>
                    <div class="speed-input-container">
                        <span class="speed-input-label">Speed</span>
                        <input type="text" class="speed-input" id="speedInput" value="1">
                    </div>
                </div>
                
                <div class="speed-control-group" style="margin-top: 12px;">
                    <div class="sidebar-title">Audio Volume</div>
                    <div class="speed-input-container">
                        <span class="speed-input-label">Volume</span>
                        <input type="text" class="speed-input" id="volumeInput" value="100">
                    </div>
                </div>

                <div class="sidebar-buttons" style="margin-top: 12px;">
                    <button class="btn-action" id="addTextBtn">+ Text</button>
                </div>
            </div>
            <button class="btn-export" id="exportBtn">Export</button>
        </div>
    </div>

    <input type="file" id="fileInput" accept="video/*,image/*">
    <video id="metaVideo" style="display:none;"></video>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const initialContent = document.getElementById('initialContent');
        const progressContainer = document.getElementById('progressContainer');
        const fileSizeText = document.getElementById('fileSizeText');
        const progressBarFill = document.getElementById('progressBarFill');
        const progressPercent = document.getElementById('progressPercent');
        
        const editorWorkspace = document.getElementById('editorWorkspace');
        const mediaContainer = document.getElementById('mediaContainer');
        const videoPlayer = document.getElementById('videoPlayer');
        const imagePlayer = document.getElementById('imagePlayer');
        const metaVideo = document.getElementById('metaVideo');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const seekBar = document.getElementById('seekBar');
        const timeDisplay = document.getElementById('timeDisplay');
        const timelineStrip = document.getElementById('timelineStrip');
        const timelineProgressOverlay = document.getElementById('timelineProgressOverlay');
        const timelineContainer = document.getElementById('timelineContainer');

        const speedInput = document.getElementById('speedInput');
        const volumeInput = document.getElementById('volumeInput');
        const addTextBtn = document.getElementById('addTextBtn');
        const exportBtn = document.getElementById('exportBtn');

        let uploadedFile = null;
        let isImage = false;
        let videoDuration = 0;
        let customPlaybackSpeed = 1;
        let imageCurrentTime = 0;
        let isPlayingImage = false;
        let imageTimer = null;
        
        let audioCtx = null;
        let gainNode = null;
        let sourceNode = null;

        videoPlayer.addEventListener('contextmenu', (e) => e.preventDefault());
        imagePlayer.addEventListener('contextmenu', (e) => e.preventDefault());

        function initAudioContext() {
            if (audioCtx || isImage) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                sourceNode = audioCtx.createMediaElementSource(videoPlayer);
                gainNode = audioCtx.createGain();
                sourceNode.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                setVolume(parseFloat(volumeInput.value) || 100);
            } catch (e) {
                console.error(e);
            }
        }

        dropZone.addEventListener('click', () => {
            if (progressContainer.style.display !== 'flex' && dropZone.style.display !== 'none') {
                fileInput.click();
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleInitialFile(e.target.files[0]);
            }
        });

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#3b82f6';
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.style.borderColor = 'rgba(255, 255, 255, 0.12)';
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = 'rgba(255, 255, 255, 0.12)';
            if (e.dataTransfer.files.length > 0) {
                handleInitialFile(e.dataTransfer.files[0]);
            }
        });

        function handleInitialFile(file) {
            initialContent.style.display = 'none';
            progressContainer.style.display = 'flex';

            const totalBytes = file.size;
            const totalMb = (totalBytes / (1024 * 1024)).toFixed(1);
            let loadedBytes = 0;
            const increment = totalBytes / 40; 

            const interval = setInterval(async () => {
                loadedBytes += increment;
                if (loadedBytes >= totalBytes) {
                    loadedBytes = totalBytes;
                    clearInterval(interval);
                    
                    setTimeout(async () => {
                        dropZone.style.display = 'none';
                        uploadedFile = file;
                        isImage = file.type.startsWith('image/');
                        await initProjectMetadata();
                        editorWorkspace.style.display = 'flex';
                    }, 300);
                }

                const loadedMb = (loadedBytes / (1024 * 1024)).toFixed(1);
                const percent = Math.round((loadedBytes / totalBytes) * 100);

                fileSizeText.textContent = `${loadedMb} MB / ${totalMb} MB`;
                progressBarFill.style.width = `${percent}%`;
                progressPercent.textContent = `${percent}%`;
            }, 30);
        }

        async function initProjectMetadata() {
            const url = URL.createObjectURL(uploadedFile);

            if (isImage) {
                videoDuration = 3.0;
                imageCurrentTime = 0;
                imagePlayer.src = url;
                imagePlayer.style.display = 'block';
                videoPlayer.style.display = 'none';
                
                updateImageUI(0);
                await generateImageFilmstrip(url);
            } else {
                imagePlayer.style.display = 'none';
                videoPlayer.style.display = 'block';

                metaVideo.src = url;
                await new Promise(resolve => {
                    metaVideo.onloadedmetadata = () => resolve();
                });
                videoDuration = metaVideo.duration;

                videoPlayer.src = url;
                videoPlayer.currentTime = 0;

                timeDisplay.textContent = `00:00 / ${formatTime(videoDuration / customPlaybackSpeed)}`;
                await generateFilmstrip();
            }
        }

        let isChangingTime = false;

        videoPlayer.addEventListener('timeupdate', () => {
            if (isImage || isChangingTime || videoDuration === 0) return;

            const current = videoPlayer.currentTime;
            const percent = (current / videoDuration) * 100;

            seekBar.value = percent;
            timelineProgressOverlay.style.width = `${percent}%`;
            timeDisplay.textContent = `${formatTime(current / customPlaybackSpeed)} / ${formatTime(videoDuration / customPlaybackSpeed)}`;
        });

        videoPlayer.addEventListener('ended', () => {
            videoPlayer.currentTime = 0;
            playPauseBtn.textContent = '▶';
        });

        function setPlaybackSpeed(speed) {
            if (isNaN(speed) || speed <= 0) return;
            customPlaybackSpeed = speed;
            if (!isImage) {
                videoPlayer.playbackRate = Math.max(0.063, Math.min(16, speed));
            }

            if (videoDuration > 0) {
                const current = isImage ? imageCurrentTime : videoPlayer.currentTime;
                timeDisplay.textContent = `${formatTime(current / customPlaybackSpeed)} / ${formatTime(videoDuration / customPlaybackSpeed)}`;
            }
        }

        speedInput.addEventListener('blur', () => {
            let val = parseFloat(speedInput.value.replace(',', '.'));
            if (isNaN(val) || val <= 0) {
                val = 1;
                speedInput.value = '1';
            }
            setPlaybackSpeed(val);
        });

        speedInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') speedInput.blur();
        });

        function setVolume(val) {
            if (isNaN(val) || val < 0) val = 100;
            if (val > 300) val = 300;

            volumeInput.value = val;
            const gainValue = val / 100;

            if (gainNode) {
                gainNode.gain.value = gainValue;
            } else if (!isImage) {
                videoPlayer.volume = Math.min(1, gainValue);
            }
        }

        volumeInput.addEventListener('blur', () => {
            let val = parseFloat(volumeInput.value.replace(',', '.'));
            setVolume(val);
        });

        volumeInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') volumeInput.blur();
        });

        // Добавление текстового слоя
        addTextBtn.addEventListener('click', () => {
            const userText = prompt('Введите текст:', 'Your Text');
            if (!userText) return;

            const textDiv = document.createElement('div');
            textDiv.className = 'draggable-text';
            textDiv.textContent = userText;
            mediaContainer.appendChild(textDiv);

            let isDragging = false;
            let startX, startY;

            textDiv.addEventListener('mousedown', (e) => {
                isDragging = true;
                startX = e.clientX - textDiv.offsetLeft;
                startY = e.clientY - textDiv.offsetTop;
                e.stopPropagation();
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                let x = e.clientX - startX;
                let y = e.clientY - startY;
                textDiv.style.left = `${x}px`;
                textDiv.style.top = `${y}px`;
                textDiv.style.transform = 'none';
            });

            document.addEventListener('mouseup', () => {
                isDragging = false;
            });
        });

        timelineContainer.addEventListener('mousedown', (e) => {
            if (e.button === 2) {
                if (videoDuration === 0) return;
                isChangingTime = true;

                const rect = timelineContainer.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                let percent = (clickX / rect.width) * 100;
                
                percent = Math.max(0, Math.min(100, percent));
                seekBar.value = percent;
                const targetTime = (percent / 100) * videoDuration;

                if (isImage) {
                    imageCurrentTime = targetTime;
                    updateImageUI(targetTime);
                } else {
                    videoPlayer.currentTime = targetTime;
                }

                timelineProgressOverlay.style.width = `${percent}%`;
                timeDisplay.textContent = `${formatTime(targetTime / customPlaybackSpeed)} / ${formatTime(videoDuration / customPlaybackSpeed)}`;
                isChangingTime = false;
            }
        });

        function updateImageUI(time) {
            const percent = (time / videoDuration) * 100;
            seekBar.value = percent;
            timelineProgressOverlay.style.width = `${percent}%`;
            timeDisplay.textContent = `${formatTime(time / customPlaybackSpeed)} / ${formatTime(videoDuration / customPlaybackSpeed)}`;
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        async function generateFilmstrip() {
            timelineStrip.innerHTML = '';
            const framesCount = 10;
            const url = URL.createObjectURL(uploadedFile);
            metaVideo.src = url;
            
            await new Promise(resolve => { metaVideo.onloadedmetadata = () => resolve(); });

            for (let j = 0; j < framesCount; j++) {
                const canvas = document.createElement('canvas');
                canvas.width = 80;
                canvas.height = 60;
                const ctx = canvas.getContext('2d');
                metaVideo.currentTime = (videoDuration / framesCount) * j;
                
                await new Promise(resolve => {
                    const seekHandler = () => {
                        metaVideo.removeEventListener('seeked', seekHandler);
                        ctx.drawImage(metaVideo, 0, 0, canvas.width, canvas.height);
                        resolve();
                    };
                    metaVideo.addEventListener('seeked', seekHandler);
                });
                timelineStrip.appendChild(canvas);
            }
            metaVideo.src = '';
        }

        async function generateImageFilmstrip(url) {
            timelineStrip.innerHTML = '';
            const framesCount = 10;
            const img = new Image();
            img.src = url;
            await new Promise(resolve => { img.onload = resolve; });

            for (let j = 0; j < framesCount; j++) {
                const canvas = document.createElement('canvas');
                canvas.width = 80;
                canvas.height = 60;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                timelineStrip.appendChild(canvas);
            }
        }

        playPauseBtn.addEventListener('click', () => {
            if (!isImage) {
                initAudioContext();
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

                if (videoPlayer.paused) {
                    videoPlayer.play();
                    playPauseBtn.textContent = '❚❚';
                } else {
                    videoPlayer.pause();
                    playPauseBtn.textContent = '▶';
                }
            } else {
                if (isPlayingImage) stopImagePlayback();
                else startImagePlayback();
            }
        });

        function startImagePlayback() {
            isPlayingImage = true;
            playPauseBtn.textContent = '❚❚';
            let lastTime = performance.now();
            if (imageCurrentTime >= videoDuration) imageCurrentTime = 0;
            imageTimer = requestImageStep(lastTime);
        }

        function requestImageStep(lastTime) {
            return requestAnimationFrame((now) => {
                if (!isPlayingImage) return;
                const delta = (now - lastTime) / 1000;
                imageCurrentTime += delta * customPlaybackSpeed;

                if (imageCurrentTime >= videoDuration) {
                    imageCurrentTime = videoDuration;
                    updateImageUI(imageCurrentTime);
                    stopImagePlayback();
                    imageCurrentTime = 0;
                    return;
                }

                updateImageUI(imageCurrentTime);
                imageTimer = requestImageStep(now);
            });
        }

        function stopImagePlayback() {
            isPlayingImage = false;
            playPauseBtn.textContent = '▶';
            if (imageTimer) {
                cancelAnimationFrame(imageTimer);
                imageTimer = null;
            }
        }

        // Облегченный экспорт через скачивание файла с применением скорости в плеере
        exportBtn.addEventListener('click', () => {
            if (!uploadedFile) return;
            
            // Если файл видео, можно быстро выдать измененный файл со скоростью плеера
            const a = document.createElement('a');
            a.href = URL.createObjectURL(uploadedFile);
            a.download = (uploadedFile.name ? uploadedFile.name.substring(0, uploadedFile.name.lastIndexOf('.')) : 'exported') + '-edited.webm';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });
    </script>
</body>
</html>
