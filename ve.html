<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ve</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #1a1d20;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            gap: 15px;
            padding: 20px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            box-sizing: border-box;
        }

        .box {
            width: 480px;
            background-color: #2c3136;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            border: none;
            color: #ffffff;
            font-family: inherit;
        }

        .upload-box {
            height: 240px;
            flex-shrink: 0;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .upload-box:hover {
            background-color: #343a40;
        }

        .preview-box {
            flex-grow: 1;
            width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
            overflow-y: auto;
            gap: 10px;
            box-sizing: border-box;
            scrollbar-width: thin;
            scrollbar-color: #485059 #2c3136;
        }

        .preview-box::-webkit-scrollbar {
            width: 6px;
        }

        .preview-box::-webkit-scrollbar-track {
            background: #2c3136;
            border-radius: 3px;
        }

        .preview-box::-webkit-scrollbar-thumb {
            background: #485059;
            border-radius: 3px;
        }

        .placeholder-text {
            color: #8b949e;
            font-size: 14px;
            margin: auto;
        }

        .preview-item {
            width: 100%;
            height: 120px;
            flex-shrink: 0;
            background-color: #1a1d20;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .preview-media {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #fileInput {
            display: none;
        }
    </style>
</head>
<body>
    <input type="file" id="fileInput" accept="image/*,video/*" multiple>

    <button class="box upload-box" onclick="document.getElementById('fileInput').click()">Choose File</button>
    <div class="box preview-box" id="previewContainer">
        <span class="placeholder-text">Preview</span>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        let hasItems = false;

        fileInput.addEventListener('change', function(event) {
            const files = event.target.files;
            if (!files.length) return;

            if (!hasItems) {
                previewContainer.innerHTML = '';
                hasItems = true;
            }

            Array.from(files).forEach(file => {
                const fileURL = URL.createObjectURL(file);
                const itemDiv = document.createElement('div');
                itemDiv.className = 'preview-item';

                if (file.type.startsWith('image/')) {
                    const img = document.createElement('img');
                    img.src = fileURL;
                    img.className = 'preview-media';
                    itemDiv.appendChild(img);
                } else if (file.type.startsWith('video/')) {
                    const video = document.createElement('video');
                    video.src = fileURL;
                    video.className = 'preview-media';
                    itemDiv.appendChild(video);
                }

                previewContainer.appendChild(itemDiv);
            });
            
            fileInput.value = '';
        });
    </script>
</body>
</html>
