<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ve</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #1a1d20;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: row;
            justify-content: flex-start;
            align-items: flex-start;
            gap: 15px;
            padding: 20px;
            box-sizing: border-box;
            overflow: hidden;
            position: relative;
            font-family: 'Rubik', sans-serif;
        }

        .sidebar-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 240px;
            flex-shrink: 0;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            height: calc(100vh - 215px);
        }

        .settings-icon-btn {
            width: 100%;
            height: 40px;
            background-color: #2c3136;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            border: none;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.2s;
            flex-shrink: 0;
        }

        .settings-icon-btn:hover {
            background-color: #343a40;
        }

        .settings-icon-btn svg {
            width: 20px;
            height: 20px;
            fill: #8b949e;
            transition: fill 0.2s;
        }

        .settings-icon-btn:hover svg {
            fill: #ffffff;
        }

        .right-sidebar {
            width: 240px;
            flex-shrink: 0;
            height: calc(100vh - 40px);
            background-color: #2c3136;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .box {
            width: 100%;
            background-color: #2c3136;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            border: none;
            color: #ffffff;
            font-family: 'Rubik', sans-serif;
            box-sizing: border-box;
        }

        .upload-box {
            height: 100px;
            flex-shrink: 0;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .upload-box:hover {
            background-color: #343a40;
        }

        .preview-box {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 10px;
            overflow-y: auto;
            box-sizing: border-box;
            scrollbar-width: thin;
            scrollbar-color: #485059 #2c3136;
        }

        .preview-box::-webkit-scrollbar {
            width: 6px;
        }

        .preview-box::-webkit-scrollbar-track {
            background: #2c3136;
            border-radius: 3px;
        }

        .preview-box::-webkit-scrollbar-thumb {
            background: #485059;
            border-radius: 3px;
        }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            width: 100%;
        }

        .placeholder-text {
            color: #8b949e;
            font-size: 14px;
            margin: auto;
        }

        .preview-item {
            width: 100%;
            height: 65px;
            background-color: #1a1d20;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: 2px solid transparent;
            transition: border-color 0.2s;
            position: relative;
        }

        .preview-item:hover {
            border-color: #485059;
        }

        .preview-item.active-outline {
            border-color: #ffffff !important;
        }

        .preview-media {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        .trim-btn {
            background-color: #3b4249;
            color: #ffffff;
            border: none;
            width: 100%;
            height: 40px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            font-family: 'Rubik', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background-color 0.2s;
        }

        .trim-btn:hover:not(:disabled) {
            background-color: #485059;
        }

        .trim-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .main-display {
            width: calc(100% - 510px);
            flex-grow: 1;
            height: calc(100vh - 215px);
            background-color: #2c3136;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .main-placeholder {
            color: #8b949e;
            font-size: 16px;
            position: absolute;
        }

        .media-container {
            flex-grow: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            padding: 10px;
            box-sizing: border-box;
            z-index: 2;
            cursor: pointer;
        }

        .main-media {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 4px;
            display: none;
        }

        .main-media.active {
            display: block;
        }

        .video-controls {
            width: 100%;
            background-color: #212529;
            padding: 10px 20px;
            box-sizing: border-box;
            display: none;
            align-items: center;
            gap: 15px;
            color: #ffffff;
            font-size: 14px;
            z-index: 2;
        }

        .play-btn {
            background-color: #3b4249;
            color: #ffffff;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            font-family: 'Rubik', sans-serif;
            transition: background-color 0.2s;
        }

        .play-btn:hover {
            background-color: #485059;
        }

        #fileInput {
            display: none;
        }

        .bottom-lines-box {
            position: fixed;
            bottom: 20px;
            left: 275px;
            right: 275px;
            background-color: #2c3136;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            padding: 12px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 1000;
        }

        .bottom-line-timeline {
            position: relative;
            width: 100%;
            height: 40px;
            background-color: #33383d;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            flex-direction: row;
            align-items: center;
            user-select: none;
            box-sizing: border-box;
        }

        .timeline-clip {
            position: relative;
            height: 100%;
            background-color: #3b4249;
            border: 2px solid transparent;
            box-sizing: border-box;
            cursor: pointer;
            overflow: hidden;
            display: flex;
            align-items: center;
            transition: border-color 0.2s;
        }

        .timeline-clip:hover {
            border-color: #485059;
        }

        .timeline-clip.active-outline {
            border-color: #ffffff !important;
            z-index: 10;
        }

        .timeline-frames {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .timeline-frame {
            height: 100%;
            flex: 1 1 0px;
            min-width: 0;
            object-fit: cover;
            display: block;
        }

        .timeline-playhead {
            position: absolute;
            top: -6px;
            bottom: -6px;
            width: 3px;
            background-color: #ffffff;
            left: 0%;
            z-index: 20;
            pointer-events: none;
            box-shadow: 0 0 6px rgba(0, 0, 0, 0.9);
            border-radius: 1px;
        }

        .bottom-line {
            width: 100%;
            height: 40px;
            background-color: #33383d;
            border-radius: 4px;
            box-sizing: border-box;
        }

        /* Модальное окно настроек */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-window {
            width: 400px;
            background-color: #2c3136;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            padding: 20px;
            box-sizing: border-box;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            font-weight: 600;
        }

        .modal-close-btn {
            background: none;
            border: none;
            color: #8b949e;
            font-size: 18px;
            cursor: pointer;
            padding: 0;
            transition: color 0.2s;
        }

        .modal-close-btn:hover {
            color: #ffffff;
        }

        .modal-body {
            font-size: 14px;
            color: #8b949e;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
    </style>
</head>
<body>
    <input type="file" id="fileInput" accept="image/*,video/*" multiple>

    <div class="sidebar-container">
        <div class="sidebar">
            <button class="box upload-box" onclick="document.getElementById('fileInput').click()">Choose File</button>
            <div class="box preview-box" id="previewContainer">
                <span class="placeholder-text">Preview</span>
            </div>
        </div>
        <button class="settings-icon-btn" id="settingsBtn" title="Настройки">
            <svg viewBox="0 0 24 24">
                <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 c-0.11,0.2-0.06,0.47,0.12,0.61l2.03,1.58c-0.05,0.3-0.07,0.62-0.07,0.94s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
            </svg>
        </button>
    </div>

    <div class="main-display" id="mainDisplay">
        <span class="main-placeholder" id="mainPlaceholder">Select an item from the list</span>
        <div class="media-container" id="mediaContainer">
            <img id="mainImage" class="main-media" alt="">
            <video id="mainVideo" class="main-media" playsinline></video>
        </div>
        <div class="video-controls" id="videoControls">
            <button class="play-btn" id="playBtn">&#9658;</button>
            <span id="timeDisplay">0:00 / 0:00</span>
        </div>
    </div>

    <div class="right-sidebar">
        <button class="trim-btn" id="trimBtn" disabled>&#9986; Trim</button>
    </div>

    <div class="bottom-lines-box">
        <div class="bottom-line-timeline" id="timelineWrapper" oncontextmenu="return false;">
            <div class="timeline-playhead" id="timelinePlayhead"></div>
        </div>
        <div class="bottom-line" id="timelineTrack1"></div>
        <div class="bottom-line" id="timelineTrack2"></div>
    </div>

    <!-- Модальное окно настроек -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-window">
            <div class="modal-header">
                <span>Настройки</span>
                <button class="modal-close-btn" id="closeModalBtn">&times;</button>
            </div>
            <div class="modal-body">
                <p>Здесь будут находиться параметры и настройки редактора.</p>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const timelineWrapper = document.getElementById('timelineWrapper');
        const timelinePlayhead = document.getElementById('timelinePlayhead');
        const trimBtn = document.getElementById('trimBtn');
        const mediaContainer = document.getElementById('mediaContainer');

        const mainPlaceholder = document.getElementById('mainPlaceholder');
        const mainImage = document.getElementById('mainImage');
        const mainVideo = document.getElementById('mainVideo');
        const videoControls = document.getElementById('videoControls');
        const playBtn = document.getElementById('playBtn');
        const timeDisplay = document.getElementById('timeDisplay');

        const settingsBtn = document.getElementById('settingsBtn');
        const settingsModal = document.getElementById('settingsModal');
        const closeModalBtn = document.getElementById('closeModalBtn');

        let hasItems = false;
        let gridWrapper = null;
        let activeClipObj = null; 
        let timelineClips = [];    
        let isMouseDownOnTimeline = false;
        let globalCurrentTime = 0;
        let isProgrammaticSeek = false;

        // Логика модального окна настроек
        settingsBtn.addEventListener('click', () => {
            settingsModal.classList.add('active');
        });

        closeModalBtn.addEventListener('click', () => {
            settingsModal.classList.remove('active');
        });

        settingsModal.addEventListener('click', (e) => {
            if (e.target === settingsModal) {
                settingsModal.classList.remove('active');
            }
        });

        function updateTrimButtonState() {
            if (activeClipObj && activeClipObj.type.startsWith('video/')) {
                trimBtn.disabled = false;
            } else {
                trimBtn.disabled = true;
            }
        }

        fileInput.addEventListener('change', function(event) {
            const files = event.target.files;
            if (!files.length) return;

            if (!hasItems) {
                previewContainer.innerHTML = '';
                gridWrapper = document.createElement('div');
                gridWrapper.className = 'preview-grid';
                previewContainer.appendChild(gridWrapper);
                hasItems = true;
            }

            Array.from(files).forEach(file => {
                const fileURL = URL.createObjectURL(file);
                const clipData = {
                    file: file,
                    url: fileURL,
                    type: file.type,
                    startTime: 0,
                    endTime: null
                };
                createPreviewItem(clipData);
            });
            
            fileInput.value = '';
        });

        function createPreviewItem(clipData) {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'preview-item';

            let mediaElement;
            if (clipData.type.startsWith('image/')) {
                mediaElement = document.createElement('img');
                mediaElement.src = clipData.url;
                mediaElement.className = 'preview-media';
                itemDiv.appendChild(mediaElement);
            } else if (clipData.type.startsWith('video/')) {
                mediaElement = document.createElement('video');
                mediaElement.src = clipData.url;
                mediaElement.className = 'preview-media';
                mediaElement.currentTime = 0;
                itemDiv.appendChild(mediaElement);
            }

            itemDiv.addEventListener('click', function(e) {
                e.stopPropagation();
                
                document.querySelectorAll('.preview-item').forEach(el => el.classList.remove('active-outline'));
                itemDiv.classList.add('active-outline');

                if (clipData.type.startsWith('video/')) {
                    const tempVid = document.createElement('video');
                    tempVid.src = clipData.url;
                    tempVid.addEventListener('loadedmetadata', () => {
                        const fullClip = {
                            file: clipData.file,
                            url: clipData.url,
                            type: clipData.type,
                            startTime: 0,
                            endTime: tempVid.duration
                        };
                        timelineClips = [fullClip];
                        activeClipObj = null;
                        globalCurrentTime = 0;
                        renderTimeline();
                        loadClipToMain(fullClip, 0);
                        updateTrimButtonState();
                    });
                } else {
                    const fullClip = {
                        file: clipData.file,
                        url: clipData.url,
                        type: clipData.type,
                        startTime: 0,
                        endTime: 5
                    };
                    timelineClips = [fullClip];
                    activeClipObj = null;
                    globalCurrentTime = 0;
                    renderTimeline();
                    loadClipToMain(fullClip, 0);
                    updateTrimButtonState();
                }
            });

            if (gridWrapper) {
                gridWrapper.appendChild(itemDiv);
            }
        }

        function renderTimeline() {
            const existingClips = timelineWrapper.querySelectorAll('.timeline-clip');
            existingClips.forEach(c => c.remove());

            const totalDuration = timelineClips.reduce((sum, clip) => sum + (clip.endTime - clip.startTime), 0);

            timelineClips.forEach(clip => {
                const clipEl = document.createElement('div');
                clipEl.className = 'timeline-clip';
                const clipDuration = clip.endTime - clip.startTime;
                const widthPercent = totalDuration > 0 ? (clipDuration / totalDuration) * 100 : 100;
                clipEl.style.width = `${widthPercent}%`;

                if (activeClipObj === clip) {
                    clipEl.classList.add('active-outline');
                }

                if (clip.type.startsWith('video/')) {
                    const framesContainer = document.createElement('div');
                    framesContainer.className = 'timeline-frames';
                    clipEl.appendChild(framesContainer);

                    generateFramesForClip(clip, framesContainer);
                }

                clipEl.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (activeClipObj === clip) {
                        deselectClip();
                    } else {
                        selectClip(clip);
                    }
                });

                timelineWrapper.appendChild(clipEl);
            });

            updatePlayheadPosition();
            updateTimeDisplay();
        }

        function generateFramesForClip(clip, framesContainer) {
            const frameCount = 20; 
            const duration = clip.endTime - clip.startTime;
            const interval = duration / frameCount;
            
            const canvas = document.createElement('canvas');
            canvas.width = 80;
            canvas.height = 40;
            const ctx = canvas.getContext('2d');

            const tempVideo = document.createElement('video');
            tempVideo.src = clip.url;
            tempVideo.muted = true;
            tempVideo.playsInline = true;

            let currentIndex = 0;
            const frameData = new Array(frameCount);

            function processNext() {
                if (currentIndex < frameCount) {
                    tempVideo.currentTime = Math.min(clip.startTime + (currentIndex * interval), clip.endTime - 0.01);
                } else {
                    framesContainer.innerHTML = '';
                    for (let j = 0; j < frameCount; j++) {
                        const frameImg = document.createElement('img');
                        frameImg.src = frameData[j];
                        frameImg.className = 'timeline-frame';
                        framesContainer.appendChild(frameImg);
                    }
                }
            }

            tempVideo.addEventListener('seeked', () => {
                ctx.drawImage(tempVideo, 0, 0, canvas.width, canvas.height);
                frameData[currentIndex] = canvas.toDataURL();
                currentIndex++;
                processNext();
            });

            tempVideo.addEventListener('loadeddata', () => {
                processNext();
            });
        }

        function selectClip(clip) {
            activeClipObj = clip;
            isProgrammaticSeek = true;
            
            const clipElements = timelineWrapper.querySelectorAll('.timeline-clip');
            clipElements.forEach(el => el.classList.remove('active-outline'));
            
            const index = timelineClips.indexOf(clip);
            if (clipElements[index]) {
                clipElements[index].classList.add('active-outline');
            }

            let accumulated = 0;
            let targetLocalTime = clip.startTime;
            for (let c of timelineClips) {
                const dur = c.endTime - c.startTime;
                if (c === clip) {
                    const offsetInThisClip = Math.max(0, Math.min(dur, globalCurrentTime - accumulated));
                    targetLocalTime = clip.startTime + offsetInThisClip;
                    break;
                }
                accumulated += dur;
            }

            loadClipToMain(clip, targetLocalTime);
            updateTrimButtonState();
        }

        function deselectClip() {
            activeClipObj = null;
            document.querySelectorAll('.timeline-clip').forEach(el => el.classList.remove('active-outline'));
            updateTrimButtonState();
        }

        mediaContainer.addEventListener('click', () => {
            if (timelineClips.length === 0) return;

            let accumulated = 0;
            let targetClip = null;
            for (let clip of timelineClips) {
                const duration = clip.endTime - clip.startTime;
                if (globalCurrentTime >= accumulated && globalCurrentTime <= accumulated + duration) {
                    targetClip = clip;
                    break;
                }
                accumulated += duration;
            }

            if (targetClip) {
                if (activeClipObj === targetClip) {
                    deselectClip();
                } else {
                    selectClip(targetClip);
                }
            }
        });

        const formatTime = (seconds) => {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        };

        function updateTimeDisplay() {
            const totalDuration = timelineClips.reduce((sum, clip) => sum + (clip.endTime - clip.startTime), 0);
            timeDisplay.textContent = `${formatTime(globalCurrentTime)} / ${formatTime(totalDuration)}`;
        }

        function loadClipToMain(clipData, startPlaybackTime = clipData.startTime) {
            mainPlaceholder.style.display = 'none';

            if (clipData.type.startsWith('image/')) {
                mainVideo.classList.remove('active');
                mainVideo.pause();
                videoControls.style.display = 'none';

                mainImage.src = clipData.url;
                mainImage.classList.add('active');
            } else if (clipData.type.startsWith('video/')) {
                mainImage.classList.remove('active');
                videoControls.style.display = 'flex';

                if (mainVideo.src !== clipData.url) {
                    mainVideo.src = clipData.url;
                }
                mainVideo.currentTime = startPlaybackTime;
                mainVideo.classList.add('active');

                updateTimeDisplay();
            }
        }

        mainVideo.addEventListener('seeked', () => {
            isProgrammaticSeek = false;
        });

        mainVideo.addEventListener('timeupdate', () => {
            if (isProgrammaticSeek) return;

            const totalDuration = timelineClips.reduce((sum, clip) => sum + (clip.endTime - clip.startTime), 0);

            if (activeClipObj && mainVideo.currentTime >= activeClipObj.endTime) {
                const currentIndex = timelineClips.indexOf(activeClipObj);
                if (currentIndex !== -1 && currentIndex < timelineClips.length - 1) {
                    const nextClip = timelineClips[currentIndex + 1];
                    activeClipObj = nextClip;
                    
                    const clipElements = timelineWrapper.querySelectorAll('.timeline-clip');
                    clipElements.forEach(el => el.classList.remove('active-outline'));
                    if (clipElements[currentIndex + 1]) {
                        clipElements[currentIndex + 1].classList.add('active-outline');
                    }

                    if (mainVideo.src === nextClip.url) {
                        mainVideo.currentTime = nextClip.startTime;
                    } else {
                        mainVideo.src = nextClip.url;
                        mainVideo.currentTime = nextClip.startTime;
                        mainVideo.play();
                    }
                    updateTrimButtonState();
                } else {
                    mainVideo.pause();
                    mainVideo.currentTime = activeClipObj.endTime;
                    playBtn.innerHTML = '&#9658;';
                }
            } else if (!activeClipObj && mainVideo.currentTime >= totalDuration) {
                mainVideo.pause();
                playBtn.innerHTML = '&#9658;';
            }

            if (activeClipObj) {
                let accumulated = 0;
                for (let c of timelineClips) {
                    const dur = c.endTime - c.startTime;
                    if (c === activeClipObj) {
                        globalCurrentTime = accumulated + (mainVideo.currentTime - c.startTime);
                        break;
                    }
                    accumulated += dur;
                }
            } else {
                globalCurrentTime = mainVideo.currentTime;
            }

            updatePlayheadPosition();
            updateTimeDisplay();
        });

        playBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (timelineClips.length === 0) return;

            if (mainVideo.paused) {
                if (activeClipObj) {
                    if (mainVideo.currentTime < activeClipObj.startTime || mainVideo.currentTime >= activeClipObj.endTime) {
                        mainVideo.currentTime = activeClipObj.startTime;
                    }
                }
                mainVideo.play();
                playBtn.innerHTML = '&#10074;&#10074;';
            } else {
                mainVideo.pause();
                playBtn.innerHTML = '&#9658;';
            }
        });

        mainVideo.addEventListener('ended', () => {
            playBtn.innerHTML = '&#9658;';
        });

        function updatePlayheadPosition() {
            const totalDuration = timelineClips.reduce((sum, clip) => sum + (clip.endTime - clip.startTime), 0);
            if (totalDuration > 0) {
                const percent = (globalCurrentTime / totalDuration) * 100;
                timelinePlayhead.style.left = `${Math.max(0, Math.min(100, percent))}%`;
            } else {
                timelinePlayhead.style.left = '0%';
            }
        }

        trimBtn.addEventListener('click', () => {
            if (!mainVideo || !activeClipObj) return;

            const splitTime = mainVideo.currentTime;
            const start = activeClipObj.startTime;
            const end = activeClipObj.endTime;

            if (splitTime <= start + 0.1 || splitTime >= end - 0.1) return;

            const clipPart1 = {
                file: activeClipObj.file,
                url: activeClipObj.url,
                type: activeClipObj.type,
                startTime: start,
                endTime: splitTime
            };

            const clipPart2 = {
                file: activeClipObj.file,
                url: activeClipObj.url,
                type: activeClipObj.type,
                startTime: splitTime,
                endTime: end
            };

            const index = timelineClips.indexOf(activeClipObj);
            if (index !== -1) {
                timelineClips.splice(index, 1, clipPart1, clipPart2);
            }

            renderTimeline();
            selectClip(clipPart1);
        });

        function handleTimelineInteraction(e) {
            if (timelineClips.length === 0) return;
            const rect = timelineWrapper.getBoundingClientRect();
            const clickPosition = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
            
            const totalDuration = timelineClips.reduce((sum, clip) => sum + (clip.endTime - clip.startTime), 0);
            globalCurrentTime = clickPosition * totalDuration;

            let accumulatedTime = 0;
            let targetClip = timelineClips[0];
            let clipLocalOffset = 0;

            for (let clip of timelineClips) {
                const duration = clip.endTime - clip.startTime;
                if (globalCurrentTime <= accumulatedTime + duration) {
                    targetClip = clip;
                    clipLocalOffset = globalCurrentTime - accumulatedTime;
                    break;
                }
                accumulatedTime += duration;
                targetClip = clip;
                clipLocalOffset = duration;
            }

            if (mainVideo.classList.contains('active')) {
                isProgrammaticSeek = true;
                if (activeClipObj !== targetClip) {
                    activeClipObj = targetClip;
                    
                    const clipElements = timelineWrapper.querySelectorAll('.timeline-clip');
                    clipElements.forEach(el => el.classList.remove('active-outline'));
                    const index = timelineClips.indexOf(targetClip);
                    if (clipElements[index]) {
                        clipElements[index].classList.add('active-outline');
                    }
                    
                    if (mainVideo.src !== targetClip.url) {
                        mainVideo.src = targetClip.url;
                    }
                    mainVideo.currentTime = targetClip.startTime + clipLocalOffset;
                    updateTrimButtonState();
                } else {
                    mainVideo.currentTime = targetClip.startTime + clipLocalOffset;
                }
            }

            updatePlayheadPosition();
            updateTimeDisplay();
        }

        timelineWrapper.addEventListener('mousedown', (e) => {
            if (e.button === 2) { 
                isMouseDownOnTimeline = true;
                handleTimelineInteraction(e);
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (isMouseDownOnTimeline) {
                handleTimelineInteraction(e);
            }
        });

        window.addEventListener('mouseup', (e) => {
            if (e.button === 2 || isMouseDownOnTimeline) {
                isMouseDownOnTimeline = false;
            }
        });
    </script>
</body>
</html>
