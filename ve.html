<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unique - Video Editor</title>
    <style>
        body {
            background-color: #1a1d24;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Область перетаскивания */
        .upload-container {
            border: 2px dashed rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            width: 550px;
            height: 320px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background-color: #14161b;
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
            box-sizing: border-box;
            padding: 20px;
        }

        .upload-container:hover {
            border-color: rgba(255, 255, 255, 0.25);
            background-color: #181b21;
        }

        .upload-text {
            font-size: 1.25rem;
            color: #94a3b8;
            margin: 0;
            font-weight: 500;
        }

        /* Секция загрузки */
        .progress-container {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px;
        }

        .file-size-text {
            font-size: 1rem;
            color: #94a3b8;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background-color: #262a33;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: #3b82f6;
            width: 0%;
            transition: width 0.1s linear;
        }

        .progress-percent {
            font-size: 0.9rem;
            color: #64748b;
            font-weight: 600;
        }

        /* Главный макет рабочей области (Слева плеер, справа панель) */
        .editor-workspace {
            display: none;
            flex-direction: row;
            gap: 16px;
            width: 92%;
            max-width: 1100px;
            height: 600px;
        }

        /* Правая боковая панель */
        .sidebar {
            width: 220px;
            background-color: #14161b;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-sizing: border-box;
        }

        .sidebar-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        .speed-control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .speed-slider-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #1a1d24;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .speed-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100px;
            height: 4px;
            background: #262a33;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        .speed-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
        }

        .speed-input {
            background: transparent;
            border: none;
            color: #3b82f6;
            font-size: 0.85rem;
            font-weight: 600;
            width: 50px;
            outline: none;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        /* Главный контент (плеер + элементы управления) */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        video {
            width: 100%;
            max-height: 440px;
            background-color: #000000;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            outline: none;
        }

        /* Панель управления */
        .player-controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            background-color: #14161b;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-sizing: border-box;
        }

        .controls-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .controls-left, .controls-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-control {
            background-color: #262a33;
            color: #e2e8f0;
            width: 38px;
            height: 38px;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .btn-control:hover {
            background-color: #313642;
            border-color: rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }

        .time-display {
            font-size: 0.9rem;
            color: #94a3b8;
            font-variant-numeric: tabular-nums;
            font-weight: 500;
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 90px;
            height: 6px;
            background: #262a33;
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
        }

        /* Строка с таймлайном */
        .timeline-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .timeline-container {
            position: relative;
            flex-grow: 1;
            height: 50px;
            background-color: #0f1115;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .timeline-container.active {
            border-color: #ffffff;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
        }

        .timeline-strip {
            display: flex;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .timeline-strip canvas {
            height: 100%;
            flex: 1;
            object-fit: cover;
            border-right: 1px solid rgba(0, 0, 0, 0.3);
        }

        .timeline-progress-overlay {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background-color: rgba(59, 130, 246, 0.25);
            border-right: 2px solid #3b82f6;
            pointer-events: none;
        }

        .timeline-range-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            pointer-events: none;
        }

        #fileInput {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Контейнер загрузки -->
    <div class="upload-container" id="dropZone">
        <div id="initialContent">
            <p class="upload-text">Drag or choose files</p>
        </div>

        <div class="progress-container" id="progressContainer">
            <div class="file-size-text" id="fileSizeText">0 MB / 0 MB</div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBarFill"></div>
            </div>
            <div class="progress-percent" id="progressPercent">0%</div>
        </div>
    </div>

    <!-- Рабочая область плеера с боковой панелью -->
    <div class="editor-workspace" id="editorWorkspace">
        
        <!-- Правый контент (плеер + элементы управления) -->
        <div class="main-content">
            <video id="videoPlayer" controlslist="nodownload noplaybackrate" disablepictureinpicture></video>
            <div class="player-controls">
                <div class="controls-top">
                    <div class="controls-left">
                        <button class="btn-control" id="playPauseBtn">▶</button>
                        <div class="time-display" id="timeDisplay">00:00 / 00:00</div>
                    </div>
                    <div class="controls-right">
                        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="1">
                    </div>
                </div>
                
                <!-- Таймлайн -->
                <div class="timeline-wrapper">
                    <div class="timeline-container" id="timelineContainer">
                        <div class="timeline-strip" id="timelineStrip"></div>
                        <div class="timeline-progress-overlay" id="timelineProgressOverlay"></div>
                        <input type="range" class="timeline-range-input" id="seekBar" value="0" min="0" max="100" step="0.1">
                    </div>
                </div>
            </div>
        </div>

        <!-- Правая боковая панель -->
        <div class="sidebar">
            <div class="speed-control-group">
                <div class="sidebar-title">Playback Speed</div>
                <div class="speed-slider-container">
                    <input type="range" class="speed-slider" id="speedSlider" min="0.1" max="10" step="0.01" value="1">
                    <input type="text" class="speed-input" id="speedInput" value="1.00x">
                </div>
            </div>
        </div>

    </div>

    <input type="file" id="fileInput" accept="video/*">
    <video id="metaVideo" style="display:none;"></video>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const initialContent = document.getElementById('initialContent');
        const progressContainer = document.getElementById('progressContainer');
        const fileSizeText = document.getElementById('fileSizeText');
        const progressBarFill = document.getElementById('progressBarFill');
        const progressPercent = document.getElementById('progressPercent');
        
        const editorWorkspace = document.getElementById('editorWorkspace');
        const videoPlayer = document.getElementById('videoPlayer');
        const metaVideo = document.getElementById('metaVideo');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const seekBar = document.getElementById('seekBar');
        const timeDisplay = document.getElementById('timeDisplay');
        const timelineStrip = document.getElementById('timelineStrip');
        const timelineProgressOverlay = document.getElementById('timelineProgressOverlay');
        const timelineContainer = document.getElementById('timelineContainer');
        const volumeSlider = document.getElementById('volumeSlider');

        // Элементы управления скоростью в боковой панели
        const speedSlider = document.getElementById('speedSlider');
        const speedInput = document.getElementById('speedInput');

        let videoFile = null;
        let videoDuration = 0;

        videoPlayer.addEventListener('contextmenu', (e) => e.preventDefault());
        timelineContainer.addEventListener('contextmenu', (e) => e.preventDefault());

        dropZone.addEventListener('click', () => {
            if (progressContainer.style.display !== 'flex' && dropZone.style.display !== 'none') {
                fileInput.click();
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleInitialFile(e.target.files[0]);
            }
        });

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#3b82f6';
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.style.borderColor = 'rgba(255, 255, 255, 0.12)';
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = 'rgba(255, 255, 255, 0.12)';
            if (e.dataTransfer.files.length > 0) {
                handleInitialFile(e.dataTransfer.files[0]);
            }
        });

        function handleInitialFile(file) {
            initialContent.style.display = 'none';
            progressContainer.style.display = 'flex';

            const totalBytes = file.size;
            const totalMb = (totalBytes / (1024 * 1024)).toFixed(1);
            let loadedBytes = 0;
            const increment = totalBytes / 40; 

            const interval = setInterval(async () => {
                loadedBytes += increment;
                if (loadedBytes >= totalBytes) {
                    loadedBytes = totalBytes;
                    clearInterval(interval);
                    
                    setTimeout(async () => {
                        dropZone.style.display = 'none';
                        videoFile = file;
                        await initProjectMetadata();
                        editorWorkspace.style.display = 'flex';
                    }, 300);
                }

                const loadedMb = (loadedBytes / (1024 * 1024)).toFixed(1);
                const percent = Math.round((loadedBytes / totalBytes) * 100);

                fileSizeText.textContent = `${loadedMb} MB / ${totalMb} MB`;
                progressBarFill.style.width = `${percent}%`;
                progressPercent.textContent = `${percent}%`;
            }, 30);
        }

        async function initProjectMetadata() {
            const url = URL.createObjectURL(videoFile);
            metaVideo.src = url;
            await new Promise(resolve => {
                metaVideo.onloadedmetadata = () => resolve();
            });
            videoDuration = metaVideo.duration;

            videoPlayer.src = url;
            videoPlayer.currentTime = 0;

            await generateFilmstrip();
        }

        let isChangingTime = false;

        videoPlayer.addEventListener('timeupdate', () => {
            if (isChangingTime || videoDuration === 0) return;

            const current = videoPlayer.currentTime;
            const percent = (current / videoDuration) * 100;
            const speed = videoPlayer.playbackRate || 1;

            seekBar.value = percent;
            timelineProgressOverlay.style.width = `${percent}%`;
            timeDisplay.textContent = `${formatTime(current / speed)} / ${formatTime(videoDuration / speed)}`;
        });

        videoPlayer.addEventListener('ended', () => {
            videoPlayer.currentTime = 0;
            playPauseBtn.textContent = '▶';
        });

        // Управление скоростью
        function updatePlaybackSpeed(speed) {
            if (isNaN(speed) || speed <= 0) return;
            videoPlayer.playbackRate = speed;
            speedSlider.value = speed;
            speedInput.value = speed.toFixed(2) + 'x';

            if (videoDuration > 0) {
                const current = videoPlayer.currentTime;
                timeDisplay.textContent = `${formatTime(current / speed)} / ${formatTime(videoDuration / speed)}`;
            }
        }

        speedSlider.addEventListener('input', () => {
            updatePlaybackSpeed(parseFloat(speedSlider.value));
        });

        speedInput.addEventListener('focus', () => {
            speedInput.value = parseFloat(speedSlider.value);
        });

        speedInput.addEventListener('blur', () => {
            let val = parseFloat(speedInput.value);
            if (isNaN(val)) val = 1;
            if (val < 0.1) val = 0.1;
            if (val > 10) val = 10;
            updatePlaybackSpeed(val);
        });

        speedInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                speedInput.blur();
            }
        });

        // ЛКМ — выбор клипа
        timelineContainer.addEventListener('mousedown', (e) => {
            if (e.button === 0) {
                timelineContainer.classList.add('active');
            }
        });

        document.addEventListener('mousedown', (e) => {
            if (e.button === 0 && !timelineContainer.contains(e.target)) {
                timelineContainer.classList.remove('active');
            }
        });

        // ПКМ — перемотка
        timelineContainer.addEventListener('mousedown', (e) => {
            if (e.button === 2) {
                if (videoDuration === 0) return;
                timelineContainer.classList.add('active');
                isChangingTime = true;

                const rect = timelineContainer.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const width = rect.width;
                let percent = (clickX / width) * 100;
                
                if (percent < 0) percent = 0;
                if (percent > 100) percent = 100;

                seekBar.value = percent;
                const targetTime = (percent / 100) * videoDuration;
                videoPlayer.currentTime = targetTime;

                timelineProgressOverlay.style.width = `${percent}%`;
                const speed = videoPlayer.playbackRate || 1;
                timeDisplay.textContent = `${formatTime(targetTime / speed)} / ${formatTime(videoDuration / speed)}`;
                isChangingTime = false;
            }
        });

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        async function generateFilmstrip() {
            timelineStrip.innerHTML = '';
            const framesCount = 10;

            const url = URL.createObjectURL(videoFile);
            metaVideo.src = url;
            
            await new Promise(resolve => {
                metaVideo.onloadedmetadata = () => resolve();
            });

            for (let j = 0; j < framesCount; j++) {
                const canvas = document.createElement('canvas');
                canvas.width = 80;
                canvas.height = 60;
                const ctx = canvas.getContext('2d');
                
                metaVideo.currentTime = (videoDuration / framesCount) * j;
                
                await new Promise(resolve => {
                    const seekHandler = () => {
                        metaVideo.removeEventListener('seeked', seekHandler);
                        ctx.drawImage(metaVideo, 0, 0, canvas.width, canvas.height);
                        resolve();
                    };
                    metaVideo.addEventListener('seeked', seekHandler);
                });
                
                timelineStrip.appendChild(canvas);
            }
            metaVideo.src = '';
        }

        playPauseBtn.addEventListener('click', () => {
            if (videoPlayer.paused) {
                videoPlayer.play();
                playPauseBtn.textContent = '❚❚';
            } else {
                videoPlayer.pause();
                playPauseBtn.textContent = '▶';
            }
        });

        videoPlayer.addEventListener('pause', () => { if(!isChangingTime) playPauseBtn.textContent = '▶'; });
        videoPlayer.addEventListener('play', () => { playPauseBtn.textContent = '❚❚'; });

        volumeSlider.addEventListener('input', () => {
            videoPlayer.volume = volumeSlider.value;
        });
    </script>
</body>
</html>
