<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ve</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #1a1d20;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: row;
            justify-content: flex-start;
            align-items: flex-start;
            gap: 15px;
            padding: 20px;
            box-sizing: border-box;
            overflow: hidden;
            position: relative;
            font-family: 'Rubik', sans-serif;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 240px;
            flex-shrink: 0;
            height: calc(100vh - 40px);
        }

        .right-sidebar {
            width: 240px;
            flex-shrink: 0;
            height: calc(100vh - 40px);
            background-color: #2c3136;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
        }

        .box {
            width: 100%;
            background-color: #2c3136;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            border: none;
            color: #ffffff;
            font-family: 'Rubik', sans-serif;
            box-sizing: border-box;
        }

        .upload-box {
            height: 100px;
            flex-shrink: 0;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .upload-box:hover {
            background-color: #343a40;
        }

        .preview-box {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 10px;
            overflow-y: auto;
            box-sizing: border-box;
            scrollbar-width: thin;
            scrollbar-color: #485059 #2c3136;
        }

        .preview-box::-webkit-scrollbar {
            width: 6px;
        }

        .preview-box::-webkit-scrollbar-track {
            background: #2c3136;
            border-radius: 3px;
        }

        .preview-box::-webkit-scrollbar-thumb {
            background: #485059;
            border-radius: 3px;
        }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            width: 100%;
        }

        .placeholder-text {
            color: #8b949e;
            font-size: 14px;
            margin: auto;
        }

        .preview-item {
            width: 100%;
            height: 65px;
            background-color: #1a1d20;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: 2px solid transparent;
            transition: border-color 0.2s;
        }

        .preview-item:hover {
            border-color: #485059;
        }

        .preview-media {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .main-display {
            width: calc(100% - 510px);
            flex-grow: 1;
            height: calc(100vh - 215px);
            background-color: #2c3136;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .main-placeholder {
            color: #8b949e;
            font-size: 16px;
        }

        .media-container {
            flex-grow: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .main-media {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* Панель управления снизу видео (кнопка Play и тайм-код) */
        .video-controls {
            width: 100%;
            background-color: #212529;
            padding: 10px 20px;
            box-sizing: border-box;
            display: none;
            align-items: center;
            gap: 15px;
            color: #ffffff;
            font-size: 14px;
        }

        .play-btn {
            background-color: #3b4249;
            color: #ffffff;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            transition: background-color 0.2s;
        }

        .play-btn:hover {
            background-color: #485059;
        }

        #fileInput {
            display: none;
        }

        .bottom-lines-box {
            position: fixed;
            bottom: 20px;
            left: 255px;
            right: 275px;
            background-color: #2c3136;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            padding: 12px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 1000;
        }

        .bottom-line-timeline {
            position: relative;
            width: 100%;
            height: 40px;
            background-color: #33383d;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            align-items: center;
            user-select: none;
        }

        .timeline-frames {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            z-index: 1;
            pointer-events: none;
        }

        .timeline-frame {
            height: 100%;
            flex: 1 1 0px;
            min-width: 0;
            object-fit: cover;
            display: block;
        }

        .timeline-slider {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 3;
            margin: 0;
        }

        .bottom-line {
            width: 100%;
            height: 40px;
            background-color: #33383d;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <input type="file" id="fileInput" accept="image/*,video/*" multiple>

    <div class="sidebar">
        <button class="box upload-box" onclick="document.getElementById('fileInput').click()">Choose File</button>
        <div class="box preview-box" id="previewContainer">
            <span class="placeholder-text">Preview</span>
        </div>
    </div>

    <div class="main-display" id="mainDisplay">
        <span class="main-placeholder">Select an item from the list</span>
    </div>

    <div class="right-sidebar"></div>

    <div class="bottom-lines-box">
        <!-- contextmenu заблокирован через preventDefault, чтобы ПКМ не вызывал стандартное меню, а перематывал -->
        <div class="bottom-line-timeline" id="timelineWrapper" oncontextmenu="return false;">
            <div class="timeline-frames" id="framesContainer"></div>
            <input type="range" min="0" max="100" value="0" step="0.01" class="timeline-slider" id="timelineSlider" disabled>
        </div>
        <div class="bottom-line"></div>
        <div class="bottom-line"></div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const mainDisplay = document.getElementById('mainDisplay');
        const timelineWrapper = document.getElementById('timelineWrapper');
        const framesContainer = document.getElementById('framesContainer');
        const timelineSlider = document.getElementById('timelineSlider');

        let hasItems = false;
        let gridWrapper = null;
        let currentVideo = null;
        let isDragging = false;

        fileInput.addEventListener('change', function(event) {
            const files = event.target.files;
            if (!files.length) return;

            if (!hasItems) {
                previewContainer.innerHTML = '';
                gridWrapper = document.createElement('div');
                gridWrapper.className = 'preview-grid';
                previewContainer.appendChild(gridWrapper);
                hasItems = true;
            }

            Array.from(files).forEach(file => {
                const fileURL = URL.createObjectURL(file);
                const itemDiv = document.createElement('div');
                itemDiv.className = 'preview-item';

                let mediaElement;
                if (file.type.startsWith('image/')) {
                    mediaElement = document.createElement('img');
                    mediaElement.src = fileURL;
                    mediaElement.className = 'preview-media';
                    itemDiv.appendChild(mediaElement);
                } else if (file.type.startsWith('video/')) {
                    mediaElement = document.createElement('video');
                    mediaElement.src = fileURL;
                    mediaElement.className = 'preview-media';
                    itemDiv.appendChild(mediaElement);
                }

                itemDiv.addEventListener('click', function() {
                    mainDisplay.innerHTML = '';
                    currentVideo = null;
                    framesContainer.innerHTML = '';
                    timelineSlider.disabled = true;

                    const mediaContainer = document.createElement('div');
                    mediaContainer.className = 'media-container';
                    mainDisplay.appendChild(mediaContainer);

                    if (file.type.startsWith('image/')) {
                        const img = document.createElement('img');
                        img.src = fileURL;
                        img.className = 'main-media';
                        mediaContainer.appendChild(img);
                    } else if (file.type.startsWith('video/')) {
                        const video = document.createElement('video');
                        video.src = fileURL;
                        video.className = 'main-media';
                        mediaContainer.appendChild(video);
                        currentVideo = video;

                        const controls = document.createElement('div');
                        controls.className = 'video-controls';
                        controls.style.display = 'flex';

                        const playBtn = document.createElement('button');
                        playBtn.className = 'play-btn';
                        playBtn.innerHTML = '▶';
                        controls.appendChild(playBtn);

                        const timeDisplay = document.createElement('span');
                        timeDisplay.textContent = '0:00 / 0:00';
                        controls.appendChild(timeDisplay);

                        mainDisplay.appendChild(controls);
                        timelineSlider.disabled = false;

                        const formatTime = (seconds) => {
                            const mins = Math.floor(seconds / 60);
                            const secs = Math.floor(seconds % 60);
                            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                        };

                        video.addEventListener('loadedmetadata', () => {
                            timelineSlider.max = video.duration;
                            timeDisplay.textContent = `0:00 / ${formatTime(video.duration)}`;

                            const duration = video.duration;
                            const frameCount = 50; 
                            const interval = duration / frameCount;
                            
                            const canvas = document.createElement('canvas');
                            canvas.width = 100;
                            canvas.height = 40;
                            const ctx = canvas.getContext('2d');

                            const tempVideo = document.createElement('video');
                            tempVideo.src = fileURL;
                            tempVideo.muted = true;
                            tempVideo.playsInline = true;

                            let currentIndex = 0;
                            const frameData = new Array(frameCount);

                            function processNext() {
                                if (currentIndex < frameCount) {
                                    tempVideo.currentTime = Math.min(currentIndex * interval, duration - 0.01);
                                } else {
                                    framesContainer.innerHTML = '';
                                    for (let j = 0; j < frameCount; j++) {
                                        const frameImg = document.createElement('img');
                                        frameImg.src = frameData[j];
                                        frameImg.className = 'timeline-frame';
                                        framesContainer.appendChild(frameImg);
                                    }
                                }
                            }

                            tempVideo.addEventListener('seeked', () => {
                                ctx.drawImage(tempVideo, 0, 0, canvas.width, canvas.height);
                                frameData[currentIndex] = canvas.toDataURL();
                                currentIndex++;
                                processNext();
                            });

                            tempVideo.addEventListener('loadeddata', () => {
                                processNext();
                            });
                        });

                        video.addEventListener('timeupdate', () => {
                            if (!isDragging) {
                                timelineSlider.value = video.currentTime;
                            }
                            timeDisplay.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
                        });

                        const togglePlay = () => {
                            if (video.paused) {
                                video.play();
                                playBtn.innerHTML = '❚❚';
                            } else {
                                video.pause();
                                playBtn.innerHTML = '▶';
                            }
                        };

                        playBtn.addEventListener('click', togglePlay);

                        video.addEventListener('ended', () => {
                            playBtn.innerHTML = '▶';
                        });
                    }
                });

                gridWrapper.appendChild(itemDiv);
            });
            
            fileInput.value = '';
        });

        // Функция быстрой перемотки кликом/зажатием (работает как для ЛКМ, так и для ПКМ)
        function handleTimelineInteraction(e) {
            if (!currentVideo || timelineSlider.disabled) return;
            const rect = timelineWrapper.getBoundingClientRect();
            const clickPosition = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
            const newTime = clickPosition * currentVideo.duration;
            currentVideo.currentTime = newTime;
            timelineSlider.value = newTime;
        }

        let isMouseDownOnTimeline = false;

        timelineWrapper.addEventListener('mousedown', (e) => {
            if (!currentVideo || timelineSlider.disabled) return;
            isMouseDownOnTimeline = true;
            isDragging = true;
            handleTimelineInteraction(e);
        });

        window.addEventListener('mousemove', (e) => {
            if (isMouseDownOnTimeline && currentVideo) {
                handleTimelineInteraction(e);
            }
        });

        window.addEventListener('mouseup', () => {
            if (isMouseDownOnTimeline) {
                isMouseDownOnTimeline = false;
                isDragging = false;
            }
        });

        timelineSlider.addEventListener('input', () => {
            if (currentVideo) {
                isDragging = true;
                currentVideo.currentTime = timelineSlider.value;
            }
        });
        timelineSlider.addEventListener('change', () => {
            isDragging = false;
        });
    </script>
</body>
</html>
