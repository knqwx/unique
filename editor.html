<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unique - Editor</title>
    <style>
        body {
            background-color: #1a1d24;
            margin: 0;
            height: 100vh;
            display: flex;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .sidebar {
            width: 250px;
            background-color: #14161b;
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            transition: width 0.3s ease, padding 0.3s ease;
            position: relative;
            z-index: 10;
        }

        /* Состояние скрытого сайдбара: уменьшаем ширину до размера кнопки */
        .sidebar.collapsed {
            width: 70px;
            padding: 20px 10px;
        }

        .sidebar-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        /* Единая кнопка скрыть/раскрыть */
        .toggle-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.4rem;
            cursor: pointer;
            padding: 8px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s, background-color 0.2s;
        }

        .toggle-btn:hover {
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.05);
        }

        /* Кнопка Create в темно-сером оформлении */
        .btn-create {
            background-color: #262a33;
            color: #e2e8f0;
            padding: 12px 16px;
            font-size: 0.95rem;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background-color 0.2s, border-color 0.2s;
            white-space: nowrap;
            overflow: hidden;
        }

        .btn-create:hover {
            background-color: #313642;
            border-color: rgba(255, 255, 255, 0.15);
        }

        /* Скрываем текст "Create", оставляем только плюсик, когда сайдбар свернут */
        .sidebar.collapsed .btn-create span {
            display: none;
        }

        .sidebar.collapsed .btn-create {
            padding: 12px 0;
            justify-content: center;
        }

        .main-area {
            flex-grow: 1;
        }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-top">
            <!-- Единая кнопка для скрытия и раскрытия -->
            <button class="toggle-btn" id="toggleSidebar" title="Toggle Sidebar">☰</button>
        </div>
        
        <a href="#" class="btn-create">
            <span class="icon">+</span>
            <span>Create</span>
        </a>
    </div>

    <div class="main-area"></div>

    <script>
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('toggleSidebar');

        toggleBtn.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
        });

        console.log("Editor script active.");
    </script>
</body>
</html>
