<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unique - Editor</title>
    <style>
        body {
            background-color: #1a1d24;
            margin: 0;
            height: 100vh;
            display: flex;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .sidebar {
            width: 250px;
            background-color: rgba(26, 29, 36, 0.95);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            transition: transform 0.3s ease;
            position: relative;
            z-index: 10;
        }

        .sidebar.collapsed {
            transform: translateX(-100%);
        }

        .sidebar-header {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .btn-create {
            background-color: #3b82f6;
            color: #ffffff;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: background-color 0.2s;
        }

        .btn-create:hover {
            background-color: #2563eb;
        }

        .main-area {
            flex-grow: 1;
            display: flex;
            padding: 15px;
        }

        .toggle-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 6px;
        }

        .toggle-btn:hover {
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="toggle-btn" id="closeSidebar">✕</button>
        </div>
        <a href="#" class="btn-create">Create</a>
    </div>

    <div class="main-area">
        <button class="toggle-btn" id="openSidebar">☰</button>
    </div>

    <script>
        const sidebar = document.getElementById('sidebar');
        const closeBtn = document.getElementById('closeSidebar');
        const openBtn = document.getElementById('openSidebar');

        closeBtn.addEventListener('click', () => sidebar.classList.add('collapsed'));
        openBtn.addEventListener('click', () => sidebar.classList.remove('collapsed'));

        console.log("Editor script active.");
    </script>
</body>
</html>
