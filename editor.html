<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unique - Editor</title>
    <style>
        body {
            background-color: #1a1d24;
            margin: 0;
            height: 100vh;
            display: flex;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .sidebar {
            width: 250px;
            background-color: #14161b;
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            transition: width 0.3s ease, padding 0.3s ease;
            position: relative;
            z-index: 10;
        }

        .sidebar.collapsed {
            width: 70px;
            padding: 20px 10px;
        }

        .sidebar-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .toggle-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.4rem;
            cursor: pointer;
            padding: 8px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s, background-color 0.2s;
        }

        .toggle-btn:hover {
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.05);
        }

        .btn-create {
            background-color: #262a33;
            color: #e2e8f0;
            padding: 12px 16px;
            font-size: 0.95rem;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background-color 0.2s, border-color 0.2s;
            white-space: nowrap;
            overflow: hidden;
        }

        .btn-create:hover {
            background-color: #313642;
            border-color: rgba(255, 255, 255, 0.15);
        }

        .sidebar.collapsed .btn-create span.text {
            display: none;
        }

        .sidebar.collapsed .btn-create {
            padding: 12px 0;
            justify-content: center;
        }

        .main-area {
            flex-grow: 1;
        }

        /* Модальное окно */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 100;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background-color: #14161b;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 30px;
            width: 380px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            color: #e2e8f0;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #ffffff;
            margin: 0;
        }

        .modal-close {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .modal-close:hover {
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.05);
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-item {
            background-color: #262a33;
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px 16px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            text-align: left;
            transition: background-color 0.2s, border-color 0.2s;
            width: 100%;
        }

        .option-item:hover {
            background-color: #313642;
            border-color: rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-top">
            <button class="toggle-btn" id="toggleSidebar" title="Toggle Sidebar">☰</button>
        </div>
        
        <button class="btn-create" id="openModal">
            <span class="icon">+</span>
            <span class="text">Create</span>
        </button>
    </div>

    <div class="main-area"></div>

    <!-- Модальное окно -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Create new project</h3>
                <button class="modal-close" id="closeModal">✕</button>
            </div>
            <div class="options-list">
                <button class="option-item" onclick="selectOption('Video')">Video</button>
                <button class="option-item" onclick="selectOption('Photo')">Photo</button>
                <button class="option-item" onclick="selectOption('Presentation')">Presentation</button>
            </div>
        </div>
    </div>

    <script>
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('toggleSidebar');
        const openModalBtn = document.getElementById('openModal');
        const closeModalBtn = document.getElementById('closeModal');
        const modalOverlay = document.getElementById('modalOverlay');

        // Сворачивание/раскрытие сайдбара
        toggleBtn.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
        });

        // Открытие модального окна
        openModalBtn.addEventListener('click', () => {
            modalOverlay.classList.add('active');
        });

        // Закрытие модального окна
        closeModalBtn.addEventListener('click', () => {
            modalOverlay.classList.remove('active');
        });

        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                modalOverlay.classList.remove('active');
            }
        });

        // Функция обработки выбора пункта
        function selectOption(type) {
            if (type === 'Video') {
                window.location.href = 've.html';
            } else {
                console.log("Selected:", type);
                modalOverlay.classList.remove('active');
            }
        }
    </script>
</body>
</html>
